    post:
      operationId: createDeployment
      x-public: true
      tags: [Deployments]
      summary: Boot a sealed sandbox from a built image
      description: |
        The sandbox runs the image's own `ENTRYPOINT`/`CMD` and nothing else:
        it is **sealed**, so the sandboxes daemon refuses every command, file
        write and terminal in it, to everyone, until it is unsealed — and
        the first after that makes it `tainted` for good. Its
        logs are read (`…/logs`) and its ports published (`…/tunnels`); it
        reaches nothing on the internet but the hosts it is made with
        (`allow`).

