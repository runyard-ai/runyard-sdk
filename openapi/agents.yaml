          x-enum-varnames: [SessionCostStepHour, SessionCostStepDay]
        infrastructure:
          description: >-
            Its sandboxes, their tunnels and its disk, as the workspace's costs say them: in the sandboxes daemon's currency.
          allOf: [{$ref: "#/components/schemas/CostReport"}]
        tokens:
          description: Its calls to its models over the window, what they used and never a price.
