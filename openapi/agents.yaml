        memoryBytes: {type: integer, format: int64, minimum: 0}
        diskBytes: {type: integer, format: int64, minimum: 0}
    CostReport:
      type: object
      description: >-
        What the workspace's infrastructure was spent on over a window, step by step and thing by thing, and what it costs an hour now: its sandboxes server's sandboxes, volumes, images and tunnels, as runyard-sandboxes meters them, at the rates its configuration names.
      required: [currency, rates, window, from, to, step, total, running, series, resources]
      properties:
        currency: {type: string, example: USD}
        rates: {$ref: "#/components/schemas/CostRates"}
        window: {$ref: "#/components/schemas/CostWindow"}
        from: {type: string, format: date-time, description: The first step's start.}
        to: {type: string, format: date-time, description: Now.}
        step:
          type: string
