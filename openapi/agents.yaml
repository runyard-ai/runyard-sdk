      properties:
        id: {type: string, description: Its hostID.}
        name: {type: string}
    InfrastructureImage:
      type: object
      required: [ref, state, sandboxes]
      properties:
        ref: {type: string}
        state: {type: string}
        sizeBytes: {type: integer, format: int64}
        sandboxes: {type: integer, description: How many sandboxes boot from it now.}
    SessionCostWindow:
      type: string
      description: How far back a session's costs go; `24h` by hour, the others by day, in UTC.
      enum: ["24h", "7d", "30d"]
      x-enum-varnames: [SessionCostWindow24h, SessionCostWindow7d, SessionCostWindow30d]
    SessionCostReport:
      type: object
      description: >-
        One session's cost over a window: its infrastructure and its tokens, each in its own currency, and what it was from when to when.
      required: [session, window, from, to, step, infrastructure, tokens, tokensThisHour, timeline]
      properties:
        session:
          type: object
          required: [id, title, createdAt]
