  /v1/brokers/{brokerName}:
    parameters:
      - $ref: "#/components/parameters/BrokerName"
    put:
      operationId: putBroker
      x-public: true
      tags: [Brokers]
      summary: Declare a broker, or change it
      description: |
        `llm`, `egress`, `tunnels`, `sessions` and `images` are the server's
        own: they always exist and are not changed here (`409 in_use`).
        Any other is a `shared` broker: one the sandboxes daemon declares
        under the same name, and dials with the machine's certificate. A
        session's machine is given it, and the broker says the rest itself:
        what the session's environment and git are given to reach it, and
        the MCP server it serves, at `/.well-known/runyard-broker`, and its
        skills, at
        `/.well-known/agent-skills`. What it answers at both is the same
        for every sandbox of the workspace, and kept as long as its
        `Cache-Control: max-age` says (`BrokerSpec`). Its credentials, and
        what it lets through, are the broker's. Another's is changed by an
        admin alone: to anybody else its name is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrokerSpec"}
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Broker"}
        "201":
          description: Declared.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Broker"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "404": {$ref: "#/components/responses/NotFound"}
    get:
      operationId: getBroker
      x-public: true
      tags: [Brokers]
      summary: A broker
      description: A built-in broker the workspace's policy does not allow is `404`.
      responses:
        "200":
          description: The broker.
          content:
