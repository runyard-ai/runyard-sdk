            What the session was over the window, oldest first, each span until the next began: from its creation, or the window's start, to now.
          items: {$ref: "#/components/schemas/SessionStateSpan"}
    SessionStateSpan:
      type: object
      required: [from, to, state, sandboxState]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        state: {$ref: "#/components/schemas/SessionState"}
        sandboxState: {$ref: "#/components/schemas/SandboxState"}
    WorkspaceSettings:
      type: object
      required: [sessionRetention]
      properties:
        sessionRetention: {$ref: "#/components/schemas/SessionRetention"}
        titleSummaries:
          type: boolean
          description: |
            Whether sessions' titles may be summarized by their providers —
            as each person chooses for their sessions (`autoTitle`), and on
            asking (`…/retitle`). Absent is `true`: each summary is a call
            to the session's provider, paid for as the session's, which an
