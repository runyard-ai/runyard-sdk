            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sessions/{sessionId}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: streamEvents
      x-public: true
      tags: [Events]
      summary: The session's transcript, from an event on, and as it happens
      description: |
        One `SessionEvent` per line, from `from` (the first kept when
        absent). With `follow`, the body stays open and every new event is
        written as it happens; a blank line is written at once and every
        15 seconds, for proxies, and readers skip blank lines.

        With `subagent`, only the events of that sub-agent, nested ones
        included — what a UI shows when a person opens one.

        Following, the stream also carries `PartialLine`s: the text and
        thinking the session is writing, before the event that keeps it. They
        are not transcript — never stored, never in a stream that does not
        follow — and a reader tells the two apart by `line`. Each names
        the `seq` its block is expected to take, and the reader holds one
        partial per `seq`:

        - `offset` 0 replaces what the reader holds at that `seq`; `offset`
          equal to the length held appends `text` to it; any other offset is
          ignored. Lengths are UTF-16 code units — a JavaScript string's
          `length`.
        - An event whose `seq` is at least a partial's `seq` replaces it:
          the block is now that event, or gone. A block whose expected place
          moves on — another session's event took it — comes again at its new
          `seq` from `offset` 0.
        - `offset` 0 with empty `text` says the block at that `seq` is gone
          and no event the reader was sent said so (a session stopped
          mid-block, followed through `subagent`): drop it.

        A reader that starts following mid-block gets the block so far, from
        `offset` 0. A slow reader is sent everything new of a block in one
        line, never a queue of them.

        Following, one `CaughtUpLine` is written once every event kept
        when the reader asked has been: what is before it is the
        transcript so far, what is after it happens as it is read. It comes
        before any partial, once per request — a reader that reads again
        from where it was is told again. A reader can fold what is before
        it in one go, and draw a long transcript once, at its end, rather
        than once for every batch the server wrote.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/Follow"
        - name: subagent
          in: query
          schema: {type: string}
          description: A sub-agent's id — the tool call that started it.
      responses:
        "200":
          description: The events and, following, where the reader caught up and the partials.
          content:
            application/x-ndjson:
              schema: {$ref: "#/components/schemas/EventsLine"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Gapped"}
  /v1/changes:
    get:
      operationId: streamChanges
      x-public: true
      tags: [Events]
      summary: Every change to the account's sessions, from a point on, and as it happens
      description: |
        What a chat UI keeps its session list with: list the sessions once,
        note `changeSeq` from the page, and follow from it. One `Change` per
        line; a change carries the session as it is after it. The server
        keeps the last `limits.changesKept`; older is `409 gapped`, and the
        reader lists again.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/Follow"
      responses:
        "200":
          description: The changes.
          content:
            application/x-ndjson:
              schema: {$ref: "#/components/schemas/Change"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Gapped"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/sessions/{sessionId}/exchanges:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listExchanges
      x-public: true
      tags: [Sessions]
      summary: The calls the session's harness made to the model, newest first
      description: |
        The record of what the harness sent: every call the session's `llm`
        broker carried to the provider and back — an *exchange* — kept for
        a while (`--exchanges-kept`, a week by default) and then forgotten,
        and with the session when it is deleted. Calls that count tokens
        and that list the models are kept too, told apart by `path`.

        This is a summary of each, newest first by when it was sent;
        `GET …/exchanges/{exchangeId}` is one whole: the request as sent,
        and the answer.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: model
          in: query
          description: One model's calls.
          schema: {type: string, example: claude-opus-5-5}
        - name: status
          in: query
          description: |
            `ok`, the calls the provider answered with a status below 400;
            `error`, those it answered with 400 or more.
          schema:
            type: string
            enum: [ok, error]
      responses:
        "200":
          description: The exchanges.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExchangePage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/sessions/{sessionId}/exchanges/{exchangeId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: exchangeId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getExchange
      x-public: true
      tags: [Sessions]
      summary: One call the session's harness made to the model, whole
      description: |
        What the session sent — the request body as it went to the provider:
        the system prompt, the messages, the tool definitions, thinking,
        `max_tokens`, `metadata` and the rest — with the headers that change
        its meaning (`anthropic-beta`, `anthropic-version`, `openai-beta`, …), and what the
        provider answered. A credential is never kept, and so is never here.

        A streamed answer is the message assembled from its events — what
        the same call would have answered without `stream` — as far as it
        got: one cut short has no `stop_reason`, and one the provider ended
        with an error event carries that `error`. Any other answer is its
        body; one that is not a JSON object is `{"text": <the body>}`.

        `previousId` and `nextId` are the session's neighbouring exchanges
        by when they were sent, so a caller can walk them from any one.
      responses:
        "200":
          description: The exchange.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Exchange"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/activity:
    get:
      operationId: listActivity
      x-public: true
      tags: [Sessions]
      summary: What sessions did through their brokers, newest first
      description: |
        Every request a session's machine sent through a broker, and the
        answer — recorded as it passed, not said by the session: an MCP
        connector's tool called, a `git push` and the refs it moved, a
        request through an http broker, a host opened through `egress`, a
        tunnel, a session or an image asked for. Kept a while
        (`--activity-kept`, a week by default) and then forgotten; kept
        after its session is deleted, until then.

        Where the sandboxes daemon keeps a record of every brokered request
        — its access gateway's feed, which this server reads — that record
        is the entry, through any broker: this server's own, a shared one
        the daemon dials, one a person's own program serves (`kind:
        gateway`, with how it ended and what it carried). Before a daemon
        has one, this server records the brokers it serves itself, and
        nothing else.

        Not here: the `llm` broker's calls, which are the session's
        exchanges (`GET /v1/sessions/{sessionId}/exchanges`) — but the ones the
        server made itself for the session, as its harness would have, which
        are no part of its conversation: each is here, a `one_off`.

        And beside what sessions did, every call the Runyard platform made to
        this server's API with a platform token: `kind: api`,
        `actor: platform`, no session's and nobody's — an admin's to read.

        A summary of each, the newest first; `GET /v1/activity/{activityId}`
        is one whole. A member reads their own sessions'; an admin, everyone's.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: session
          in: query
          description: One session's.
          schema: {$ref: "#/components/schemas/Id"}
        - name: broker
          in: query
          description: One broker's, by its name in the machine (`mcp-github`, `my-git`, `egress`).
          schema: {type: string}
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/activity/{activityId}:
    parameters:
      - name: activityId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getActivity
      x-public: true
      tags: [Sessions]
      summary: One request a session sent through a broker, and its answer, whole
      description: |
        The request as the session's machine sent it and the answer as the
        broker gave it back: headers, and each body up to a mebibyte
        (`truncated` when it had more, `size` saying how much). A credential
        the machine sent or the answer set is not kept.

        A gateway entry's bodies are not here (`bodiesOnRunner`): they stay
        on the runner that saw the exchange, and are fetched with
