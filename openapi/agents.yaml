        interrupt it first. A pending alarm wakes it again shortly
        before it fires (`nextAlarmAt`).
      responses:
        "202":
          description: Going to sleep.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/sessions/{sessionId}/wake:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: wakeSession
      x-public: true
      tags: [Sessions]
      summary: Give a sleeping session a sandbox again, without a turn
      description: A turn wakes a session by itself; this is for a caller about to open its terminal or files.
      responses:
        "202":
          description: Waking.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Capacity"}
  /v1/sessions/{sessionId}/fork:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: forkSession
      x-public: true
      tags: [Sessions]
