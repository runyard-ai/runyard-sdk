    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: interrupt
      x-public: true
      tags: [Turns]
      summary: Stop what the session is generating
      description: |
        The turn ends with `stopReason: interrupted`. Queued turns are kept
        unless `dropQueued`. Background tasks and sub-agents of the turn are
        not stopped: they are stopped on their own.
