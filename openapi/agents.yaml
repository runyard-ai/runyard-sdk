          description: Archive a session idle this long. An hour to ten years.
        deleteAfterSeconds:
          type: integer
          format: int64
          minimum: 3600
          maximum: 315360000
          description: |
            Delete a session idle this long, archived or not — its sandbox,
            disk and transcript. An hour to ten years, and more than
            `archiveAfterSeconds`.
