      description: |
        Asks the session's provider for a title of what its conversation is
        about, and gives the session it: `titleSource` is `summary`. The call
        is made by the server, not the session's machine, but as the session's
        harness makes its own — its request, its prompt, its model — and is
        paid for as the session's (`…/costs`). It is not one of the session's
        exchanges: it is in the activity (`GET /v1/activity`), a `one_off`.

        `403` when the workspace's `titleSummaries` are off; `400
        not_supported` when the session's harness does not title (its
        `features` lack `title`); `409` when it has not called its model
