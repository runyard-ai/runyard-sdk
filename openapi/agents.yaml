            application/json:
              schema: {$ref: "#/components/schemas/SessionShares"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/sessions/{sessionId}/tokens:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: createSessionToken
      x-public: true
      tags: [Sessions]
      summary: A token a browser talks to this session with
      description: |
        A session token: what an application's backend hands a browser so
        that it talks to the server directly — reading the session, its
        transcript, files and sub-agents, sending and steering its turns,
        uploading what they attach — in this session alone, and nothing
        else (`403`). It is answered from any origin (CORS), being no
        cookie.

        It speaks for its end user, when it has one: its turns are sent
        for them (`Turn.endUser`). Absent, the session's end user; a
        session for an end user has tokens for them alone (`400`), and only
        an application's session has end users at all.

        It is signed by the server and kept nowhere: it ends at
        `expiresAt` — an hour by default, a day at most — or with its
        session, or once its owner may no longer steer it. Whoever may
        steer the session mints one: its owner, or an admin; never a
        session, nor another token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionTokenRequest"}
      responses:
        "201":
          description: The token.
          headers:
            Cache-Control:
              description: "`no-store`: the body is a credential."
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionToken"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/transfers:
    post:
      operationId: transfer
      x-public: true
      tags: [People]
      summary: Hand things to another owner
      description: |
        An admin hands things to another owner, a person or an
        application, all of them or none (`404` for one that is not there,
        `400` for one that cannot be): sessions, each with every session of
        its tree; providers; profiles, brokers, MCP connectors and triggers;
        and connect links, whose keys become their application's, holding
        what of their scopes an application may.

        A session or a provider handed to an application may be given an
        end user; one handed to a person may not. A link is handed to its
        own application alone. A session awake is put to sleep, so that it
        wakes as its new owner's.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Transfer"}
      responses:
        "200":
          description: Handed over.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Transfer"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/search:
    get:
      operationId: searchSessions
      x-public: true
      tags: [Sessions]
      summary: The sessions whose transcripts say something, newest activity first
      description: |
        Of the caller's sessions and those shared with them (`listSessions`
        with `whose: mine`, an admin's as a member's), those whose
        transcripts say every word of `q`: in what a person wrote to them,
        what they answered, the tools they called and the start of what
        those answered. Each comes with the newest event that says it. A word is found inside longer ones (`pull/14` finds
        `…/pull/143`), whatever its case and accents; a word of fewer than
        three characters is not searched for, and a `q` with no other word
        finds nothing. Titles are not searched: a caller has them already.
      parameters:
        - name: q
          in: query
          required: true
          description: The words, separated by spaces.
          schema: {type: string, minLength: 1, maxLength: 200}
        - $ref: "#/components/parameters/Limit"
        - name: archived
          in: query
          description: Archived sessions only, or none of them (the default).
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: The sessions found, at most `limit` of them.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionMatchList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /v1/uploads:
    post:
      operationId: createUpload
      x-public: true
      tags: [Turns]
      summary: Keep a file for a message not sent yet
      description: |
        The bytes are kept as they are — never opened for what they say —
        until a turn names the upload, which makes it that turn's session's.
        Nothing runs in a sandbox for it: the file is put on the session's
        disk when the session is given the turn. One no turn names within
        `limits.uploadTtlSeconds` is evicted.

        It is the caller's: only a turn the caller sends names it. A
        session token's is its session's end user's, so that a page that
        renews its token sends with the new what it uploaded with the old.
      parameters:
        - name: name
          in: query
          required: true
          description: The file's name, without a slash. Where it goes on the session's disk.
          schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "201":
          description: Kept.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Upload"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "404": {$ref: "#/components/responses/NotFound"}
