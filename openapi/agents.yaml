  /v1/sessions/{sessionId}/costs:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSessionCosts
      x-public: true
      tags: [Costs]
      summary: What one session has cost, its infrastructure and its tokens
      description: |
        One session's cost over a window, hour by hour or day by day, in its
        two parts, which are priced apart and never added up across
        currencies:

        - **infrastructure**: its sandboxes — one a wake, each still
          listed once it is released — their tunnels and its disk, as
          runyard-sandboxes meters them, at the rates its configuration
          names and in its currency, with what each costs an hour now;
        - **tokens**: its calls to its models through the `llm` broker, at
          the providers' list prices, in USD.

        And its **timeline**: what the session was, from when to when, over
        the window, by its state events — its sandbox up and generating,
        up and idle, released while it slept.

        An admin's, with `sessions.read`, as the workspace's costs are.
      parameters:
        - name: window
          in: query
