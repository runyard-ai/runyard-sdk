          description: >-
            `ready`: on its runner, to be attached. `transferring`: being moved to `transferringTo`, and attached by nothing until it is there. `deleting`: deleted while its runner is away, and gone once that runner is back.
        sandbox: {type: string, description: "The sandbox that holds it, when one does."}
        runner:
          allOf: [{$ref: "#/components/schemas/InfrastructureRunner"}]
          description: The runner whose disk it is on. Absent on a sandboxes server whose machines run on no runner.
        transferringTo:
          allOf: [{$ref: "#/components/schemas/InfrastructureRunner"}]
          description: While it is `transferring`, the runner it goes to.
        waitingFor:
          allOf: [{$ref: "#/components/schemas/InfrastructureRunner"}]
          description: |
            While it is `deleting` or `transferring` and waits for a runner
            that is away, that runner: it goes on once the runner is back.
        bytes: {type: integer, format: int64}
        allocatedBytes: {type: integer, format: int64}
        lastUsedAt: {type: string, format: date-time}
    InfrastructureRunner:
      type: object
