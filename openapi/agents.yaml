      operationId: cancelQueuedTurn
      x-public: true
      tags: [Turns]
      summary: Take back a turn still waiting in the session's queue
      description: |
        The turn leaves the session's `queue` and is never given to its
        harness. The uploads it named are the caller's again, to attach
        once more or to be evicted. Its `turnId` stays used: sent again, it
        is `200` and changes nothing. `404` once the harness has taken it —
        it is on the stream then — or when no turn of that id waits.
