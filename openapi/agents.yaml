      description: |
        The new session has the transcript up to `atSeq` (the whole of it
        when absent), its harness's conversation to that point, and a
        sandbox of its own. Its lineage is `fork`, `branchedFrom` this
        session at that event.

        The server names the fork, as `POST /v1/sessions` names a session: its
        `id` is in the answer. A retry is made safe by `Idempotency-Key`, the
        same way. `newSessionId` is deprecated, and kept so that a caller
        written against it goes on working while it moves, on the timeline
