    parameters:
      - $ref: "#/components/parameters/McpConnectorName"
    put:
      operationId: putMcpConnectorUsers
      x-public: true
      tags: [MCP connectors]
      summary: "Say who besides its owner may use an MCP connector: whose sessions may be given it"
      description: |
        Its owner's, or an admin's, to say; it replaces whom it was for.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Users"}
      responses:
        "200":
          description: Whom it is for now.
