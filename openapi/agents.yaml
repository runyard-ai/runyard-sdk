          x-enum-varnames: [CostStepHour, CostStepDay]
        total:
          description: What was spent over the window.
          allOf: [{$ref: "#/components/schemas/CostAmounts"}]
        running:
          description: What is held now costs an hour, at today's rates.
          allOf: [{$ref: "#/components/schemas/CostAmounts"}]
        series:
          type: array
          description: Every step of the window, oldest first, those nothing was spent in too.
          items: {$ref: "#/components/schemas/CostBucket"}
        resources:
          type: array
          description: >-
            Everything that cost anything in the window, or was held in it, live or not, the most expensive first: at most 500.
          items: {$ref: "#/components/schemas/CostResource"}
    UsageReport:
      type: object
      required: [range, step, from, to, totals, buckets, byProvider, byModel, bySession]
      properties:
        range:
          type: string
          enum: ["1d", "7d", "30d"]
        step:
          type: string
          enum: [hour, day]
        from:
          type: string
          format: date-time
          description: The start of the first bucket.
        to:
          type: string
          format: date-time
          description: The end of the last bucket.
        totals: {$ref: "#/components/schemas/UsageTotals"}
        buckets:
          type: array
          description: Every bucket of the range, oldest first, the empty ones too.
          items: {$ref: "#/components/schemas/UsageBucket"}
        byProvider:
          type: array
          description: The range's totals, by provider, the most tokens first.
          items: {$ref: "#/components/schemas/ProviderUsage"}
        byModel:
          type: array
          description: The range's totals, by model, the most tokens first.
          items: {$ref: "#/components/schemas/ModelUsage"}
        bySession:
          type: array
          description: The range's 20 sessions that used the most tokens.
          maxItems: 20
          items: {$ref: "#/components/schemas/SessionUsage"}
    UsageTotals:
      type: object
      required: [requests, errors, tokens]
      properties:
        requests: {type: integer, format: int64}
        errors:
          type: integer
          format: int64
          description: The requests the provider answered with a status of 400 or more.
        tokens: {$ref: "#/components/schemas/UsageTokens"}
    UsageTokens:
      type: object
      required: [input, output, cacheWrite, cacheRead, total]
      description: |
        The same four for every provider. `input` is what was not read from
        the cache — OpenAI's `input_tokens` less its cached ones, which are
        `cacheRead`; OpenAI caches without charging a write, so its
        `cacheWrite` is 0.
      properties:
        input: {type: integer, format: int64}
        output:
          type: integer
          format: int64
          description: Reasoning tokens included.
        cacheWrite: {type: integer, format: int64}
        cacheRead: {type: integer, format: int64}
        reasoning:
          type: integer
          format: int64
          description: Of `output`, what the model spent reasoning, when the provider counts it apart (OpenAI's `reasoning_tokens`). Not added to `total` again.
        total:
          type: integer
          format: int64
          description: The four summed.
    UsageBucket:
      allOf:
        - $ref: "#/components/schemas/UsageTotals"
        - type: object
          required: [start]
          properties:
            start:
              type: string
              format: date-time
              description: The bucket's first instant; it lasts the report's `step`.
    ProviderUsage:
      type: object
      required: [provider, totals]
      properties:
        provider: {$ref: "#/components/schemas/Name"}
        totals: {$ref: "#/components/schemas/UsageTotals"}
    ModelUsage:
      type: object
      required: [model, totals]
      properties:
        model: {type: string, example: claude-opus-5-5}
        totals: {$ref: "#/components/schemas/UsageTotals"}
    SessionUsage:
      type: object
      required: [sessionId, totals]
      properties:
        sessionId: {$ref: "#/components/schemas/Id"}
        title:
          type: string
          description: Absent when the session is gone.
        totals: {$ref: "#/components/schemas/UsageTotals"}
    ExchangeSummary:
      type: object
      required: [id, at, durationMs, provider, path, status, usage, cost, messageCount, toolCount, systemChars]
      description: One call a session's harness made to the model, in short.
      properties:
        id:
          type: string
          description: The server's, opaque.
        at:
          type: string
          format: date-time
          description: When the call was sent to the provider.
        durationMs:
          type: integer
          format: int64
          description: From then until the answer ended, or was cut.
        provider: {$ref: "#/components/schemas/Name"}
        path:
          type: string
          description: The API's path the call was to — `/v1/messages` for Anthropic, `/responses` for Codex.
          example: /v1/messages
        model:
          type: string
          description: What the call asked for; absent when it named none.
          example: claude-opus-5-5
        status:
          type: integer
          description: The provider's answer's.
          example: 200
        stopReason:
          type: string
          description: Why the model stopped; absent when it did not say.
          example: tool_use
        usage: {$ref: "#/components/schemas/UsageTokens"}
        cost: {$ref: "#/components/schemas/ExchangeCost"}
        messageCount:
          type: integer
          description: The messages the request carried — of an OpenAI Responses call, its `input` items.
        toolCount:
          type: integer
          description: The tool definitions the request carried.
        systemChars:
          type: integer
          description: The length of the request's system prompt, every block of it, in characters — of a Responses call, its `instructions`.
    ExchangeCost:
      type: object
      required: [usd, priced]
      properties:
        usd:
          type: number
          format: double
          description: What the call's tokens cost at the provider's list prices.
        priced:
          type: boolean
          description: False when the server has no price for the model, and `usd` is 0.
    Exchange:
      description: |
        One call a session's harness made to the model, whole: the record of
        what it sent, and what it was answered.
      allOf:
        - $ref: "#/components/schemas/ExchangeSummary"
        - type: object
          required: [request, requestHeaders, response, responseHeaders]
          properties:
            request:
              type: object
              additionalProperties: true
              description: The body as sent; `{}` for a call that had none.
            requestHeaders:
              type: object
              additionalProperties: {type: string}
              description: The headers sent that change what the body means (`anthropic-beta`, `anthropic-version`, `openai-beta`, …), by lower-case name. Never a credential.
            response:
              type: object
              additionalProperties: true
              description: The answer — of a stream, the message assembled from its events.
            responseHeaders:
              type: object
              additionalProperties: {type: string}
              description: The answer's rate-limit and request-id headers, by lower-case name.
            previousId:
              type: string
              description: The session's exchange sent just before this one; absent for its first.
            nextId:
              type: string
              description: The session's exchange sent just after this one; absent for its last.
    ActivitySummary:
      type: object
      description: |
        One request a session sent through a broker — or the platform sent
        to this server's API (`kind: api`) — said in a line.
      required: [id, at, broker, kind, action, target, status, durationMs]
      properties:
        id: {type: string}
        at: {type: string, format: date-time, description: When it was sent.}
        sessionId:
          allOf: [{$ref: "#/components/schemas/Id"}]
          description: |
            The session whose machine sent it. Absent for a gateway entry of a
            sandbox that is no session's — a deployment a person made, an
            image's build, one the server never knew — which is its
            person's to read, or an admin's when it is nobody's.
        owner:
          allOf: [{$ref: "#/components/schemas/Owner"}]
          description: The session's owner, or the deployment's. Absent when it is nobody's.
        broker:
          type: string
          description: "The broker's name in the machine; empty for a call to this server's API (`kind: api`)."
          example: mcp-github
        actor:
          type: string
          enum: [platform]
          description: |
            Who sent it, when no session's machine did: `platform`, the
            Runyard platform calling this server's API with a platform
            token (`kind: api`). Absent for everything a session sent.
        kind:
          type: string
          enum: [mcp, egress, tunnels, sessions, images, gateway, one_off, api]
          description: |
            What the broker is, which says how its requests are read.
            `gateway` is the sandboxes daemon's record of the request,
            through whatever broker: its `action` is what the broker said it
            was (`Runyard-Activity`), or the method, path and status.
            `one_off` is a call the server made for the session through its
            `llm` broker, as its harness would have — `summarize title`,
            say — and not one its machine sent: its `target` is the model.
            `api` is a call made to this server's own API by `actor`: its
            `action` is the method and the path.
        action:
          type: string
          description: What it was, in a few words.
          example: call create_issue
        target:
          type: string
          description: What it was done to — the MCP connector, the repository — when that is not the broker.
          example: github
        status: {type: integer, description: "The answer's HTTP status; 0 when there was none."}
        error:
          type: string
          description: What went wrong, when something did — the answer's words, or the tool's, or the gateway's.
        durationMs: {type: integer, format: int64}
        outcome:
          type: string
          enum: [ok, refused, unreachable, broken, lost]
          description: |
            A gateway entry's: `ok`; `refused` by the daemon, nothing sent
            anywhere — a broker the machine was not given, its connection
            limit; `unreachable`, a broker that could not be reached;
            `broken`, cut part of the way; `lost`, standing for records the
            daemon could not keep, how many in `error`.
        bytesIn:
          type: integer
          format: int64
          description: A gateway entry's bytes from the machine.
        bytesOut:
          type: integer
          format: int64
          description: A gateway entry's bytes to the machine.
    ActivityMessage:
      type: object
      description: A request or an answer as it was sent.
      required: [headers, body, bodyEncoding, size, truncated]
      properties:
        method: {type: string, description: "A request's."}
        url: {type: string, description: "A request's: its path and query."}
        status: {type: integer, description: "An answer's."}
        headers:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        body: {type: string, description: "As much of the body as was kept."}
        bodyEncoding: {$ref: "#/components/schemas/BodyEncoding"}
        size: {type: integer, format: int64, description: How many bytes the body had.}
        truncated: {type: boolean, description: That `body` is not all of it.}
    Activity:
      allOf:
        - $ref: "#/components/schemas/ActivitySummary"
        - type: object
          required: [request, response]
          properties:
            request: {$ref: "#/components/schemas/ActivityMessage"}
            response: {$ref: "#/components/schemas/ActivityMessage"}
            bodiesOnRunner:
              type: boolean
              description: |
                That its bodies are not in `request` and `response` but on the
                runner that saw the exchange: `GET
                /v1/activity/{activityId}/body` fetches them. Absent when they
                are here, or there were none.
    BodyEncoding:
      type: string
      enum: [utf8, base64]
      description: "`utf8` for a body that is UTF-8 text, `base64` for anything else."
    ActivityBodies:
      type: object
      description: An entry's two bodies, as much of each as was kept. Absent where there was none.
      properties:
        request: {$ref: "#/components/schemas/ActivityBody"}
        response: {$ref: "#/components/schemas/ActivityBody"}
    ActivityBody:
      type: object
      required: [body, bodyEncoding]
      properties:
        body: {type: string}
        bodyEncoding: {$ref: "#/components/schemas/BodyEncoding"}
    ActivityPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/ActivitySummary"}
    ExchangePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/ExchangeSummary"}
    Session:
      type: object
      required: [id, title, owner, state, config, sandbox, lineage, labels, work, usage, firstSeq, lastSeq, createdAt, lastActivityAt]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        title: {type: string}
        titleSource: {$ref: "#/components/schemas/TitleSource"}
        autoTitle:
          type: boolean
          description: |
            Whether its title is summarized from its conversation, as its
            harness would, a few seconds after its first answer begins —
            once, and never over a title a person gave it. Only where its
            harness has the `title` feature and the workspace's
            `titleSummaries` allow it.
        owner:
          allOf: [{$ref: "#/components/schemas/Owner"}]
          description: Whose it is — who steers it, shares it and opens its tunnels, and what it may use.
        endUser:
          allOf: [{$ref: "#/components/schemas/EndUser"}]
          description: For an application's session, whom it is for, when it is for somebody.
        state: {$ref: "#/components/schemas/SessionState"}
        error:
          type: string
          description: Why it failed, or why its last turn did.
        profile: {$ref: "#/components/schemas/ProfileRef"}
        config:
          allOf: [{$ref: "#/components/schemas/SessionConfig"}]
          description: |
            What it runs with, its profile's and its overrides resolved, and
            its turns' choices since: `provider` and `model` always say
            what it is on.
        sandbox: {$ref: "#/components/schemas/SessionSandbox"}
        starting: {$ref: "#/components/schemas/SessionStarting"}
        lineage: {$ref: "#/components/schemas/SessionLineage"}
        labels:
          type: object
          additionalProperties: {type: string}
        work: {$ref: "#/components/schemas/SessionWork"}
        queue:
          type: array
          items: {$ref: "#/components/schemas/QueuedTurn"}
          description: |
            The turns waiting for its harness, in the order it is given them:
            its `firstTurn`, from when it is made until a harness is up to take
            it — kept while its sandbox is made, and when that failed, for its
            next wake — then those sent while it was generating or starting.
            None is on its stream until the harness takes it — each then a
            `user` event of the same `turnId`. Absent when none waits.

            Kept until it is taken or taken back: a server that stops, a
            session put to sleep, archived, or whose machine could not be
            made loses none of it. A server that starts wakes every session
            asleep, and not archived, with turns waiting.
            `work.queuedTurns` counts those sent after the first.
        usage:
          allOf: [{$ref: "#/components/schemas/Usage"}]
          description: |
            Summed over the session's turns — its sub-agents' included — but
            `contextTokens` and `contextWindow`, which are the last turn's.
        pendingUsage:
          allOf: [{$ref: "#/components/schemas/Usage"}]
          description: |
            What the turn in flight has spent so far, as its harness has said
            message by message, at list prices — its sub-agents' included —
            and `contextTokens`, how full its context is now: kept again as
            each message fills it, and as a compaction in the turn empties it.
            Not yet in `usage`, which the turn's end adds its own count to.
            Absent while no turn is in flight, or none has spent anything yet.
        firstSeq:
          type: integer
          format: int64
          description: The oldest event kept.
        lastSeq:
          type: integer
          format: int64
          description: The newest event.
        createdAt: {type: string, format: date-time}
        lastActivityAt:
          type: string
          format: date-time
          description: >-
            When it was last sent a turn, or made: what a list of sessions is ordered by. What it does of itself — its answers, its alarms — does not move it.
        nextAlarmAt:
          type: string
          format: date-time
          description: When the soonest of its pending alarms fires. A sleeping session is woken shortly before.
        archivedAt: {type: string, format: date-time}
        pausedAt:
          type: string
          format: date-time
          description: |
            When its person was offboarded (`User.offboardedAt`): it sleeps,
            and wakes for nothing — a turn, an alarm, a trigger — until they
            are back or an admin takes it over.
        idleSince:
          type: string
          format: date-time
          description: |
            When it last stopped working — made, a turn of its ended, its
            terminal left, restored, unlocked or unpinned — which the workspace's
            `sessionRetention` counts from. Absent for a session made before
            it was kept, which counts from `lastActivityAt`.
        locked:
          type: boolean
          description: |
            It is neither archived nor deleted, by the workspace's
            `sessionRetention` or by anybody, until it is unlocked
            (`PATCH` with `locked`). Absent is unlocked.
        pinned:
          type: boolean
          description: |
            Its sandbox is never put to sleep for being idle, and the
            workspace's `sessionRetention` neither archives nor deletes it,
            until it is unpinned (`PATCH` with `pinned`). Absent is unpinned.
    SessionPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items, changeSeq]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/Session"}
            changeSeq:
              type: integer
              format: int64
              description: >-
                The newest change this page reflects. Follow `GET /v1/changes` from `changeSeq + 1` to keep the list; following from `changeSeq` itself replays that one change, which is harmless, since a change carries the whole session.
    SessionMatchList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SessionMatch"}
    SessionMatch:
      type: object
      description: A session whose transcript says what was searched for, and where it last says it.
      required: [session, seq, at, snippet]
      properties:
        session: {$ref: "#/components/schemas/Session"}
        seq:
          type: integer
          format: int64
          description: The newest event that says it.
        at: {type: string, format: date-time}
        snippet:
          type: array
          description: |
            The words around what was found in that event, in order, with
            the parts that matched marked: text to render as text, never as
            markup — it is the session's.
          items: {$ref: "#/components/schemas/SnippetPart"}
    SnippetPart:
      type: object
      required: [text, match]
      properties:
        text: {type: string}
        match:
          type: boolean
          description: Whether this part is what was searched for.
    ForkRequest:
      type: object
      properties:
        newSessionId:
          allOf: [{$ref: "#/components/schemas/Id"}]
          deprecated: true
          description: >-
            The fork's id, chosen by the caller. Deprecated, and removed 2027-01-31: absent, the server names the fork, and `Idempotency-Key` makes a retry safe.
        atSeq:
          type: integer
          format: int64
          description: The last event the fork keeps, a `turn_ended`. All of them when absent.
        disk:
          type: boolean
          description: |
            Whether the fork also has a copy of this session's `/workspace`
            as it is now. False when absent: the fork's `/workspace` starts
            empty.
        title: {type: string, maxLength: 200}
        labels:
          type: object
          additionalProperties: {type: string}
        resources: {$ref: "#/components/schemas/Resources"}
    Attachment:
      type: object
      required: [kind]
      description: |
        | kind | what it is |
        |---|---|
        | `file` | a file on the session's disk, at `path` |
        | `upload` | a file uploaded for the turn, `uploadId`; once the turn is taken, its `name` is said too — while it waits in the queue as well — and once the session is given it, the `path` it was put at |
        | `quote` | `text` quoted from a session's event, `sessionId` and `seq` |
        | `session` | another session, `sessionId`, referenced for the session to read through the `sessions` broker, and from then on its to read; its title is said as `name`, the server's to say. One the caller cannot read is refused |
        | `context` | `text` the caller gives the session beside the message — what it is about, how to go about it — under a `name` a person knows it by, one line of at most 255 characters. Up to 8192 bytes, the session is given the text in its turn; longer, up to 200000 characters, it is put on the session's disk and the session is told the `path` to read it at, the server's to say. The transcript keeps the text either way |
      properties:
        kind:
          type: string
          enum: [file, upload, quote, session, context]
        path: {type: string}
        uploadId: {type: string, pattern: "^[0-9a-f]{32}$"}
        name: {type: string}
        text: {type: string}
        sessionId: {$ref: "#/components/schemas/Id"}
        seq: {type: integer, format: int64}
    Upload:
      type: object
      required: [id, name, size, expiresAt]
      properties:
        id: {type: string, pattern: "^[0-9a-f]{32}$"}
        name: {type: string}
        size: {type: integer, format: int64}
        expiresAt:
          type: string
          format: date-time
          description: When it is evicted, unless a turn names it first.
    Turn:
      type: object
      required: [turnId, text]
      properties:
        turnId:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
          description: The caller's, for retries. `gh-issue-1234-comment-9` reads better than a UUID in a log.
        text: {type: string, maxLength: 200000}
        attachments:
          type: array
          maxItems: 32
          items: {$ref: "#/components/schemas/Attachment"}
        mode:
          type: string
          enum: [queue, interrupt]
          default: queue
        provider:
          allOf: [{$ref: "#/components/schemas/Name"}]
          description: |
            The provider this turn runs on, by name, and the session's from
            then on. The session's when absent. A change restarts its harness
            before the turn, resumed from the transcript.
        model:
          type: string
          example: claude-haiku-4-5-20251001
          description: The model this turn runs on, and the session's from then on, as `provider` is.
        endUser:
          allOf: [{$ref: "#/components/schemas/EndUser"}]
          description: |
            Whom an application's turn is sent for. Only the application
            names one — a session token's turns are its end user's, and any
            other caller's are nobody's — and a session for an end user takes
            turns for them alone (`400`). Absent, the session's end user.

            A turn sent for an end user who has a provider of the session's
            owner's, of a type its harness runs on, runs on it, unless it
            names one; and a tunnel it opens is open to their `email`.
    TurnAccepted:
      type: object
      required: [turnId, position]
      properties:
        turnId: {type: string}
        position:
          type: integer
          description: 0 taken now; n, behind n-1 queued turns.
    Subagent:
      type: object
      required: [id, type, description, running, async, steps, startedAt]
      properties:
        id:
          type: string
          description: The tool call that started it — its events' `parentToolId`.
        parentId:
          type: string
          description: The sub-agent that started it, for a nested one.
        type: {type: string, example: Explore}
        description: {type: string}
        running: {type: boolean}
        async:
          type: boolean
          description: Started in the background; it is a background task too.
        steps:
          type: integer
          description: Its tool calls so far.
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        startSeq: {type: integer, format: int64}
        usage: {$ref: "#/components/schemas/Usage"}
    BackgroundTask:
      type: object
      required: [id, kind, description, state, startedAt]
      properties:
        id:
          type: string
          description: The tool call that started it.
        kind:
          type: string
          enum: [shell, monitor, subagent]
        description: {type: string}
        command: {type: string}
        state:
          type: string
          enum: [running, completed, failed, stopped]
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        outputPath:
          type: string
          description: Where its output is written on the session's disk — read it with `…/files/content`.
    Alarm:
      type: object
      required: [id, kind, prompt, recurring, durable, firedBy, state, createdAt]
      properties:
        id:
          type: string
          description: The cron job's id, as the harness named it; for a wakeup, the tool call that set it.
        kind:
          type: string
          enum: [wakeup, cron]
          x-enum-varnames: [AlarmWakeup, AlarmCron]
          description: |
            `wakeup`: one prompt after a delay — Claude Code's
            `ScheduleWakeup`, of which one is pending at a time. `cron`: a
            prompt on a cron expression — `CronCreate`.
        prompt: {type: string}
        cron:
          type: string
          description: Its cron expression, in the sandbox's time zone (UTC).
          example: "*/5 * * * *"
        reason:
          type: string
          description: Why the session set it, as it said.
        recurring:
          type: boolean
          description: It fires on every match of its expression until it expires, rather than once.
        durable:
          type: boolean
          description: The harness keeps it on the session's disk, and loads it again when it starts — so it is the harness's to fire across a sleep.
        firedBy:
          type: string
          enum: [harness, server]
          x-enum-varnames: [AlarmFiredByHarness, AlarmFiredByServer]
          description: Who fires it next — the harness's process, or the server, once the process that held it ended.
        state:
          type: string
          enum: [pending, fired, cancelled, expired]
          x-enum-varnames: [AlarmPending, AlarmFired, AlarmCancelled, AlarmExpired]
        createdAt: {type: string, format: date-time}
        nextAt:
          type: string
          format: date-time
          description: When it fires next, while it is pending.
        lastFiredAt: {type: string, format: date-time}
        expiresAt:
          type: string
          format: date-time
          description: When a recurring one stops firing.
    TaskStatus:
      type: string
      enum: [pending, in_progress, completed]
    Task:
      type: object
      required: [id, subject, status, blockedBy, updatedAt]
      properties:
        id: {type: string}
        subject: {type: string}
        description: {type: string}
        activeForm:
          type: string
          description: What the session says while it does it — "Running the tests".
        status: {$ref: "#/components/schemas/TaskStatus"}
        owner:
          type: string
          description: The sub-agent doing it, when one is.
        blockedBy:
          type: array
          items: {type: string}
        updatedAt: {type: string, format: date-time}
    SessionTask:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [sessionId, sessionTitle]
          properties:
            sessionId: {$ref: "#/components/schemas/Id"}
            sessionTitle: {type: string}
    TaskPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/SessionTask"}
    FileEntry:
      type: object
      required: [name, kind, size, modifiedAt]
      properties:
        name: {type: string}
        kind:
          type: string
          enum: [file, directory, symlink]
        size: {type: integer, format: int64}
        modifiedAt: {type: string, format: date-time}
    Tunnel:
      type: object
      required: [name, port, state]
      properties:
        name: {type: string}
        port: {type: integer}
        url:
          type: string
          format: uri
          description: Where a visitor goes, once the gateway serves it.
        state:
          type: string
          description: The daemon's word for whether a visitor can reach it now.
          enum: [served, paused, expired, pending, sandbox_not_running, relay_unreachable, gateway_unreachable, refused]
        message:
          type: string
          description: Why it is `refused`, as the gateway says.
        description: {type: string}
        emails:
          type: array
          items: {type: string}
          description: Who may reach it by signing in at the gateway.
        deploymentId:
          type: string
          description: In `GET /v1/tunnels`, the deployment it publishes.
        sessionId:
          type: string
          description: In `GET /v1/tunnels`, the session whose sandbox it publishes.
    EgressRule:
      type: object
      required: [name, openedBySession, domains, ports, paused]
      properties:
        name:
          type: string
          description: The rule's name on the sandbox, which is what drops it.
          example: agent-pypi-org-3f2a9c1e
        openedBySession:
          type: boolean
          description: >-
            Whether the session opened it, through the egress broker. False is a rule the sandbox was made with, from the session's config.
        domains:
          type: array
          items: {type: string}
          description: The domains it opens, a leading `*.` for a suffix.
        cidrs:
          type: array
          items: {type: string}
          description: The ranges it opens. Never on a session's rule.
        internet:
          type: boolean
          description: Whether it opens every public address.
        ports:
          type: array
          items: {type: string}
          description: What it opens, the daemon's default (`tcp/80`, `tcp/443`) written out.
          example: [tcp/443]
        paused:
          type: boolean
          description: A paused rule is kept and opens nothing.
    EventsLine:
      description: |
        One line of a session's events stream, which `line` says the kind
        of: an event of the transcript, a partial, or where the reader
        caught up.
      oneOf:
        - $ref: "#/components/schemas/SessionEvent"
        - $ref: "#/components/schemas/PartialLine"
        - $ref: "#/components/schemas/CaughtUpLine"
      discriminator:
        propertyName: line
        mapping:
          event: "#/components/schemas/SessionEvent"
          partial: "#/components/schemas/PartialLine"
          caughtUp: "#/components/schemas/CaughtUpLine"
    CaughtUpLine:
      type: object
      description: Every event kept when the reader asked has been sent. Sent only while following, once.
      required: [line, caughtUp]
      properties:
        line: {type: string, enum: [caughtUp]}
        caughtUp: {$ref: "#/components/schemas/CaughtUp"}
    CaughtUp:
      type: object
      required: [seq]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 0
          description: The last event the stream has sent — or, when it sent none, the seq before `from`.
    PartialLine:
      type: object
      description: What the session is writing, before it is an event. Sent only while following.
      required: [line, partial]
      properties:
        line: {type: string, enum: [partial]}
        partial: {$ref: "#/components/schemas/Partial"}
    Partial:
      type: object
      required: [seq, kind, offset, text]
      properties:
        seq:
          type: integer
          format: int64
          description: The seq the completed block is expected to take — the event that replaces this.
        kind:
          type: string
          enum: [text, thinking]
          description: The event the block becomes.
        parentToolId:
          type: string
          description: The sub-agent writing it; absent, the session's own harness.
        offset:
          type: integer
          format: int64
          minimum: 0
          description: Where `text` goes in the block, in UTF-16 code units of what was sent of it before.
        text:
          type: string
          description: The block from `offset` on, as far as it is written. Empty at offset 0, the block is gone.
    SessionEvent:
      type: object
      required: [line, seq, at, event]
      properties:
        line: {type: string, enum: [event]}
        seq:
          type: integer
          format: int64
          description: Its place in the session's transcript, from 1, without gaps.
        at: {type: string, format: date-time}
        event: {$ref: "#/components/schemas/Event"}
    Event:
      description: |
        What happened, by `type`. Everything a session wrote — text, tool
        input, tool output — is the session's, and the session read things
        written by anybody: render it as text, never as markup.

        `parentToolId`, where present, is the sub-agent that produced the
        event; absent, it is the session's own harness.
      oneOf:
        - $ref: "#/components/schemas/SessionStartedEvent"
        - $ref: "#/components/schemas/UserEvent"
        - $ref: "#/components/schemas/TurnStartedEvent"
        - $ref: "#/components/schemas/ThinkingEvent"
        - $ref: "#/components/schemas/TextEvent"
        - $ref: "#/components/schemas/ToolCallEvent"
        - $ref: "#/components/schemas/ToolResultEvent"
        - $ref: "#/components/schemas/TurnEndedEvent"
        - $ref: "#/components/schemas/CompactionEvent"
        - $ref: "#/components/schemas/RewoundEvent"
        - $ref: "#/components/schemas/SubagentEvent"
        - $ref: "#/components/schemas/BackgroundTaskEvent"
        - $ref: "#/components/schemas/AlarmEvent"
        - $ref: "#/components/schemas/TasksEvent"
        - $ref: "#/components/schemas/EgressEvent"
        - $ref: "#/components/schemas/SessionStartedChildEvent"
        - $ref: "#/components/schemas/StateEvent"
        - $ref: "#/components/schemas/ErrorEvent"
      discriminator:
        propertyName: type
        mapping:
          session_started: "#/components/schemas/SessionStartedEvent"
          user: "#/components/schemas/UserEvent"
          turn_started: "#/components/schemas/TurnStartedEvent"
          thinking: "#/components/schemas/ThinkingEvent"
          text: "#/components/schemas/TextEvent"
          tool_call: "#/components/schemas/ToolCallEvent"
          tool_result: "#/components/schemas/ToolResultEvent"
          turn_ended: "#/components/schemas/TurnEndedEvent"
          compaction: "#/components/schemas/CompactionEvent"
          rewound: "#/components/schemas/RewoundEvent"
          subagent: "#/components/schemas/SubagentEvent"
          background_task: "#/components/schemas/BackgroundTaskEvent"
          alarm: "#/components/schemas/AlarmEvent"
          tasks: "#/components/schemas/TasksEvent"
          egress_rules: "#/components/schemas/EgressEvent"
          child_session: "#/components/schemas/SessionStartedChildEvent"
          state: "#/components/schemas/StateEvent"
          error: "#/components/schemas/ErrorEvent"
    SessionStartedEvent:
      type: object
      description: The session is up — at the start, and again each time it is restarted or woken.
      required: [type, harness, model, cwd, tools]
      properties:
        type: {type: string, enum: [session_started]}
        harness: {type: string}
        harnessVersion:
          type: string
          description: The harness's own version, when it says it.
        model: {type: string}
        cwd: {type: string}
        contextWindow:
          type: integer
          description: The model's, as its provider lists it; absent when the provider does not say.
        tools:
          type: array
          items: {$ref: "#/components/schemas/SessionTool"}
        brokers:
          type: array
          description: The brokers it reaches, besides its MCP connectors.
          items: {$ref: "#/components/schemas/SessionBroker"}
        mcpConnectors:
          type: array
          description: The MCP connectors it was given, whether or not they offered it a tool.
          items: {$ref: "#/components/schemas/SessionMcpConnector"}
        skills:
          type: array
          description: The skills it can load — its brokers', its MCP connectors' and the harness's own.
          items: {$ref: "#/components/schemas/SessionSkill"}
        skillsNotGiven:
          type: array
          description: |
            Skills a broker or an MCP connector brought that the harness was
            not given, because one given before it has the same name: the
            first keeps it, brokers before MCP connectors, each in the order
            the session's config lists them. Each says where it came from.
          items: {$ref: "#/components/schemas/SessionSkill"}
    SessionHarness:
      type: object
      properties:
        seq:
          type: integer
          format: int64
          description: The `session_started`'s.
        at: {type: string, format: date-time}
        started: {$ref: "#/components/schemas/SessionStartedEvent"}
    UserEvent:
      type: object
      description: A turn, as the session was given it.
      required: [type, turnId, text, source]
      properties:
        type: {type: string, enum: [user]}
        turnId: {type: string}
        text: {type: string}
        attachments:
          type: array
          items: {$ref: "#/components/schemas/Attachment"}
        source: {$ref: "#/components/schemas/UserEventSource"}
        keyId: {type: string}
        endUser:
          allOf: [{$ref: "#/components/schemas/EndUser"}]
          description: Whom it was sent for, when it was sent for an application's end user.
        compact:
          type: boolean
          description: |
            A compaction asked for (`POST …/compact`) rather than words: its
            `text` is the command the harness was given. The turn's
            `compaction` event, before its `turn_ended`, says what it did.
            Absent for any other turn.
    UserEventSource:
      type: string
      enum: [user, api, session, trigger, system, alarm]
      description: Who sent it, from the key that did — `user` for a person signed in, or a session token in a browser; `system` for what the server told the session, as a background task ending; `alarm` for an alarm of the session's own that the server fired.
    QueuedTurn:
      type: object
      description: A turn waiting for the session's harness, as it was sent.
      required: [turnId, text, source]
      properties:
        turnId: {type: string}
        text: {type: string}
        attachments:
          type: array
          items: {$ref: "#/components/schemas/Attachment"}
        source: {$ref: "#/components/schemas/UserEventSource"}
        endUser:
          allOf: [{$ref: "#/components/schemas/EndUser"}]
          description: Whom it was sent for, as `UserEvent`'s `endUser` says.
        compact:
          type: boolean
          description: A compaction asked for, waiting, as `UserEvent`'s `compact` says. Absent for any other turn.
        heldUntil:
          type: string
          format: date-time
          description: |
            While somebody edits it (`PUT …/hold`): until when the session
            is given neither it nor any turn behind it, unless the edit is
            saved or let go of first. Absent when it is not held.
    QueuedTurnEdit:
      type: object
      description: What a turn still waiting says instead.
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          maxLength: 200000
          description: Empty only for a turn with attachments, which then says nothing else.
    TurnStartedEvent:
      type: object
      required: [type, turnId]
      properties:
        type: {type: string, enum: [turn_started]}
        turnId: {type: string}
    ThinkingEvent:
      type: object
      required: [type, text]
      properties:
        type: {type: string, enum: [thinking]}
        text: {type: string}
        parentToolId: {type: string}
    TextEvent:
      type: object
      required: [type, text]
      properties:
        type: {type: string, enum: [text]}
        text: {type: string}
        parentToolId: {type: string}
    ToolCallEvent:
      type: object
      description: |
        A tool the session called, by the harness's own name for it, with
        what it was given; its `tool_result` follows with the same
        `toolId`. Claude Code's are its tools' (`Bash`, `Edit`, …, and
        `mcp__<server>__<tool>`). Codex's are:

        - `shell` — a command run: `{"command": "<the command line>",
          "cwd": "<where>"}`; its result is the command's output, `isError`
          when it exited other than 0.
        - `apply_patch` — files changed: `{"changes": [{"path": "…",
          "kind": "add" | "delete" | "update", "movePath"?: "…", "diff":
          "<unified diff; an added file's content>"}]}`; its result is
          `applied`, or why not with `isError`.
        - `mcp__<server>__<tool>` — an MCP tool, as Claude Code names
          them, its arguments as the input.
        - `web_search` — `{"query": "…"}`.
        - `view_image` — `{"path": "…"}`.
        - `image_generation` — `{"prompt"?: "…"}`; its result is where the
          image was saved.
        - any other tool Codex is given — its own name, its arguments as
          the input.
      required: [type, toolId, name, input]
      properties:
        type: {type: string, enum: [tool_call]}
        toolId: {type: string}
        name: {type: string, example: Bash}
        input:
          type: object
          additionalProperties: true
        parentToolId: {type: string}
    ToolResultEvent:
      type: object
      required: [type, toolId, content, isError]
      properties:
        type: {type: string, enum: [tool_result]}
        toolId: {type: string}
        content:
          type: string
          description: What the tool answered, as the session read it, cut at `limits` with `truncated`.
        isError: {type: boolean}
        truncated: {type: boolean}
        parentToolId: {type: string}
        images:
          type: array
          description: |
            The images the tool answered with — what a Read of one gave the
            session — kept by the server as the session's attachments
            (`getAttachment`), so they are seen with the sandbox asleep or gone.
          items: {$ref: "#/components/schemas/ToolImage"}
    SkillFiles:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: {$ref: "#/components/schemas/SkillFile"}
    SkillFile:
      type: object
      required: [path, size]
      properties:
        path:
          type: string
          description: Its path in the skill's directory.
        size: {type: integer, format: int64}
    ToolImage:
      type: object
      required: [uploadId, mediaType]
      properties:
        uploadId: {type: string}
        mediaType: {type: string}
    TurnEndedEvent:
      type: object
      required: [type, turnId, stopReason, usage]
      properties:
        type: {type: string, enum: [turn_ended]}
        turnId: {type: string}
        stopReason:
          type: string
          enum: [end_turn, interrupted, max_tokens, error]
        usage:
          allOf: [{$ref: "#/components/schemas/Usage"}]
          description: This turn's.
    CompactionEvent:
      type: object
      required: [type, trigger, preTokens, postTokens]
      properties:
        type: {type: string, enum: [compaction]}
        trigger:
          type: string
          enum: [manual, auto]
        preTokens: {type: integer, format: int64}
        postTokens: {type: integer, format: int64}
    RewoundEvent:
      type: object
      description: Every event after `toSeq` and before this one no longer counts.
      required: [type, toSeq]
      properties:
        type: {type: string, enum: [rewound]}
        toSeq: {type: integer, format: int64}
    SubagentEvent:
      type: object
      description: A sub-agent started or ended.
      required: [type, subagent]
      properties:
        type: {type: string, enum: [subagent]}
        subagent: {$ref: "#/components/schemas/Subagent"}
    BackgroundTaskEvent:
      type: object
      description: A background task started, or ended.
      required: [type, task]
      properties:
        type: {type: string, enum: [background_task]}
        task: {$ref: "#/components/schemas/BackgroundTask"}
    AlarmEvent:
      type: object
      description: An alarm was set, fired, moved to the server, cancelled or expired.
      required: [type, alarm]
      properties:
        type: {type: string, enum: [alarm]}
        alarm: {$ref: "#/components/schemas/Alarm"}
    TasksEvent:
      type: object
      description: The session's task list changed; this is all of it now.
      required: [type, tasks]
      properties:
        type: {type: string, enum: [tasks]}
        tasks:
          type: array
          items: {$ref: "#/components/schemas/Task"}
    EgressEvent:
      type: object
      description: |
        What the session's sandbox may reach changed; this is all of it now.
        Written when a sandbox wakes with rules other than the last ones
        written, when the session opens or closes a host, and when a rule is
        dropped (`DELETE /v1/sessions/{sessionId}/egress/{ruleName}`).
      required: [type, rules]
      properties:
        type: {type: string, enum: [egress_rules]}
        rules:
          type: array
          items: {$ref: "#/components/schemas/EgressRule"}
          description: The config's first, then the hosts the session opened.
    SessionStartedChildEvent:
      type: object
      description: The harness started another session, through the `sessions` broker or a trigger.
      required: [type, sessionId, title]
      properties:
        type: {type: string, enum: [child_session]}
        sessionId: {$ref: "#/components/schemas/Id"}
        title: {type: string}
        parentToolId: {type: string}
    StateEvent:
      type: object
      description: >-
        The session's state, or its sandbox's, changed — or, while it starts, its start moved on to another phase or another step of its build.
      required: [type, state, sandboxState]
      properties:
        type: {type: string, enum: [state]}
        state: {$ref: "#/components/schemas/SessionState"}
        sandboxState: {$ref: "#/components/schemas/SandboxState"}
        reason: {type: string}
        starting:
          allOf: [{$ref: "#/components/schemas/SessionStarting"}]
          description: The session's `starting`, as it was then.
    ErrorEvent:
      type: object
      required: [type, code, message]
      properties:
        type: {type: string, enum: [error]}
        code:
          type: string
          enum: [provider_error, harness_crashed, sandbox_failed, internal]
        message: {type: string}
        retrying:
          type: boolean
          description: The server is starting the session again by itself.
    Change:
      type: object
      required: [seq, at, op, sessionId]
      properties:
        seq: {type: integer, format: int64}
        at: {type: string, format: date-time}
        op:
          type: string
          enum: [created, updated, deleted]
        sessionId: {$ref: "#/components/schemas/Id"}
        session:
          allOf: [{$ref: "#/components/schemas/Session"}]
          description: As it is after the change; absent when deleted.
    TriggerSpec:
      type: object
      required: [kind, profileId, turn]
      properties:
        kind:
          type: string
          enum: [api, schedule, webhook]
        title: {type: string, maxLength: 200}
        profileId: {$ref: "#/components/schemas/Id"}
        overrides:
          allOf: [{$ref: "#/components/schemas/SessionConfig"}]
          description: Fields of the profile this trigger's sessions start with instead.
        turn:
          type: string
          maxLength: 20000
          description: The first turn, `{{input.<path>}}` replaced from what fired it.
          example: "Review pull request {{input.pull_request.html_url}}"
        schedule: {$ref: "#/components/schemas/Schedule"}
        webhook: {$ref: "#/components/schemas/Webhook"}
        concurrency:
          type: string
          enum: [parallel, skip, queue]
          default: parallel
        enabled: {type: boolean, default: true}
        labels:
          type: object
          description: Given to each session it starts.
          additionalProperties: {type: string}
    Trigger:
      allOf:
        - $ref: "#/components/schemas/TriggerSpec"
        - type: object
          required: [id, owner, createdAt]
          properties:
            id: {$ref: "#/components/schemas/Id"}
            owner:
              allOf: [{$ref: "#/components/schemas/Owner"}]
              description: Who made it — whose the sessions it starts are, and what they may use.
            hookUrl:
              type: string
              format: uri
              description: For `webhook`, where the sender posts.
            secret:
              type: string
              description: For `webhook`, its signing secret — in the answer that created it, and never again.
            nextFireAt:
              type: string
              format: date-time
              description: For `schedule`.
            lastFiring: {$ref: "#/components/schemas/Firing"}
            createdAt: {type: string, format: date-time}
    TriggerPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/Trigger"}
    FireRequest:
      type: object
      required: [firingId]
      properties:
        firingId:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
        input:
          type: object
          additionalProperties: true
        parentId:
          allOf: [{$ref: "#/components/schemas/Id"}]
          description: Only a session calling through its brokers may name it — itself.
    Firing:
      type: object
      required: [id, triggerId, at, by, outcome]
      properties:
        id: {type: string}
        triggerId: {$ref: "#/components/schemas/Id"}
        at: {type: string, format: date-time}
        by:
          type: string
          enum: [api, schedule, webhook]
        keyId: {type: string}
        outcome:
          type: string
          enum: [started, queued, skipped, failed]
        sessionId:
          allOf: [{$ref: "#/components/schemas/Id"}]
          description: The session it started, or queued a turn on.
        error: {type: string}
    FiringPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/Firing"}
