    delete:
      operationId: releaseQueuedTurn
      x-public: true
      tags: [Turns]
      summary: Let go of a turn held while somebody edited it
      description: |
        The edit was abandoned: the turn waits as it was, and is given when
        its turn comes — at once, when the session was kept waiting for it.
        A turn not held is `200` and changes nothing. `404` once the
        harness has taken it, or when no turn of that id waits.
      responses:
        "200":
          description: Let go of; the turn as it waits.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QueuedTurn"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/sessions/{sessionId}/queue/{turnId}/interrupt:
    parameters:
      - $ref: "#/components/parameters/SessionId"
