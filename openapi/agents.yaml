              schema: {type: string}
            Sunset:
              description: "When it is removed (RFC 8594): Sun, 31 Jan 2027 00:00:00 GMT."
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "201":
          description: The fork.
