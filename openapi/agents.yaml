    parameters:
      - $ref: "#/components/parameters/UploadId"
    delete:
      operationId: deleteUpload
      x-public: true
      tags: [Turns]
      summary: Forget a file taken off a message before it was sent
      responses:
        "204":
          description: Gone.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/sessions/{sessionId}/attachments/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/UploadId"
    get:
      operationId: getAttachment
      x-public: true
      tags: [Turns]
      summary: A file sent to the session with a turn, or an image a tool answered with
      description: |
        Kept by the server, so read whether the session is asleep or awake.
        Served as bytes to save, never as a page: it may be anything.
      responses:
        "200":
          description: Its bytes.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/sessions/{sessionId}/turns:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: sendTurn
      x-public: true
      tags: [Turns]
      summary: Say something to the session
      description: |
        Accepted at once and answered on the stream. While the session is
        generating, a turn is queued behind it (`mode: queue`, the default),
        or interrupts it and is taken next (`mode: interrupt`). A sleeping
        session wakes for it. The same `turnId` again is `200` and changes
        nothing — a caller that lost the answer resends.

        A turn never carries bytes. A file from the caller is uploaded
        first (`POST /v1/uploads`) and attached by its `uploadId`: the server
        keeps it, and puts it on the session's disk, under
        `.attachments/<turnId>/`, only when the session is given the turn:
        each at a `path` of its own, numbered when two share a `name`. A
        file already on the session's disk is attached by path. An upload a
        turn names is the session's from then on, served by
        `GET …/attachments/{uploadId}` asleep or awake; one named by no
        turn within `limits.uploadTtlSeconds` is evicted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Turn"}
      responses:
        "200":
          description: That turn was taken already.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TurnAccepted"}
        "202":
          description: Taken.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TurnAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Capacity"}
