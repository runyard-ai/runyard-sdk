# runyard-agents: managed agents on top of runyard-sandboxes.
#
# PROPOSED. Nothing implements this yet: this document is the design, for
# review, before any server is written against it.
#
# 3.0.3 rather than 3.1 for the reason every contract of runyard gives: the far
# end of this document is somebody else's client, generated with a toolchain we
# do not choose, and oapi-codegen — ours — does not support 3.1. A dialect that
# costs a caller a working client buys nothing this document needs.
#
# What is public is said, operation by operation: `x-public: true`. A public
# operation is one runyard promises to programs — in the SDKs, and in the
# public document they are made from and published with
# (openapi/agents.public.yaml, made from this one by
# sdk/go/internal/contract). Every other operation is runyard's own: its
# console's routes, a browser's redirects, a WebSocket, anything not yet
# decided. The server, the UIs and the reference here serve them all.
# Private unless said, so that a new route is promised to nobody by
# accident; and openapi/openapi_test.go refuses a public one no program with
# a key can call.
openapi: 3.0.3
info:
  title: runyard-agents
  version: 0.1.0
  description: |
    **Open a session, talk to it, watch what it does, and let it
    start others.**

    A session is a conversation with a harness — Claude Code or Codex —
    running in a sandbox of its own. This server makes the sandbox
    (through runyard-sandboxes), starts the harness in it, keeps the
    transcript, and serves it to whoever asks: a chat UI, a console, a
    scheduler, a GitHub App, or another session.

    It is the API workspace-platform's chat is adapted to: everything it
    does about conversations — sessions, sub-agents, background tasks, the
    session's task list, brokers, MCP connectors, sessions started by code and
    the lineage between them — and nothing else. Widgets, workflows, objects
    and the rest of workspace-platform are not here, and are not meant to be.

    ### One session, one sandbox

    Every session has a sandbox of its own, with its own resources, and no
    two sessions ever share one. There is no "box" to create first, no
    machine-wide setting to size: `cpus`, `memory` and `disk` are fields of
    the session, defaulted by the server (or the session's harness) and
    capped by it.

    A session's disk outlives its sandbox. A session nobody talks to is put
    to **sleep**: its sandbox is released and its disk kept, and the next
    turn wakes it on a new one. So a session costs a machine only while it
    is working, and a thousand dormant ones cost a thousand disks.

    ### Two liveness domains

    `session.state` is its harness's (`idle`, `generating`, …); `session.sandbox.state`
    is the machine's (`booting`, `ready`, `released`, …). They are separate
    because they fail separately — a harness that crashed in a healthy
    sandbox is relaunched; a sandbox that is gone takes a running harness with
    it — and a caller that conflates them shows a person the wrong thing.

    ### The caller names what it creates

    A session is created with `PUT /v1/sessions/{sessionId}`, the id chosen
    by the caller, and so are profiles, brokers, MCP connectors and triggers. A
    lost response to a create is retried with the same id, and the second
    request finds the first's session rather than making a second one on
    a second machine. The same request again is `200`; a different one is
    `409 spec_conflict`. Turns are idempotent the same way, by `turnId`.

    ### The transcript lives here, append-only

    The server holds every event of every session, numbered by `seq`, and
    nothing is ever rewritten: editing an earlier message is a `rewound`
    event saying which events no longer count, followed by the new ones. A
    reader that kept its place keeps it. Presentation state — what a person
    has seen, what they pinned — is not stored; `labels` are the caller's
    escape hatch.

    ### Streams, not webhooks

    Events are read from a cursor: `GET …/events?from=<seq>&follow=true` is
    chunked `application/x-ndjson`, one event per line, held open while
    following. A reader that fell behind what is kept gets `409 gapped`
    naming the window, never a silent jump. The account's sessions change on
    one feed, `GET /v1/changes`, read the same way: it is how a chat UI keeps
    its list without polling every session. The one WebSocket is a
    session's terminal.

    There are no outbound webhooks. Inbound ones — a trigger's hook — are.

    ### Lineage

    Every session says where it came from: a person (`source: user`), a
    caller with a key (`api`), another session's harness (`session`, with its
    `parentId`), a fork (`fork`, with `branchedFrom`) or a trigger's firing
    (`trigger`, with the trigger and the firing). `rootId` and `depth` are
    kept so that a tree is one query away, and `GET …/lineage` is that tree.

    ### Brokers and MCP connectors keep the credentials out

    Nothing that reaches a sandbox carries a secret. A **broker** is an API
    the session reaches through this server — GitHub, egress, tunnels, a model
    provider — with the credential held here; an **MCP connector** is an MCP
    server, its token or OAuth grant held here, served to the session through
    a broker of its own. Which ones a session gets is a field of the
    session.

    ### One workspace

    A server serves one **workspace**: its sessions, triggers, profiles,
    images, deployments, providers, brokers, MCP connectors, people, keys,
    usage and activity. What the workspace itself is comes from how the
    server is started, never from this API: its name and title
    (`--workspace`, `--workspace-title`), the runyard-sandboxes server it works
    on — the workspace's own (`--sandboxes`), reached with a key that reaches
    every sandbox there (`--sandboxes-key-file`, read at every start) — its
    owner (`--owner`) and its policy (`--policy-file`). `GET /v1/info` says
    them, but the key.

    ### People, and what is whose

    Everything is somebody's: every session, key, provider, profile, broker,
    MCP connector and trigger has an `owner`, the person who made it — for
    a session, whom it is for.

    A person is a **member** or an **admin** of the workspace. An admin
    sees and changes everything in it; a member has the
    chat: their own sessions and those shared with them, which they read and
    do not steer. What a person *uses* — the provider a session runs on, the
    profile it starts from, its brokers and MCP connectors — is their own,
    or one its owner lets them use (`everyone`, `users`), admin or not. A
    key does no more than its owner, and a session calling through its
    brokers no more than its owner, over its own tree alone. Every key is
    made by a person: none is made for a session. What a person is missing
    is said in `GET /v1/self/notices`.

    A person comes into the workspace by an admin's invitation, signing in
    with Google or the OpenID provider, or by being put in it by address
    (`PUT /v1/users/{userEmail}`), and signs in with Google, the OpenID
    provider or the password the password file holds for their address.
    The workspace's owner (`--owner`) is an admin of it from the start, always,
    and is never removed.

    ### The UIs, and this reference

    The chat is served at every path not under `/v1/` or `/console/`, and
    the console at every path under `/console/`: both route by the path
    (no `#`), so any page of either is an address to share or reload. This
    document is `GET /v1/openapi.yaml`, and rendered to read at
    `GET /v1/docs`.

    ### What is deliberately not here

    - **Tool approval prompts.** The session runs unattended inside its
      sandbox; what it may reach outside it is what its brokers reach.
    - **A process and shell API.** The terminal is the one door into the
      sandbox besides the session, and files the one way to move bytes.
    - **Widgets, workflows, objects, templates as UI.** Not conversations.
    - **Presentation state.** Pins, unread markers and drafts are the UI's.
servers:
  - url: http://127.0.0.1:8140
    description: Where the server listens by default. The contract does not depend on it.
security:
  - apiKey: []
  - console: []
  - platform: []
tags:
  - name: Costs
    description: >-
      What a workspace's infrastructure costs: the sandboxes, volumes, images and tunnels of its runyard-sandboxes server, as that server meters and prices them, and what the server may commit of its host.
  - name: Meta
    description: The server itself, and the key calling it.
  - name: Keys
    description: API keys, scoped and expiring.
  - name: Connect
    description: >-
      Applications connected to the workspace: each asks an admin for a key (OAuth's authorization code with PKCE), and holds it as a link the console lists and revokes.
  - name: People
    description: Who signs in, as a member or an admin, and the invitations that bring them in.
  - name: Models
    description: The harnesses a session may run, their models, and the providers they run on.
  - name: Usage
    description: What the sessions spent, counted as their calls to the providers passed.
  - name: Profiles
    description: Reusable configurations a session is started from.
  - name: Brokers
    description: APIs a session reaches without holding their credentials.
  - name: Images
    description: Images built from recipes — on a harness's image, for what a session's sandbox boots, or on any image, for a deployment.
  - name: Deployments
    description: A sealed sandbox booted from an image, that nothing can run a command in — published by tunnels, read by its logs, stopped when it expires.
  - name: Secrets
    description: >-
      A person's values a deployment needs — an OAuth client's secret, an API key — kept here sealed, never read back, and handed to a deployment's machine as files when it boots.
  - name: MCP connectors
    description: MCP servers, their credentials held here, served to a session through a broker.
  - name: Sessions
    description: A conversation with a harness in a sandbox of its own.
  - name: Turns
    description: Talking to a session, and steering it.
  - name: Events
    description: A session's transcript, and the account's change feed.
  - name: Work
    description: What a session's harness is doing besides answering — its sub-agents, background tasks, task list and alarms.
  - name: Sandbox
    description: A session's machine — its files, its terminal, its tunnels.
  - name: Triggers
    description: Sessions started by code — by a call, a schedule or a webhook — with their lineage, each of its trigger's owner's.
paths:
  /healthz:
    get:
      operationId: health
      x-public: true
      tags: [Meta]
      summary: Whether the server is up
      security: []
      responses:
        "200":
          description: It is.
          content:
            text/plain:
              schema: {type: string, example: ok}
  /v1/openapi.yaml:
    get:
      operationId: getContract
      x-public: true
      tags: [Meta]
      summary: This document, as the server serves it
      security: []
      responses:
        "200":
          description: The contract.
          content:
            application/yaml:
              schema: {type: string}
  /v1/info:
    get:
      operationId: getInfo
      x-public: true
      tags: [Meta]
      summary: The workspace, and the server's defaults and limits
      responses:
        "200":
          description: The workspace, defaults and limits.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Info"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/self:
    get:
      operationId: getSelf
      x-public: true
      tags: [Meta]
      summary: The key, person, session or platform calling
      description: |
        Who the caller is: a person signed in, a key, a session's harness
        calling through its brokers, or the Runyard platform with a
        platform token (`--platform-issuer`) — with its role in the workspace
        and the scopes it holds. The platform has no role and no address:
        it answers `{kind: platform, name: "Runyard platform", scopes}`,
        which is how the platform finds out a workspace takes its tokens.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Caller"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/self/notices:
    get:
      operationId: listNotices
      x-public: true
      tags: [Meta]
      summary: What the caller should know and act on
      description: |
        The warnings and errors that stand for the caller's person now —
        a profile they may start that uses what they may not, a provider of
        theirs to sign in again — each gone once it is resolved.
      responses:
        "200":
          description: The notices, the errors first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NoticeList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/self/preferences:
    get:
      operationId: getPreferences
      x-public: true
      tags: [Meta]
      summary: The person's own choices
      description: |
        What the caller's person chose for themselves, as opposed to what
        the workspace's admins chose for everybody (`/v1/settings`): a
        key's are its person's. A person who never chose has the defaults.
        Needs `sessions.read`, and `sessions.write` to change them: they are of
        the person's sessions. A session calling through its brokers has none:
        `403`.
      responses:
        "200":
          description: The preferences.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preferences"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: putPreferences
      x-public: true
      tags: [Meta]
      summary: Change the person's own choices
      description: Replaces them all, as `PUT /v1/settings` does the workspace's.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Preferences"}
      responses:
        "200":
          description: The preferences, changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preferences"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /v1/self/directory:
    get:
      operationId: getSelfDirectory
      x-public: true
      tags: [Meta]
      summary: The orgs and workspaces the caller's person may reach
      description: |
        What the platform (`--home-url`) last said the caller's person may
        reach — their orgs and the workspaces they may open — for the UIs'
        top bar. The server asks the platform (`GET <issuer>/api/me`, with
        the person's access token) server to server right after each
        sign-in with the OpenID provider and each refresh of it, only when
        the provider is the platform: the `--oidc-issuer`'s origin is the
        `--home-url`'s. A failure keeps what was last said. A person never
        asked about has empty lists and no `fetchedAt`. `404` when the
        server has no `--home-url`.
      responses:
        "200":
          description: The directory.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SelfDirectory"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/self/picture:
    get:
      operationId: getSelfPicture
      x-public: true
      tags: [Meta]
      summary: The person's profile picture
      description: |
        Google's picture of the person signed in, fetched from Google once
        and kept by the server, and by the browser for a day: the page never
        loads it from Google. A `304` answers an `If-None-Match` it still
        matches.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: {type: string}
      responses:
        "200":
          description: The picture.
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
          content:
            image/*:
              schema: {type: string, format: binary}
        "304":
          description: The picture the browser has is still it.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/Upstream"}
  /v1/signin/confirm:
    post:
      operationId: confirmSignIn
      x-public: true
      tags: [Meta]
      summary: Confirm it is you, with your password again
      description: |
        A person signed in to a UI with a password, typing it again: their
        sign-in is made anew, and is recent from now — which adding,
        approving, changing or revoking a runner asks for
        (`recent_signin_required`). A UI asks for it there and then, over
        the page that was refused, and does what was refused again; nobody
        is signed out. A person signed in with Google or the OpenID
        provider confirms with it instead, `GET /v1/auth/google` or
        `GET /v1/auth/oidc` with `confirm=true` (`400` here); a key, or
        anything not a person signed in to a UI, is refused (`403`), as is
        a password that is not theirs.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmSignIn"}
      responses:
        "204":
          description: Confirmed; the cookie is set anew.
          headers:
            Set-Cookie:
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /v1/keys:
    get:
      operationId: listKeys
      x-public: true
      tags: [Keys]
      summary: The keys of the workspace
      description: Every key, for an admin; a member's own, for a member.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The keys, never their secrets.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createKey
      x-public: true
      tags: [Keys]
      summary: Mint a key
      description: |
        The secret is in this answer and nowhere else, ever: the server keeps
        its hash. A key may not be given a scope its creator does not hold,
        and is its creator's: it does no more than they may, goes with them
        when they are removed, and a member revokes only their own.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewKey"}
      responses:
        "201":
          description: The key, with its secret this once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MintedKey"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /v1/keys/authorizations:
    post:
      operationId: authorizeKey
      x-public: true
      tags: [Keys]
      summary: Approve a key for a program that asked for one
      description: |
        **A program on a person's machine asks that person for its key**,
        rather than being pasted one: OAuth's authorization code with PKCE
        and a loopback redirect (RFC 7636, RFC 8252).

        1. The program makes a random `code_verifier`, listens on a port of
           its own loopback, and opens the person's browser at the console's
           `/console/authorize`, saying what it wants.
        2. The person, signed in, approves or denies. Approving is this
           call, made by the page as them: nothing is minted, and a code
           comes back.
        3. The page sends the browser to the program's `redirect_uri` with
           `code` and `state` — or `error=access_denied` and `state` — or,
           with no `redirect_uri`, shows the code for the person to paste.
        4. The program trades the code and its verifier for the key at
           `POST /v1/keys/authorizations/redeem`.

        The page reads what is asked from its query, and the server reads
        none of it:

        | parameter | what it says |
        |---|---|
        | `client` | What is asking, in its own words: `ryclaude on ada-laptop`. Required; the key is named it, its ends trimmed and each run of spaces made one. |
        | `scopes` | The scopes asked for (`Scope`), separated by commas. Required. |
        | `code_challenge` | `codeChallenge`. Required. |
        | `redirect_uri` | Where the program listens for the code, as `redirectUri` takes it. |
        | `state` | Handed back to `redirect_uri` as it was given. |

        Signed out, the page signs the person in and comes back to the same
        address. A `redirect_uri` that is not loopback, a `code_challenge`
        that is not one, or a scope this contract does not define, and it
        offers nothing to approve and sends the browser nowhere.

        Needs `keys.admin`, and approves exactly what `POST /v1/keys` would
        mint for the same caller: scopes it holds, an expiry within ten
        years. **The key is the caller's own**: there is no `owner`. From a
        browser, only the server's own pages may call it.

        **The code is not the key.** It passes through a browser's address
        bar, so it is bound to `codeChallenge`, the SHA-256 of a verifier
        only the program holds. It lasts five minutes, and only its SHA-256
        is kept, in this server's memory: a restart forgets every approval
        waiting. An approval made with a key goes with that key: revoked or
        expired, what it approved can no longer be redeemed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KeyAuthorizationRequest"}
      responses:
        "201":
          description: Approved. The code is in this answer and nowhere else.
          headers:
            Cache-Control:
              description: "`no-store`: the code is a secret for as long as it lasts."
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyAuthorization"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: >-
            The caller lacks `keys.admin` or a scope it asked for, or is a browser on another site's page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: >-
            The caller has sixteen approvals waiting to be redeemed (`capacity_exceeded`). Each lasts five minutes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/keys/authorizations/redeem:
    post:
      operationId: redeemKeyAuthorization
      x-public: true
      tags: [Keys]
      security: []
      summary: Trade an approval's code for its key
      description: |
        What the program that asked calls, with the code the person's browser
        brought it and the verifier it made before asking. The key is minted
        now, as its approver's, and this answer is the only place its secret
        ever is.

        Without a key: this is how a program gets its first. The code and
        the verifier stand in for one, and neither is worth anything without
        the other.

        **A code works once**, and is spent by being presented, with the
        right verifier or the wrong one.

        **One answer for every code that yields no key**: one never given,
        already redeemed, older than five minutes, shown with the wrong
        verifier, whose approver is gone or no longer holds `keys.admin` or
        a scope approved, or whose approving key was revoked or has expired.
        Which it was is what somebody holding a stolen code would like to
        know.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KeyAuthorizationRedemption"}
      responses:
        "200":
          description: Minted; the code is spent.
          headers:
            Cache-Control:
              description: "`no-store`: the body is a credential."
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MintedKey"}
        "400":
          description: >-
            No key: the code and verifier redeem none, for any of the reasons above and without saying which; or the body is not one this contract describes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    get:
      operationId: getKey
      x-public: true
      tags: [Keys]
      summary: A key
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Key"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: changeKey
      x-public: true
      tags: [Keys]
      summary: Change what a key may do
      description: |
        With `keys.admin`: the caller's own keys, or anybody's for an admin.
        The scopes sent replace the key's, at once: the next call made with
        it holds what it holds now. Its secret, name and expiry stay as they
        were.

        **A key is never made wider than whoever changes it**, as when it is
        minted: a scope the caller does not hold is refused. Nor is it given
        one its owner does not hold, which it could not use today and would
        the day they were made an admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KeyChange"}
      responses:
        "200":
          description: The key, as it is now.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Key"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: revokeKey
      x-public: true
      tags: [Keys]
      summary: Revoke a key, at once
      description: |
        With `keys.admin`: the caller's own keys, or anybody's for an admin.

        **Any key may revoke itself**, whatever its scopes: called with a key
        naming its own id, this needs nothing else. So a program given a key
        hands it back when it is done.
      responses:
        "204":
          description: It no longer works.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/connect/apps:
    get:
      operationId: listConnectApps
      x-public: true
      tags: [Connect]
      summary: The applications that may connect to the workspace
      description: |
        Every application the workspace knows: those its release names
        (`--apps-file`, `source: release`), which are changed only by a new
        release, and those an admin registered here (`source: console`).
        Never a secret, nor its hash. An admin's, with `keys.admin`.
      responses:
        "200":
          description: The applications, release ones first, each group by id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectAppList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: registerConnectApp
      x-public: true
      tags: [Connect]
      summary: Register an application
      description: |
        For a workspace no platform passes applications to — a self-hosted
        one — or one more beside them. The secret the application
        authenticates with at `POST /v1/connect/token` is made here and is in
        this answer and nowhere else, ever: only its SHA-256 is kept. An
        admin's, with `keys.admin`. An id already taken, by a release
        application or a registered one, is `409 conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewConnectApp"}
      responses:
        "201":
          description: Registered, with its secret this once.
          headers:
            Cache-Control:
              description: "`no-store`: the body holds a secret."
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegisteredConnectApp"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/connect/apps/{appId}:
    parameters:
      - $ref: "#/components/parameters/AppId"
    delete:
      operationId: removeConnectApp
      x-public: true
      tags: [Connect]
      summary: Remove a registered application, and its links
      description: |
        An application registered in the console goes, and every link made
        with it is revoked with it: their keys stop working at once. A
        release's application is the release's to remove: `409 managed`.
        An admin's, with `keys.admin`.
      responses:
        "204":
          description: Gone, with its links.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The application is the release's (`managed`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/connect/consent:
    get:
      operationId: getConnectConsent
      x-public: true
      tags: [Connect]
      summary: What the consent page asks the person signed in
      description: |
        The application a request to `GET /v1/connect/authorize` names, as
        the consent page shows it: its name, the scopes the key would hold —
        the application's, of those the caller holds — and whether the
        caller may approve, which only an admin of the workspace holding
        `keys.admin` may. Anybody signed in may ask. An unknown application,
        or a redirect not one of its, is `404`.
      parameters:
        - name: client_id
          in: query
          required: true
          schema: {type: string}
        - name: redirect_uri
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: What is asked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectConsent"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: decideConnectConsent
      x-public: true
      tags: [Connect]
      summary: Approve or deny an application
      description: |
        The consent page's buttons, as the admin signed in. Everything the
        authorize request said is judged again here: this is the call
        anybody could make.

        **Approved**, nothing is minted yet: a code is made, bound to the
        application, the redirect, `codeChallenge` and the caller, which
        lasts 60 seconds and works once; only its SHA-256 is kept, in this
        server's memory. The answer is where the browser goes with it.
        **Denied**, the answer is the application's redirect with
        `error=access_denied`. Either carries `state` as given, and `iss`.

        An admin's, with `keys.admin`; from a browser, only from this
        server's own pages (`Sec-Fetch-Site`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConnectDecision"}
      responses:
        "200":
          description: Where the browser goes now.
          headers:
            Cache-Control:
              description: "`no-store`: a code is a secret for as long as it lasts."
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectRedirect"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: >-
            The caller is not an admin holding `keys.admin`, or is a browser on another site's page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503":
          description: >-
            The caller has sixteen codes waiting to be exchanged (`capacity_exceeded`). Each lasts 60 seconds.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/connect/token:
    post:
      operationId: connectToken
      x-public: true
      tags: [Connect]
      security:
        - appClient: []
      summary: Exchange a code for the link and its key
      description: |
        What the application's server calls, at the workspace `iss` named,
        with the code and the PKCE verifier. Form-encoded, as OAuth:
        `grant_type=authorization_code`, `code`, `redirect_uri` (the one
        the code was made for) and `code_verifier`; the application
        authenticates with HTTP Basic, `client_id:secret`, checked against
        the SHA-256 kept.

        **The key is minted now**, as the application's (`app:<id>`), not
        the admin's who approved: it outlives them, and offboarding them
        does not touch it. It is named after the application
        (`<name>: <context>`), lasts a year, and holds what of the scopes
        approved an application may hold. The link is recorded, with who
        approved it: listed and revoked at `/v1/connect/links`.

        `workspace.sandboxesCa` is the certificate authority of the
        workspace's runyard-sandboxes server, read from it now with the
        workspace's key: an application serving its own broker
        to the workspace's sessions trusts it to know their sandboxes. A CA
        that cannot be read fails the exchange (`500 server_error`) before
        anything is minted.

        Errors are OAuth's (RFC 6749 §5.2): `401 invalid_client` for an
        unknown application or a wrong secret; `400 invalid_grant` for a
        code unknown, used, older than 60 seconds, made for another
        application or redirect, shown with the wrong verifier, or whose
        approver is no longer an admin holding what it approved — one
        answer for all of them.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: "#/components/schemas/ConnectTokenRequest"}
      responses:
        "200":
          description: The link, with its key this once; the code is spent.
          headers:
            Cache-Control:
              description: "`no-store`: the body is a credential."
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectGrant"}
        "400":
          description: "`invalid_request`, `unsupported_grant_type` or `invalid_grant`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthError"}
        "401":
          description: "`invalid_client`."
          headers:
            WWW-Authenticate:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthError"}
        "500":
          description: "`server_error`: the sandboxes server's CA could not be read, or the key not kept. Nothing was minted."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthError"}
  /v1/connect/links:
    get:
      operationId: listConnectLinks
      x-public: true
      tags: [Connect]
      summary: The applications connected to the workspace
      description: |
        Each link an admin approved and its application exchanged: the
        application, who approved it, and the key it holds. A link ends
        when its key is revoked — here, at `DELETE /v1/keys/{keyId}`, or by
        the application handing it back — and when its application is
        removed. An admin's, with `keys.admin`.
      responses:
        "200":
          description: The links, newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectLinkList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /v1/connect/links/{linkId}:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    delete:
      operationId: revokeConnectLink
      x-public: true
      tags: [Connect]
      summary: Disconnect an application
      description: The link's key is revoked, at once, and the link goes with it. An admin's, with `keys.admin`.
      responses:
        "204":
          description: Disconnected.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/users:
    get:
      operationId: listUsers
      x-public: true
      tags: [People]
      summary: The people of the workspace
      description: |
        Every person of the workspace, by address, in their role in it: whom
        a session, or a thing they own, may be shared with. It needs
        `sessions.write`, or `users.admin`; an application is never shown
        them (`403`), its end users being its own.
      responses:
        "200":
          description: The people.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/User"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /v1/users/{userEmail}:
    parameters:
      - $ref: "#/components/parameters/UserEmail"
    put:
      operationId: addUser
      x-public: true
      tags: [People]
      summary: Put a person in the workspace
      description: |
        In the role given, as an invitation would — for a person who signs
        in with a password, the one way in. They sign in with Google, the
        OpenID provider or the password file's password for their address.
        A person already in the workspace is `409`: their role is changed
        with `PATCH`. With `claims` (`Identity`) the provider decides who is
        in: `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserUpdate"}
      responses:
        "201":
          description: In the workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
    patch:
      operationId: updateUser
      x-public: true
      tags: [People]
      summary: Make a person an admin of the workspace, or a member
      description: |
        Takes effect at their next request, their keys' too. The workspace's
        owner is always an admin: making them a member is `409`. With
        `claims` (`Identity`) roles are the provider's: `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserUpdate"}
      responses:
        "200":
          description: The person, changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      operationId: deleteUser
      x-public: true
      tags: [People]
      summary: Remove a person from the workspace, and what is theirs in it, at once
      description: |
        Their keys are revoked. Their subscriptions are deleted: each is
        their own account, and signing in again is theirs to do. Their
        sessions and the other providers they made are handed over to the
        admin removing them (`theirs: hand_over`), or deleted with them
        (`delete`). What others shared with them no longer is, and is not
        handed to the admin. Oneself, and the workspace's owner, are not
        removed: `409`.

        With `claims` (`Identity`) the provider decides who is in, and only
        a person it offboarded (`offboardedAt`) is taken here: what is
        theirs is handed over or deleted, and the person is kept, with
        their keys suspended, as the record of who they were — they come
        back if the provider lets them sign in again. Anybody else is `409`.
      parameters:
        - name: theirs
          in: query
          schema:
            type: string
            enum: [hand_over, delete]
            default: hand_over
      responses:
        "204":
          description: Gone, and what was theirs handed over or deleted.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/invitations:
    get:
      operationId: listInvitations
      x-public: true
      tags: [People]
      summary: The invitations nobody has used yet
      description: Never their codes, which only their making shows.
      responses:
        "200":
          description: The invitations, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Invitation"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createInvitation
      x-public: true
      tags: [People]
      summary: Invite somebody
      description: |
        A link that signs one person in with Google, once, into the workspace
        as the `role` it says — for `email` alone, when it names one. It expires after
        `expiresInDays`. The link is in this answer and nowhere else, ever:
        the server keeps the hash of its code. A server without Google
        sign-in invites nobody: `409`; nor does one with `claims`
        (`Identity`), whose provider decides who is in.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewInvitation"}
      responses:
        "201":
          description: The invitation, with its link this once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MadeInvitation"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/invitations/{invitationId}:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema: {type: string, pattern: "^[a-z0-9]{12}$"}
    delete:
      operationId: revokeInvitation
      x-public: true
      tags: [People]
      summary: Revoke an invitation, at once
      responses:
        "204":
          description: Its link no longer signs anybody in.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/harnesses:
    get:
      operationId: listHarnesses
      x-public: true
      tags: [Models]
      summary: The harnesses a session may run, and their models
      description: |
        `claude-code` (Claude Code, on `anthropic` providers), `codex`
        (OpenAI's Codex, on `openai` providers) and `opencode` (opencode,
        on `openai_compatible` providers). A harness's models are
        not a list this server keeps: they are what its providers' APIs
        answered when last asked, so a harness with no provider of a type
        it runs on has none.
      responses:
        "200":
          description: The harnesses.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Harness"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/providers:
    get:
      operationId: listProviders
      x-public: true
      tags: [Models]
      summary: The providers, and whether each has a working credential
      description: |
        A provider is a named credential for a model provider's API — an API
        key, or a subscription signed in — so there may be several of one
        type: two subscriptions and a key, say. Exactly one is the default,
        which a session runs on unless it names another; the first one made
        is. A session whose harness does not run on the default's type runs
        on the first provider, by name, of a type it does run on.

        A provider is for the people it names (`users`), or for `everyone`:
        at first, for whoever made it alone. A session runs only on a
        provider its person may use — the default when they may, else the
        first by name they may — and a member is shown only those, an admin
        every one.

        Each provider's models are asked of its API, with its own
        credential, when it is made or signed in, every hour after, and on
        `POST …/models`.

        An application sees its own, each end user's among them.
      parameters:
        - name: endUser
          in: query
          description: Those of the end user of this id alone.
          schema: {type: string, minLength: 1, maxLength: 200}
      responses:
        "200":
          description: The providers, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Provider"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/providers/{provider}:
    parameters:
      - $ref: "#/components/parameters/ProviderName"
    put:
      operationId: putProvider
      x-public: true
      tags: [Models]
      summary: Make a provider of an API key, or replace one with it
      description: |
        Kept encrypted here, and never sent to a sandbox: the session reaches
        the provider through the `llm` broker, which puts it on. The server
        tries it before answering, says what the provider said, and reads
        the provider's models with it. A provider of that name, a key or a
        subscription, is replaced — by an admin or whoever made it; another
        person's is `409`. A provider made is for its maker alone.

        An `openai_compatible` provider is a server of OpenAI's chat
        completions — llama.cpp's llama-server, vLLM — at `baseUrl`, which
        this server reaches: its key is optional, since such a server often
        takes none.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderApiKey"}
      responses:
        "200":
          description: Replaced, and tried.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Provider"}
        "201":
          description: Made, and tried.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Provider"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateProvider
      x-public: true
      tags: [Models]
      summary: Retitle a provider, say who may use it, or make it the default
      description: |
        Absent fields are left as they are. `isDefault: true` makes it the
        default and the one that was stops being; `false` is `400`, since
        exactly one is: make another the default instead. Whoever made it
        retitles it and says who may use it; only an admin makes it the
        default.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderUpdate"}
      responses:
        "200":
          description: The provider, changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Provider"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteProvider
      x-public: true
      tags: [Models]
      summary: Remove a provider, and forget its credential
      description: |
        Sessions on it move to the default at their next turn. Removing the
        default makes another one the default, when there is another. An
        admin removes any; a member, those they made.
      responses:
        "204":
          description: Gone.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/providers/{provider}/signin:
    parameters:
      - $ref: "#/components/parameters/ProviderName"
    post:
      operationId: startProviderSignIn
      x-public: true
      tags: [Models]
      summary: Start making a provider of a subscription, or replacing one with it
      description: |
        A subscription signs in with OAuth, as its harness does, by one of
        the `method`s its type offers; `POST …/signin/{flowId}` finishes,
        and makes the provider of that name, or replaces it.

        - `code` (`anthropic`, as Claude Code does): the person opens
          `authorizationUrl`, signs in, and is shown a code; finishing with
          that `code` makes the provider.
        - `device` (`openai`, a ChatGPT plan, as `codex login
          --device-auth` does): the person opens `verificationUri` on any
          machine and enters `userCode`. The server asks the provider
          whether they have from the start, and makes the provider as soon
          as they have, whether or not anybody is finishing.
        - `redirect` (`openai`, as `codex login` does): the person opens
          `authorizationUrl` and signs in; their browser is then sent to an
          address on `localhost` that nothing there answers. Finishing with
          that address, pasted from the browser's address bar
          (`redirectUrl`), makes the provider.

        The server keeps the refresh token, renews the access token before
        it expires, and reads the provider's models once signed in. An
        `openai_compatible` provider has no subscription: `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderSignIn"}
      responses:
        "200":
          description: Where to send the person, and what to show them.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignInFlow"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502": {$ref: "#/components/responses/Upstream"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/providers/{provider}/signin/{flowId}:
    parameters:
      - $ref: "#/components/parameters/ProviderName"
      - name: flowId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: finishProviderSignIn
      x-public: true
      tags: [Models]
      summary: Finish signing a subscription in
      description: |
        By the flow's `method`: `code` takes the `code` the person was
        shown, `redirect` the `redirectUrl` their browser was sent to, and
        `device` takes nothing and **waits** — until the person has entered
        the code and the provider is made (`200`), or the flow expires
        (`404`). A `device` finish cut short — a proxy's timeout, a page
        reloaded — is called again: the flow goes on until it expires, and
        once the provider is made, finishing it again answers the provider.
        A field the flow's method does not take is `400`.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderSignInFinish"}
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Provider"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/Upstream"}
  /v1/providers/{provider}/models:
    parameters:
      - $ref: "#/components/parameters/ProviderName"
    post:
      operationId: refreshProviderModels
      x-public: true
      tags: [Models]
      summary: Read a provider's models again, now
      description: |
        Asks the provider's API for its models with the provider's
        credential, as the server does every hour. A failure keeps the
        list read last and says why in `modelsError`: the answer is the
        provider either way, `modelsReadAt` saying when its list was read.
      responses:
        "200":
          description: The provider, its models read again or why they could not be.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Provider"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/usage:
    get:
      operationId: getUsage
      x-public: true
      tags: [Usage]
      summary: What the sessions used, by hour or by day
      description: |
        An admin's holding `sessions.read`, or any caller holding
        `usage.read` — the scope that reads this and nothing else, which is
        what the platform bills a workspace by.

        Every call a session's harness made to a provider through the `llm`
        broker, counted from what the broker said of it in its
        `Runyard-Activity` annotation, as the sandboxes server's activity
        feed records it: requests, errors and tokens. Consumption, never a
        price: whoever bills prices it on their side.

        `1d` is the last 24 hours by hour; `7d` and `30d` are by day, in
        UTC. Every bucket of the range is in the answer, the empty ones
        too, oldest first. The filters narrow everything in the answer.
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: ["1d", "7d", "30d"]
            default: "1d"
        - name: provider
          in: query
          description: One provider's calls, by name.
          schema: {$ref: "#/components/schemas/Name"}
        - name: session
          in: query
          description: One session's calls.
          schema: {$ref: "#/components/schemas/Id"}
        - name: model
          in: query
          description: One model's calls.
          schema: {type: string, example: claude-opus-5-5}
      responses:
        "200":
          description: The usage.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageReport"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/costs:
    get:
      operationId: getWorkspaceCosts
      x-public: true
      tags: [Costs]
      summary: What the workspace's infrastructure has cost
      description: |
        What the workspace's sandboxes, volumes, images and tunnels used and
        cost over a window, hour by hour or day by day, and what each costs
        an hour now: its sandboxes server's, as runyard-sandboxes meters them every
        minute and keeps them, at the rates its configuration names. What is
        gone — a session deleted, a deployment let go — is listed with what it
        cost, `live: false`.

        Its sessions' sandboxes and volumes say which session each is, and its
        deployments' sandboxes which deployment. An admin's, with
        `sessions.read`, as the workspace's usage is.

        Not the sessions' calls to their models, which are
        `GET /v1/usage`.
      parameters:
        - name: window
          in: query
          description: How far back to go. `7d` when it is not said.
          schema: {$ref: "#/components/schemas/CostWindow"}
      responses:
        "200":
          description: What was spent over the window, and what is spent an hour now.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CostReport"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/Upstream"}
  /v1/quota:
    get:
      operationId: getWorkspaceQuota
      x-public: true
      tags: [Costs]
      summary: The workspace's quota, and what is held of it
      description: |
        What the workspace's runyard-sandboxes server may commit of its
        host — its ceilings of vCPUs, memory and disk, each its capacity
        times its overcommit — and what its sandboxes and volumes hold of
        them now, as the server counts them (`GET /v1/host/commitments`,
        read with the workspace's own key). The server is the workspace's
        alone, so its limits are the workspace's quota. A session whose
        sandbox would take the workspace past a ceiling is refused
        `quota_exceeded` (its `sandbox.errorCode`), so a client can read this
        before starting one rather than find out after. One whose disk would
        take it past its disk ceiling is refused as it is started
        (`createSession`'s `507`).

        What is held is counted as the server admits sandboxes: vCPUs by
        sandboxes running, memory by those and those paused, disk by every
        sandbox's volume and every volume kept.

        Read-only: the ceilings are the platform's and the sandboxes
        operator's to set, never the workspace's. Anybody with `sessions.read`
        may read it.
      responses:
        "200":
          description: The ceilings, and what is held.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceQuota"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502": {$ref: "#/components/responses/Upstream"}
  /v1/available-runners:
    get:
      operationId: getAvailableRunners
      x-public: true
      tags: [Sessions]
      summary: Whether a new session's sandbox has somewhere to run
      description: |
        How many of the workspace's runners could take a new session's
        sandbox now, as its runyard-sandboxes server lists them (read with
        the workspace's own key): those approved and `online`, `unreachable`
        or `held` — not one `pending` approval, `draining`, `expired` or
        `revoked`. With none, a session started has its sandbox placed
        nowhere and fails (`unplaceable`), so a client reads this before
        starting one and says so instead. Anybody with `sessions.read` may
        read it; the runners themselves are an admin's (`listRunners`).
      responses:
        "200":
          description: The runners a sandbox could be placed on.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AvailableRunners"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502": {$ref: "#/components/responses/Upstream"}
  /v1/settings:
    get:
      operationId: getWorkspaceSettings
      x-public: true
      tags: [Meta]
      summary: The workspace's settings
      description: |
        What the workspace's admins chose for it, as opposed to how the
        server was started (`GET /v1/info`). Anybody with `sessions.read`
        may read them: a chat says from them when a session will be archived
        and deleted.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceSettings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: putWorkspaceSettings
      x-public: true
      tags: [Meta]
      summary: Change the workspace's settings
      description: |
        Replaces them all: a field left out is unset. Needs `settings.write`,
        which only an admin holds. A change applies at once to every session,
        counted from when each was last idle: one already past a new limit
        is archived or deleted straight away.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceSettings"}
      responses:
        "200":
          description: The settings, changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceSettings"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /v1/profiles:
    get:
      operationId: listProfiles
      x-public: true
      tags: [Profiles]
      summary: Every profile of the account
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The profiles, each at its latest version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfilePage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: putProfile
      x-public: true
      tags: [Profiles]
      summary: Create a profile, or make a new version of it
      description: |
        A profile is what a session is started from: a harness, provider and model, a
        system prompt, brokers, MCP connectors and sandbox resources.
        Each change is a new `version`; a session records the version it was
        started from, and is never changed by a later one. The same spec
        again makes no version.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileSpec"}
      responses:
        "200":
          description: The profile, unchanged or at a new version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "201":
          description: The profile, created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/RecipeInvalid"}
        "502": {$ref: "#/components/responses/Upstream"}
        "404": {$ref: "#/components/responses/NotFound"}
    get:
      operationId: getProfile
      x-public: true
      tags: [Profiles]
      summary: A profile, at its latest version
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteProfile
      x-public: true
      tags: [Profiles]
      summary: Delete a profile
      description: |
        Sessions started from it go on as they were; triggers that start it
        are refused while they exist (`409 in_use`).
      responses:
        "204":
          description: Gone.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/profiles/{profileId}/users:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: putProfileUsers
      x-public: true
      tags: [Profiles]
      summary: "Say who besides its owner may use a profile: who may start sessions from it"
      description: |
        Its owner's, or an admin's, to say; it replaces whom it was for.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Users"}
      responses:
        "200":
          description: Whom it is for now.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Users"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/profiles/{profileId}/versions:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    get:
      operationId: listProfileVersions
      x-public: true
      tags: [Profiles]
      summary: Every version of a profile, newest first
      description: |
        What to test — a session is started from any of them with
        `profileVersion` — and what to go back to, with
        `POST …/versions/{version}/restore`.
      responses:
        "200":
          description: Its versions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileVersionList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/profiles/{profileId}/versions/{version}/restore:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - name: version
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    post:
      operationId: restoreProfileVersion
      x-public: true
      tags: [Profiles]
      summary: Go back to a version
      description: |
        A new version, the same as that one, becomes its latest: what came
        after it is kept, to go forward to again. Its owner's — and, for a
        profile a session was started from, that session's, as its person.
      responses:
        "200":
          description: The profile at its new latest version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/profiles/{profileId}/recipe:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    put:
      operationId: putProfileRecipe
      x-public: true
      tags: [Profiles]
      summary: Change the recipe its sessions' sandboxes boot
      description: |
        A new version of the profile with `sandbox.recipe` this, and the
        rest as it was; the image is built at once. Its owner's — and, for
        the profile a session was started from, that session's, as its person:
        so a session improves the environment sessions like it start in. Test
        the version by starting a session from it, and restore the one
        before if it is worse. The same recipe again makes no version.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileRecipe"}
      responses:
        "200":
          description: The profile at its latest version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/RecipeInvalid"}
        "502": {$ref: "#/components/responses/Upstream"}
  /v1/profiles/{profileId}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
      - name: version
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    get:
      operationId: getProfileVersion
      x-public: true
      tags: [Profiles]
      summary: A profile as it was at one version
      responses:
        "200":
          description: That version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/images:
    get:
      operationId: listImages
      x-public: true
      tags: [Images]
      summary: The images the caller's profiles, sessions and deployments use
      description: |
        An image is named by what it is made of and is nobody's, so what a
        person is shown is what is theirs uses: their profiles' recipes,
        their sessions' images, and their deployments', and the images they
        named. An admin is shown every image this server knows. Newest
        first.
      responses:
        "200":
          description: The images.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImageList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "502": {$ref: "#/components/responses/Upstream"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: buildImage
      x-public: true
      tags: [Images]
      summary: The image a recipe makes, built if it is not yet
      description: |
        A recipe is a Dockerfile of one stage. One that starts
        `FROM harness/<name>` — `FROM harness/claude-code` — is built on the
        image of that harness, which holds what a session of it runs: what a
        profile's or a session's `sandbox.recipe` is. One that starts `FROM`
        any other image is built on it, for a deployment
        (`POST /v1/deployments`).
        Every `RUN` says what it may reach, for that step alone —
        `--allow=<host>,…` and `--broker=<name>` — and nothing else is
        reached. The runyard-sandboxes daemon builds it, each step in a
        sandbox of its own.

        An image is identified by what it is made of — the recipe, its
        harness's image in place of `harness/<name>` — so the same recipe
        again is the same image: built
        once, `200` while it builds and after. A recipe whose build failed
        is built again. A server whose harness image changes builds every
        recipe again, on the new one.

        A profile or a session whose `sandbox.recipe` is set asks for its
        image when it is saved; a session waits for it before its first wake.

        Its `name`, and what it is for, are what people pick it by: they
        name the image as `PUT …/images/{imageId}/name` does.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ImageRequest"}
      responses:
        "200":
          description: The image, building, built or failed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Image"}
        "202":
          description: Its build, started.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Image"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/RecipeInvalid"}
        "502": {$ref: "#/components/responses/Upstream"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/ImageId"
    get:
      operationId: getImage
      x-public: true
      tags: [Images]
      summary: An image, and where its build is
      responses:
        "200":
          description: The image.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Image"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/images/{imageId}/name:
    parameters:
      - $ref: "#/components/parameters/ImageId"
    put:
      operationId: putImageName
      x-public: true
      tags: [Images]
      summary: Name an image, and say what it is for
      description: |
        What a person picks an image by, in place of its id: whoever may
        see the image may name it, in place of what it was called, and
        sees it among their images from then on. The name is kept by the
        image's id, so a recipe built again is named as it was.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ImageName"}
      responses:
        "200":
          description: The image, named.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Image"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/images/{imageId}/log:
    parameters:
      - $ref: "#/components/parameters/ImageId"
    get:
      operationId: readImageLog
      x-public: true
      tags: [Images]
      summary: What its build printed, from a byte offset
      description: |
        Each step begins with a line naming it, followed by what it printed.
        `from` is a byte offset, so a reader that dropped resumes where it
        stopped; with `follow` the body stays open until the build ends.
      parameters:
        - name: from
          in: query
          description: The first byte wanted.
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - $ref: "#/components/parameters/Follow"
      responses:
        "200":
          description: The bytes.
          content:
            text/plain:
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/secrets:
    get:
      operationId: listSecrets
      x-public: true
      tags: [Secrets]
      summary: The caller's person's secrets, by name
      description: |
        Names and when they were set, never a value: nothing reads a value
        back. A person's own alone, an admin's too, and a session sees its
        person's, to name them in a deployment it asks for.
      responses:
        "200":
          description: The secrets.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SecretList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/secrets/{secretName}:
    parameters:
      - $ref: "#/components/parameters/SecretName"
    put:
      operationId: putSecret
      x-public: true
      tags: [Secrets]
      summary: Set one of the caller's secrets, or replace its value
      description: |
        A person's alone to set: a session is refused (`403`), so a value is
        never in a session's context. A deployment already made keeps the
        value it was made with; one made after has the new one.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SecretValue"}
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Secret"}
        "201":
          description: Set.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Secret"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteSecret
      x-public: true
      tags: [Secrets]
      summary: Forget one of the caller's secrets
      description: |
        A person's alone. Deployments made with it keep the value they were
        made with; an approval still waiting that names it fails when it is
        approved.
      responses:
        "204":
          description: Forgotten.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/deployment-approvals:
    get:
      operationId: listDeploymentApprovals
      x-public: true
      tags: [Deployments]
      summary: Deployments the caller's sessions asked for, waiting or decided
      description: |
        A person's, newest first: those still waiting, and those decided in
        the last week. A session sees those it asked for.
      responses:
        "200":
          description: The approvals.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeploymentApprovalList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: requestDeployment
      x-public: true
      tags: [Deployments]
      summary: Ask the caller's person to make a deployment
      description: |
        How a session gets a deployment that has its person's `secrets`: the
        image it built could send them to any host it reaches, so its person
        decides, seeing the image, the hosts and the secrets together. They
        are told in their notices. Nothing is made until they approve, and
        it is then made as if they had asked, with this session as the one
        that made it.

        What is asked is checked now as `POST …/deployments` checks it, the
        image and the secrets included; and again when it is approved.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeploymentRequest"}
      responses:
        "202":
          description: Waiting for the person.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeploymentApproval"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/deployment-approvals/{approvalId}:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    get:
      operationId: getDeploymentApproval
      x-public: true
      tags: [Deployments]
      summary: A deployment asked for, and what was decided
      responses:
        "200":
          description: The approval.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeploymentApproval"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/deployment-approvals/{approvalId}/approve:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    post:
      operationId: approveDeployment
      x-public: true
      tags: [Deployments]
      summary: Make the deployment a session asked for
      description: |
        Its person's alone: a session is refused (`403`), and so is anybody
        else. The deployment is made now; one that cannot be — its image
        gone, a secret forgotten — is answered as `POST …/deployments`
        answers it, and the approval stays waiting.
      responses:
        "200":
          description: Approved; `deploymentId` is the deployment.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeploymentApproval"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
