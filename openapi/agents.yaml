        - name: label
          in: query
          description: '`key=value`, each one required.'
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: startSession
      x-public: true
      tags: [Sessions]
      summary: Start a session
      description: |
        From a profile (`profileId`, at its latest version unless one is
        named), with any field of the session overridden, or from nothing but
        the overrides. The answer comes at once, the sandbox `creating`; the
        session's stream says when its harness is up. A first turn may be sent
        with it, and is taken as soon as the session is.

        **The server names the session**: its `id` is in the answer, opaque,
        and never one a session had before. A caller cannot choose it, so
        nothing that knows a session by its id — a broker, an application,
        a log — can be handed a session somebody else made under an id it
        already trusts.

        A retry is made safe by `Idempotency-Key`, which is the caller's own:
        the same key and the same request again is `200` with the session it
        made, as it is now; the same key with a different request is
        `409 spec_conflict`. A key is the caller's — another caller's same key
        is another request — and lasts as long as the session it made.

        A session whose disk the workspace's disk budget has no room left
        for is refused `507 quota_exceeded`, before anything is kept: every
        session's disk is counted at its full size for as long as it is
        kept, so waiting frees none of it, and deleting a session does.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionSpec"}
      responses:
        "200":
          description: It existed already, made by this same request under the same `Idempotency-Key`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "201":
          description: Started.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/RecipeInvalid"}
        "502": {$ref: "#/components/responses/Upstream"}
        "503": {$ref: "#/components/responses/Capacity"}
        "507": {$ref: "#/components/responses/DiskBudget"}
  /v1/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    put:
      operationId: createSession
      x-public: true
      deprecated: true
      tags: [Sessions]
      summary: Start a session under an id the caller chose
      description: |
        **Deprecated: `POST /v1/sessions`**, where the server names the
        session. Kept so that a caller written against it goes on working
        while it moves, on this timeline:

        | date | |
        |---|---|
        | 2026-11-13 | deprecated: every answer says so in `Deprecation` and `Sunset` headers, and the server logs each use with its caller |
        | 2026-12-15 | every caller has moved |
        | 2027-01-31 | removed |

        From a profile (`profileId`, at its latest version unless one is
        named), with any field of the session overridden, or from nothing but
        the overrides. The answer comes at once, the sandbox `creating`; the
        session's stream says when its harness is up. A first turn may be sent
        with it, and is taken as soon as the session is.

        The same request again is `200` with the session as it is now; a
        different one under the same id is `409 spec_conflict`. **An id a
        deleted session had is never taken again**: it is `409 conflict`, so
        that nothing which knew the deleted session by its id is handed a new
        one, of somebody else's, in its place.

        A session whose disk the workspace's disk budget has no room left
        for is refused `507 quota_exceeded`, before anything is kept: every
        session's disk is counted at its full size for as long as it is
        kept, so waiting frees none of it, and deleting a session does.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionSpec"}
      responses:
        "200":
          description: It existed already, made by this same request.
          headers:
            Deprecation:
              description: "When choosing a session's id was deprecated (RFC 9745): `@1794528000`, 2026-11-13."
              schema: {type: string}
            Sunset:
              description: "When it is removed (RFC 8594): Sun, 31 Jan 2027 00:00:00 GMT."
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "201":
          description: Started.
          headers:
            Deprecation:
              description: "When choosing a session's id was deprecated (RFC 9745): `@1794528000`, 2026-11-13."
              schema: {type: string}
            Sunset:
              description: "When it is removed (RFC 8594): Sun, 31 Jan 2027 00:00:00 GMT."
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/RecipeInvalid"}
        "502": {$ref: "#/components/responses/Upstream"}
        "503": {$ref: "#/components/responses/Capacity"}
        "507": {$ref: "#/components/responses/DiskBudget"}
    get:
      operationId: getSession
      x-public: true
      tags: [Sessions]
      summary: A session
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateSession
      x-public: true
      tags: [Sessions]
      summary: Retitle, relabel, or reconfigure a session
      description: |
        Absent fields are left as they are. A change of model, brokers,
        or MCP connectors restarts the session at its next turn, resumed
        from the transcript; a change of resources applies the next time the
        sandbox is made — at once if `restartSandbox`, else when it wakes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionUpdate"}
      responses:
        "200":
          description: The session, changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      operationId: deleteSession
      x-public: true
      tags: [Sessions]
      summary: Delete a session, its sandbox, its disk and its transcript
      description: |
        Irreversible. The sessions it started are not deleted: they keep
        their `parentId`, and their lineage says the parent is gone. A
        `locked` session is `409`: unlock it first. A session, through its
        `sessions` broker, deletes only the sessions it started and those
        under them: any other — itself, its parent, a sibling — is `404`.

        A session whose disk is on a runner that is away is deleted here at
        once, and its machine and disk when that runner is back: `202`,
        naming the runner. The sandboxes server lists them `deleting` until
        then.
      responses:
        "204":
          description: Gone.
        "202":
          description: Gone, but for its machine and disk, deleted once the runner holding them is back.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeletedLater"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/sessions/{sessionId}/archive:
