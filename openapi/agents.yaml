      tags: [Sessions]
      summary: Whom the session is shared with
      description: |
        A session is shared with its tree — the sessions it started,
        and forks — from its root: sharing any of them shares the root's.
      responses:
        "200":
          description: The people it is shared with.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionShares"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: putSessionShares
      x-public: true
      tags: [Sessions]
      summary: Share the session with these people, and no others
      description: |
