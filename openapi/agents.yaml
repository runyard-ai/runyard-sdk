        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Capacity"}
  /v1/triggers/{triggerId}/firings:
    parameters:
      - $ref: "#/components/parameters/TriggerId"
    get:
      operationId: listFirings
      x-public: true
      tags: [Triggers]
      summary: A trigger's firings, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The firings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FiringPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/hooks/{triggerId}:
    parameters:
      - $ref: "#/components/parameters/TriggerId"
    post:
      operationId: receiveHook
      x-public: true
      tags: [Triggers]
      summary: A webhook trigger's address
      description: |
        Not called with a key: the body is signed with the trigger's secret,
        `X-Runyard-Signature: sha256=<hex HMAC of the body>`, or — for a
        trigger declared `github` — GitHub's own `X-Hub-Signature-256`.
        Anything unsigned, or signed otherwise, is the same `404` as a
        trigger that does not exist. The body is the firing's `input`; its
        delivery id header, when the sender gives one, its `firingId`.
      security: []
      parameters:
        - name: X-Runyard-Signature
          in: header
          schema: {type: string}
        - name: X-Hub-Signature-256
          in: header
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Fired.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Firing"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer ryak_<id>_<secret>`. The prefix makes a leaked
        key findable by a secret scanner; the server keeps a hash of the
        secret. A key has scopes (`Scope`) and an expiry. A missing, unknown,
        expired or revoked key is the same `401`, on purpose.
    platform:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <JWT>`, signed by the platform in front of
        this server (`--platform-issuer`) with the key it signs identity
        tokens with, published in its key set. Taken only when the server
        was started with `--platform-issuer`; otherwise it is any other
        bearer that is not a key: `401`.

        Its header's `typ` is `runyard-platform+jwt`, and `alg` `RS256`.
        Its claims: `iss` the issuer, `aud` this server's public URL (`--url`,
        without a trailing slash) — so a token for one workspace is refused
        by every other — `sub` `platform`, `scope` the scopes it asks for,
        space-separated, `iat`, `exp` at most 300 seconds after `iat`, and a
        `jti` of at most 64 characters, taken once: the same `jti` again is
        refused until the token would have expired. Thirty seconds of leeway
        on times. Every refusal is the same `401`.

        The caller is the platform (`Caller.kind: platform`), holding the
        token's scopes that `--platform-scopes` grants — never the owner,
        never a person. It reaches `GET /v1/self`, `GET /v1/info`, and what
        its scopes are for, and nothing else; each of its calls is in the
        activity, by `actor: platform`.
    appClient:
      type: http
      scheme: basic
      description: |
        An application connecting to the workspace, at
        `POST /v1/connect/token` alone: `client_id:secret`, each
        form-encoded (RFC 6749 §2.3.1). Never a key.
    console:
      type: apiKey
      in: cookie
      name: __Host-ry_ws
      description: |
        The console's and the chat UI's sign-in: with the scopes of the key
        it was signed in with — which holds `keys.admin`, and is no
        session's own — or, for a person signed in with a password or
        Google, every scope. Honoured only from the UIs' own origin.
  parameters:
    Limit:
      name: limit
      in: query
      description: At most this many; the default and ceiling are in `GET /v1/info`.
      schema: {type: integer, minimum: 1, maximum: 500}
    Cursor:
      name: cursor
      in: query
      description: From a previous page's `nextCursor`. Opaque; one made up is `400`.
      schema: {type: string}
    From:
      name: from
      in: query
      description: The first `seq` wanted. The oldest kept when absent.
      schema: {type: integer, format: int64, minimum: 0}
    Follow:
      name: follow
      in: query
      description: Keep the body open and write what happens next.
      schema: {type: boolean, default: false}
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Id"}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >-
        The caller's name for this request, so that sending it again — an answer lost, a connection dropped — finds what it made rather than making another. The caller's own: another caller's same key is another request.
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
    QueuedTurnId:
      name: turnId
      in: path
      required: true
      description: The `turnId` of a turn in the session's `queue`.
      schema: {type: string}
    SkillName:
      name: skillName
      in: path
      required: true
      schema: {type: string, minLength: 1}
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: {type: string, pattern: "^[0-9a-f]{32}$"}
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Id"}
    ImageId:
      name: imageId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ImageId"}
    SecretName:
      name: secretName
      in: path
      required: true
      schema: {$ref: "#/components/schemas/SecretName"}
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TunnelName:
      name: tunnelName
      in: path
      required: true
      schema: {$ref: "#/components/schemas/TunnelName"}
    TriggerId:
      name: triggerId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Id"}
    KeyId:
      name: keyId
      in: path
      required: true
      schema: {type: string, pattern: "^[a-z0-9]{12}$"}
    AppId:
      name: appId
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ConnectAppId"}
    LinkId:
      name: linkId
      in: path
      required: true
      schema: {type: string, pattern: "^lnk_[a-z0-9]{12}$"}
    UserEmail:
      name: userEmail
      in: path
      required: true
      schema: {type: string, format: email}
    BrokerName:
      name: brokerName
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
    ProviderName:
      name: provider
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      example: anthropic
    McpConnectorName:
      name: mcpConnectorName
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
    FilePath:
      name: path
      in: query
      required: true
      description: Absolute, or relative to the session's working directory. Never outside the session's disk.
      schema: {type: string, example: src/main.go}
  responses:
    BadRequest:
      description: The request is not one this contract describes, or not one that makes sense.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: No key, or not a working one — one answer for every cause.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: The key works, and lacks the scope this needs — or its person, what this is.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Nothing by that id.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: |
        Not in the state this needs (`conflict`), a different spec under an
        id already used (`spec_conflict`), or still used by something
        (`in_use`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RecipeInvalid:
      description: |
        A recipe this server or the sandboxes daemon will not build
        (`recipe_invalid`): its message names the line.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Gapped:
      description: The cursor is older than what is kept. The answer says what is.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/GapError"}
    TooLarge:
      description: Bigger than `limits` allows.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Upstream:
      description: Somebody else's server answered badly, or not at all (`provider_error`, `upstream_error`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Capacity:
      description: |
        No sandbox can be made now (`capacity_exceeded`) or the account is at
        its quota (`quota_exceeded`). The one status that says: try again.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    DiskBudget:
      description: |
        The workspace's disk budget is full (`quota_exceeded`): the disks of
        its sessions, each counted at its full size, leave no room for this
        one's. The message says the budget, what is held of it and what was
        asked (`GET /v1/quota`). Not a status to try again on: a disk is
        given back when its session is deleted, and not by waiting.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    SessionBroker:
      type: object
      required: [name, url]
      properties:
        name: {type: string}
        url:
          type: string
          description: Where the session reaches it, in the sandbox.
        mcp:
          type: string
          description: |
            Where the harness was given the MCP server the broker describes,
            in the sandbox, under the broker's name; absent when it
            describes none, or an MCP connector of that name was given
            instead.
    SessionMcpConnector:
      type: object
      required: [name]
      properties:
        name: {type: string}
        status:
          type: string
          description: As the harness reported it when it started (Claude Code's `connected`, `failed`, `needs-auth`, `pending`); absent when it does not say.
    SessionSkill:
      type: object
      required: [name]
      properties:
        name: {type: string}
        description:
          type: string
          description: The `description` of its SKILL.md — what the session reads to decide to load it.
        broker:
          type: string
          description: |
            The broker it is about, when a broker brought it: its SKILL.md is
            kept by the server then, and read with readSessionSkill.
        mcpConnector:
          type: string
          description: |
            The MCP connector whose server published it, when one brought it
            (the connector's `skills`): its SKILL.md is kept by the server
            then, and read with readSessionSkill.
        path:
          type: string
          description: |
            Its directory on the session's disk — its SKILL.md and any file
            beside it, read with listFiles and readFile. Absent for one built
            into the harness, which is on no disk.
    SessionTool:
      type: object
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
        mcpConnector:
          type: string
          description: The MCP connector it comes from, for an MCP tool.
        inputSchema:
          type: object
          additionalProperties: true
          description: The JSON Schema of its input, as the harness or the MCP server declared it.
    Webhook:
      type: object
      description: For `webhook`.
      properties:
        github:
          type: boolean
          description: Signed the way GitHub signs.
        events:
          type: array
          description: For GitHub, which `X-GitHub-Event`s fire it; all when absent.
          items: {type: string}
    Schedule:
      type: object
      required: [cron]
      description: For `schedule`.
      properties:
        cron:
          type: string
          example: 0 7 * * 1-5
        timezone:
          type: string
          example: Europe/Paris
    SessionWork:
      type: object
      required: [queuedTurns, subagentsRunning, backgroundTasksRunning, tasksOpen, alarmsPending]
      description: What it is doing besides answering, counted — what a list shows.
      properties:
        queuedTurns: {type: integer}
        subagentsRunning: {type: integer}
        backgroundTasksRunning: {type: integer}
        tasksOpen: {type: integer}
        alarmsPending: {type: integer}
    SessionSandbox:
      type: object
      required: [state, resources]
      properties:
        state: {$ref: "#/components/schemas/SandboxState"}
        id:
          type: string
          description: The runyard-sandboxes sandbox, while there is one.
        resources: {$ref: "#/components/schemas/Resources"}
        error: {type: string}
        errorCode:
          allOf: [{$ref: "#/components/schemas/ErrorCode"}]
          description: |
            Why its sandbox could not be made, when it is one a caller acts
            on: `quota_exceeded`, the workspace's quota held by
            its other sandboxes and volumes (`GET /v1/quota`);
            `runner_unreachable`, the runner holding its disk not answering,
            which `runner` names. Cleared with `error`.
        runner:
          allOf: [{$ref: "#/components/schemas/SessionSandboxRunner"}]
          description: |
            For `runner_unreachable`, the runner holding the session's disk:
            the session wakes there once it answers again.
        image:
          type: string
          description: |
            The image its disk is laid over, pinned by digest, once it has
            woken: built from its `config.sandbox.recipe` when it has one.
            It is the session's for its life.
        bundle:
          type: string
          description: |
            The bundle its harness was mounted from when it last woke — the
            harness's `bundle` then — and absent for a session whose image
            holds its harness. Unlike `image`, it is not the session's for
            its life: each wake mounts the harness's bundle as it is, so a
            session asleep wakes on a newer one, and one awake is moved onto
            it by being put to sleep and woken.
    SessionSandboxRunner:
      type: object
      required: [id, name]
      properties:
        id: {type: string, description: Its hostID.}
        name: {type: string}
        observedAt:
          type: string
          format: date-time
          description: When it last reported; absent when it has not since the sandboxes server started.
    ProfileRef:
      type: object
      required: [id, version]
      description: What it was started from.
      properties:
        id: {$ref: "#/components/schemas/Id"}
        version: {type: integer}
    TriggerRef:
      type: object
      required: [triggerId, firingId]
      description: For `trigger`.
      properties:
        triggerId: {$ref: "#/components/schemas/Id"}
        firingId: {type: string}
    BranchedFrom:
      type: object
      required: [sessionId, seq]
      description: For `fork`.
      properties:
        sessionId: {$ref: "#/components/schemas/Id"}
        seq: {type: integer, format: int64}
    LineageNode:
      type: object
      required: [id, title, source, depth, state, self]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        title: {type: string}
        source: {$ref: "#/components/schemas/SessionSource"}
        parentId: {$ref: "#/components/schemas/Id"}
        depth: {type: integer}
        state: {$ref: "#/components/schemas/SessionState"}
        self: {type: boolean}
    Model:
      type: object
      description: |
        A model as its provider's API lists it. What the API does not say
        is absent, never guessed: OpenAI's `/v1/models` says no context
        window, for one.
      required: [id, title]
      properties:
        id:
          type: string
          description: What a turn names to run on it, as the provider spells it.
          example: claude-opus-5-5
        title:
          type: string
          description: The provider's name for it; its `id` when the provider has none.
          example: Claude Opus 5.5
        contextWindow:
          type: integer
          description: How many tokens its context holds, when the provider says.
          example: 1000000
        maxOutput:
          type: integer
          description: How many tokens one answer may be, when the provider says.
          example: 128000
        createdAt:
          type: string
          format: date-time
          description: When the provider released it, when it says.
    HarnessModel:
      description: A model a harness may run, and the providers that offer it.
      allOf:
        - $ref: "#/components/schemas/Model"
        - type: object
          required: [providerType, providers]
          properties:
            providerType: {$ref: "#/components/schemas/ProviderType"}
            providers:
              type: array
              description: The providers whose list has it, by name. A turn naming the model runs on one of these.
              minItems: 1
              items: {$ref: "#/components/schemas/Name"}
    Limits:
      type: object
      required: [maxResources, maxPageLimit, eventsKept, changesKept, maxLineage, maxFileBytes, maxDepth, uploadTtlSeconds]
      properties:
        maxResources: {$ref: "#/components/schemas/Resources"}
        maxPageLimit: {type: integer, example: 500}
        eventsKept:
          type: integer
          format: int64
          description: How many events of a session are kept; 0 is all of them.
        changesKept: {type: integer, example: 10000}
        maxLineage: {type: integer, example: 200}
        maxDepth:
          type: integer
          description: How deep sessions may start sessions.
          example: 8
        maxFileBytes: {type: integer, format: int64, example: 104857600}
        uploadTtlSeconds:
          type: integer
          description: How long an upload no turn names is kept.
          example: 86400
    Defaults:
      type: object
      required: [harness, resources, idleSeconds, pageLimit]
      description: What a session gets when it names nothing. Its model, which depends on the providers, is its harness's `defaultModel`.
      properties:
        harness: {type: string, example: claude-code}
        resources: {$ref: "#/components/schemas/Resources"}
        idleSeconds: {type: integer, example: 900}
        pageLimit: {type: integer, example: 100}
    Id:
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"
      description: Chosen by the caller, opaque to the server. A UUID unless the caller has a better one.
      example: 0192f6a4-3c1e-7b2a-9d4e-5f6a7b8c9d0e
    Name:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}$"
      example: github
    Page:
      type: object
      properties:
        nextCursor:
          type: string
          description: The next page's cursor. Absent means the end.
    ErrorCode:
      type: string
      description: Closed, because callers branch on it, and a branch over an open string is a branch with a silent default.
      enum:
        - bad_request
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - spec_conflict
        - in_use
        - gapped
        - too_large
        - quota_exceeded
        - capacity_exceeded
        - sandbox_failed
        - provider_error
        - upstream_error
        - not_supported
        - not_implemented
        - recent_signin_required
        - recipe_invalid
        - managed
        - runner_offline
        - runner_unreachable
        - gone
        - internal
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {$ref: "#/components/schemas/ErrorCode"}
            message:
              type: string
              description: For a person reading a log. Rendered as text, never as markup.
    GapError:
      type: object
      required: [error, firstSeq, lastSeq]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {$ref: "#/components/schemas/ErrorCode"}
            message: {type: string}
        firstSeq:
          type: integer
          format: int64
          description: The oldest kept.
        lastSeq:
          type: integer
          format: int64
          description: The newest.
    Scope:
      type: string
      enum:
        - sessions.read
        - sessions.write
        - sessions.delete
        - sandbox
        - profiles.write
        - brokers.write
        - triggers.write
        - triggers.fire
        - keys.admin
        - providers.write
        - users.admin
        - settings.write
        - usage.read
      description: |
        | scope | lets a key |
        |---|---|
        | `sessions.read` | read sessions, their events, work and files, and usage |
        | `sessions.write` | start sessions, send turns, steer them, write files, share them |
        | `sessions.delete` | delete sessions |
        | `sandbox` | open a session's terminal |
        | `profiles.write` | change profiles |
        | `brokers.write` | change brokers and MCP connectors |
        | `triggers.write` | change triggers |
        | `triggers.fire` | fire triggers — and nothing else, for a scheduler's key |
        | `keys.admin` | mint and revoke keys |
        | `providers.write` | make, change and remove providers |
        | `users.admin` | invite people into the workspace, make them its admins or members, remove them |
        | `settings.write` | change the workspace's settings |
        | `usage.read` | read the workspace's usage (`GET /v1/usage`), and nothing else: what the platform bills it by |

        A member holds `sessions.read`, `sessions.write`, `sessions.delete`,
        `sandbox`, `keys.admin` and `providers.write`, over what is theirs;
        an admin holds every scope, over everything in the workspace. A key
        holds what it was given of what its person holds now. The platform,
        calling with a platform token, holds what the token names of
        `--platform-scopes`, and never `keys.admin` or `users.admin`.
    Owner:
      type: string
      pattern: "^(app:[a-z][a-z0-9-]{0,62}|[^@\\s]+@[^@\\s]+)$"
      description: |
        Whose a thing is: a person, by address, or an application, as
        `app:<id>` — one of the workspace's connect applications
        (`/v1/connect/apps`). An application holds the scopes its
        registration grants over what is its own, as a member holds theirs.
      example: ada@example.com
    EndUser:
      type: object
      required: [id]
      additionalProperties: false
      description: |
        Somebody an application signs in itself, whom a session, a
        provider or a turn of the application's is for. No person of the
        workspace: no role, no sign-in, no key.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
          description: The application's own id for them — a row of its users table, say — opaque to the workspace.
          example: u123
        email:
          type: string
          format: email
          description: |
            Their address, when the application gives it: what a tunnel a
            turn of theirs opens is open to (the tunnel gateway asks them to
            sign in as it). Without it, a turn of theirs opens no tunnel.
    SessionTokenRequest:
      type: object
      additionalProperties: false
      properties:
        endUser: {$ref: "#/components/schemas/EndUser"}
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 3600
          description: How long it works.
    SessionToken:
      type: object
      required: [token, sessionId, expiresAt]
      properties:
        token:
          type: string
          description: "The bearer, `ryst_…`, sent as `Authorization: Bearer`. Shown this once, and kept nowhere."
        sessionId: {type: string}
        endUser: {$ref: "#/components/schemas/EndUser"}
        expiresAt: {type: string, format: date-time}
    Transfer:
      type: object
      required: [to]
      additionalProperties: false
      properties:
        to: {$ref: "#/components/schemas/Owner"}
        sessions:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [id]
            additionalProperties: false
            properties:
              id: {type: string}
              endUser: {$ref: "#/components/schemas/EndUser"}
        providers:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              name: {$ref: "#/components/schemas/Name"}
              endUser: {$ref: "#/components/schemas/EndUser"}
        profiles:
          type: array
          maxItems: 1000
          items: {$ref: "#/components/schemas/Id"}
        brokers:
          type: array
          maxItems: 1000
          items: {$ref: "#/components/schemas/Name"}
        mcpConnectors:
          type: array
          maxItems: 1000
          items: {$ref: "#/components/schemas/Name"}
        triggers:
          type: array
          maxItems: 1000
          items: {$ref: "#/components/schemas/Id"}
        links:
          type: array
          maxItems: 100
          items: {type: string}
          description: Connect links, by id (`GET /v1/connect/links`).
    Owned:
      type: object
      required: [owner, everyone, users]
      properties:
        owner:
          allOf: [{$ref: "#/components/schemas/Owner"}]
          description: Who made it, who may use it always.
        everyone:
          type: boolean
          description: Every person may use it.
        users:
          type: array
          description: The people besides its owner who may use it, by address, sorted.
          items: {type: string, format: email}
    Users:
      type: object
      required: [everyone, users]
      description: Who besides its owner may use a thing.
      properties:
        everyone:
          type: boolean
          description: Every person of the workspace, whoever `users` names.
        users:
          type: array
          maxItems: 1000
          description: Each a person of the workspace, or it is `400`.
          items: {type: string, format: email}
    Notice:
      type: object
      required: [id, level, title, text]
      description: |
        Something the person should know and act on, as it stands now: it
        is gone once resolved.
      properties:
        id:
          type: string
          description: The same while it stands — `profile:reviewer`, `provider:ada-claude`.
        level:
          type: string
          enum: [warning, error]
        title: {type: string}
        text: {type: string}
        href:
          type: string
          description: Where in the console it is acted on, as a path under `/console`, when somewhere is.
          example: /deployments
    NoticeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Notice"}
    SelfDirectory:
      type: object
      required: [homeUrl, orgs, workspaces, current]
      description: What the platform last said the caller's person may reach, as its `GET /api/me` lists it.
      properties:
        homeUrl:
          type: string
          format: uri
          description: The platform (`--home-url`).
        orgs:
          type: array
          description: Their orgs, personal first, then by name.
          items: {$ref: "#/components/schemas/DirectoryOrg"}
        workspaces:
          type: array
          description: The ready workspaces they may open, by org (as `orgs`), then title.
          items: {$ref: "#/components/schemas/DirectoryWorkspace"}
        current:
          type: object
          required: [workspace]
          properties:
            workspace:
              type: string
              description: This server's workspace by its name (`--workspace`), which is its slug at the platform.
        fetchedAt:
          type: string
          format: date-time
          description: When the platform last answered about them; absent when it never has.
    DirectoryOrg:
      type: object
      required: [id, handle, name, kind, role]
      properties:
        id: {type: string, example: acc_7qx2}
        handle: {type: string, example: acme-7qx2}
        name: {type: string, example: Acme}
        kind:
          type: string
          enum: [personal, org]
        role:
          type: string
          enum: [owner, admin, member]
    DirectoryWorkspace:
      type: object
      required: [id, slug, title, org, url, access]
      properties:
        id: {type: string, example: wsp_p4m1}
        slug: {type: string, example: research-p4m1}
        title: {type: string, example: Research}
        org:
          type: string
          description: The handle of the org it belongs to.
          example: acme-7qx2
        url:
          type: string
          description: Its public URL, the chat at `/` and the console at `/console/`.
          example: https://research-p4m1.example.com
        access:
          type: string
          enum: [admin, member]
    Info:
      type: object
      required: [version, workspace, image, defaults, limits]
      properties:
        version: {type: string, example: 0.1.0}
        workspace: {$ref: "#/components/schemas/Workspace"}
        homeUrl:
          type: string
          format: uri
          description: |
            The platform in front of this server (`--home-url`), when there
            is one: where the top bar's org, billing and workspace links go
            (`<homeUrl>/home`, `<homeUrl>/new`, `<homeUrl>/<org>/settings`).
        image:
          type: string
          description: What every session's sandbox boots.
        defaults: {$ref: "#/components/schemas/Defaults"}
        limits: {$ref: "#/components/schemas/Limits"}
        identity: {$ref: "#/components/schemas/Identity"}
        consoleKey:
          type: string
          description: |
            The public half of the key this server signs what it forwards to
            a broker's console with (`/v1/brokers/{brokerName}/console/`):
            PEM, `-----BEGIN PUBLIC KEY-----`, an ES256 (P-256) key. Made
            once, at the server's first start, and the same ever after, so
            whoever installs a broker pins it there. Its private half never
            leaves the server.
    TitleSource:
      type: string
      description: |
        Where the session's title came from: `default`, none was had;
        `first_turn`, the first line of its first turn; `summary`, its
        provider summarized its conversation; `given`, a person or a
        program gave it. Absent on a session made before it was kept.
      enum: [default, first_turn, summary, given]
    Identity:
      type: object
      required: [mode]
      description: |
        Where a person's role comes from, and how the server learns they
        have left.

        - `claims` (`--signin-roles-claim`): from a claim of the identity
          tokens of the OpenID provider (`--oidc-issuer`), at every sign-in
          and every refresh. People are not added, changed or invited here:
          the provider decides. The server keeps each person's refresh token
          and asks the provider about them every `refreshSeconds`; one it
          refuses (`invalid_grant`, or no role any more) is offboarded — their
          sign-ins end, their keys and links are suspended, their sessions
          paused — and what is theirs waits for an admin to hand it over or
          delete it (`DELETE /v1/users/{userEmail}`). A provider that does not
          answer changes nothing for `unreachableGraceSeconds`; after that,
          keys are suspended until it answers again.
        - `local`: from the people the workspace keeps, managed here, as
          with a password file (`--htpasswd`) or a provider that says no role
          (Google). Removing a person revokes their keys.
      properties:
        mode:
          type: string
          enum: [claims, local]
        claim:
          type: string
          description: For `claims`, the claim roles are read from (`groups`, `runyard_role`).
        refreshSeconds:
          type: integer
          description: For `claims`, how often each person is asked about at the provider (`--signin-refresh`).
        unreachableGraceSeconds:
          type: integer
          description: |
            For `claims`, how long a provider may not answer before keys are
            suspended (`--signin-unreachable-grace`).
        keyLifetimeSeconds:
          type: integer
          description: |
            For `claims` with a provider that gives no refresh tokens: a key
            stops working this long after its person last signed in, and
            works again when they sign in (`--signin-key-lifetime`). It is how
            long offboarding can take there.
    Caller:
      type: object
      required: [kind, name, scopes]
      description: |
        A key — sent as a bearer, or the one a UI was signed in with — a
        person signed in with a password or Google, who holds their role's
        scopes, a session's harness calling through its brokers, or the
        Runyard platform calling with a platform token, or a session token
        (`POST /v1/sessions/{sessionId}/tokens`), which acts as its
        session's owner in that session alone.

        The platform is nobody: no person, not the workspace's owner. It
        has no `email` and no `role`, and holds the scopes its token names
        of those the server was started to grant it (`--platform-scopes`),
        over the workspace — and nothing else.

        A session is no key: nobody made one for it, and none is kept. The
        server knows it by the broker the call came through, and it acts as
        its owner — reading and starting sessions and firing triggers, in its
        own tree alone.
      properties:
        kind:
          type: string
          enum: [key, person, session, platform, token]
        name:
          type: string
          description: The key's name, the person's username or Google name, or `Runyard platform`.
        email:
          type: string
          format: email
          description: The person signed in, or the person the key or session is of. Absent for `platform` and an application.
        role:
          allOf: [{$ref: "#/components/schemas/Role"}]
          description: The person's, or the key's or session's person's. Absent for `platform` and an application.
        app:
          allOf: [{$ref: "#/components/schemas/ConnectAppRef"}]
          description: |
            For a key or session of an application's: the application. It
            holds the scopes its registration grants, over what is its own.
        hasPicture:
          type: boolean
          description: |
            A person signed in with Google who has a profile picture: it is
            `GET /v1/self/picture`.
        signIn:
          type: object
          required: [via, at]
          description: |
            For a person signed in to a UI, how and when: what a UI asks
            them to confirm it is them with (`POST /v1/signin/confirm`, or
            the provider's sign-in with `confirm=true`).
          properties:
            via:
              type: string
              enum: [password, google, oidc]
            at:
              type: string
              format: date-time
              description: When they signed in, or last confirmed it was them.
        keyId: {type: string, description: "For `key`."}
        scopes:
          type: array
          items: {$ref: "#/components/schemas/Scope"}
        sessionId:
          type: string
          description: For `session` and `token`, the session.
        endUser:
          allOf: [{$ref: "#/components/schemas/EndUser"}]
          description: For `token`, whom it speaks for, when it speaks for an end user.
        profile:
          allOf: [{$ref: "#/components/schemas/ProfileRef"}]
          description: For `session`, the profile it was started from, when it was.
    ConfirmSignIn:
      type: object
      required: [password]
      properties:
        password: {type: string, writeOnly: true, minLength: 1, maxLength: 1000}
    NewKey:
      type: object
      required: [name, scopes, expiresAt]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        app:
          allOf: [{$ref: "#/components/schemas/ConnectAppId"}]
          description: |
            A key of this application's rather than the caller's: an
            admin's to mint. Its scopes are those of the application's
            registration it is given.
        scopes:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Scope"}
        expiresAt:
          type: string
          format: date-time
          description: In the future, and within ten years.
    KeyChange:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          description: Every scope the key holds from now on, in place of what it held.
          items: {$ref: "#/components/schemas/Scope"}
    KeyAuthorizationRequest:
      type: object
      description: >-
        A key a person approves for a program, as `NewKey`, and what its code is bound to. No `owner`: the key is its approver's.
      required: [name, scopes, expiresAt, codeChallenge]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            What the program asking called itself (`client`), as text a person can read.
          example: ryclaude on ada-laptop
        scopes:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Scope"}
        expiresAt:
          type: string
          format: date-time
          description: >-
            When the key expires — not the code, which lasts five minutes. In the future, and within ten years.
        codeChallenge:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: >-
            The SHA-256 of the `codeVerifier` the redeem will show, in base64url without padding: RFC 7636's `S256`, the only method there is here.
          example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        redirectUri:
          type: string
          maxLength: 2048
          description: |
            Where the page takes the browser with the code; left out when it
            shows the code instead. `http://127.0.0.1:<port>/…`,
            `http://localhost:<port>/…` or `http://[::1]:<port>/…`, as
            written: the scheme in small letters, a port written as a number
            is that is neither 0 nor 80 (a browser drops 80 from an address),
            no user, no fragment, no space or backslash. Checked, not kept.
          example: "http://127.0.0.1:49152/callback"
        replaces:
          type: string
          description: |
            A suspended link (`Key.link`) of somebody else's that this
            approval stands in for: approved by an admin, and redeemed, the
            new key is the admin's and the old one is deleted. Anything but a
            suspended link, or an approver who is not an admin, is `400`.
    ConnectAppId:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}$"
      description: An application's id, its OAuth `client_id`.
      example: acme-app
    ConnectAppRef:
      type: object
      required: [id, name]
      properties:
        id: {$ref: "#/components/schemas/ConnectAppId"}
        name: {type: string, example: Acme App}
    ConnectApp:
      type: object
      required: [id, name, redirectUris, scopes, source]
      description: |
        An application that may ask the workspace's admins for a key
        (`GET /v1/connect/authorize`). Its secret is never here, nor its hash.
      properties:
        id: {$ref: "#/components/schemas/ConnectAppId"}
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What the consent page calls it, and its keys are named after.
          example: Acme App
        redirectUris:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 2048}
          description: >-
            None for one an admin mints its keys for, which never connects. Where its answers may go, each matched byte for byte: `https://`, or `http://` on loopback (`localhost`, `127.0.0.1`, `[::1]`), with no user and no fragment.
          example: ["https://acme-app.example/runyard/callback"]
        scopes:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Scope"}
          description: >-
            What its keys may hold, over what is the application's own. Of `sessions.read sessions.write sessions.delete profiles.write providers.write brokers.write triggers.write triggers.fire`, and all of them unsaid. Its keys are minted by connect, of what their approver holds too, or by an admin (`POST /v1/keys` with `app`).
        source: {$ref: "#/components/schemas/ConnectAppSource"}
        createdAt:
          type: string
          format: date-time
          description: When it was registered; a release's has none.
    ConnectAppSource:
      type: string
      enum: [release, console]
      x-enum-varnames: [AppFromRelease, AppFromConsole]
      description: >-
        `release`: named by the release (`--apps-file`), and changed only by another; `console`: registered by an admin, here.
    ConnectAppList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ConnectApp"}
    NewConnectApp:
      type: object
      required: [id, name, redirectUris]
      properties:
        id: {$ref: "#/components/schemas/ConnectAppId"}
        name:
          type: string
          minLength: 1
          maxLength: 100
        redirectUris:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 2048}
        scopes:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Scope"}
    RegisteredConnectApp:
      allOf:
        - $ref: "#/components/schemas/ConnectApp"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: >-
                What the application authenticates with, as the password of HTTP Basic at `POST /v1/connect/token`. In this answer and nowhere else.
              example: ryas_8bZ3…
    ConnectConsent:
      type: object
      required: [app, scopes, mayApprove]
      properties:
        app: {$ref: "#/components/schemas/ConnectAppRef"}
        scopes:
          type: array
          items: {$ref: "#/components/schemas/Scope"}
          description: What the key would hold, approved by the caller.
        mayApprove:
          type: boolean
          description: Whether the caller may approve or deny it — an admin of the workspace holding `keys.admin` — or is to ask one.
    ConnectDecision:
      type: object
      required: [clientId, redirectUri, codeChallenge, codeChallengeMethod, approve]
      description: The authorize request's query, as the consent page read it, and what the admin decided.
      properties:
        clientId: {type: string}
        redirectUri: {type: string, maxLength: 2048}
        state: {type: string, maxLength: 512}
        context: {type: string, maxLength: 100}
        codeChallenge:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        codeChallengeMethod:
          type: string
          enum: [S256]
        approve: {type: boolean}
    ConnectRedirect:
      type: object
      required: [redirect]
      properties:
        redirect:
          type: string
          format: uri
          description: The application's redirect, with `code` (or `error=access_denied`), `state` and `iss` on it.
    ConnectTokenRequest:
      type: object
      required: [grant_type, code, redirect_uri, code_verifier]
      properties:
        grant_type: {type: string, example: authorization_code}
        code: {type: string}
        redirect_uri: {type: string}
        code_verifier: {type: string}
    ConnectGrant:
      type: object
      required: [link, workspace, sessions, approvedBy]
      properties:
        link:
          type: string
          description: The link's id, as `GET /v1/connect/links` lists it.
          example: lnk_4f7k2m9q1x8c
        workspace:
          type: object
          required: [id, name, title, namespace, sandboxesCa]
          properties:
            id:
              type: string
              description: The platform's id of the workspace, when its release says one (`--platform-workspace-id`); its name otherwise.
            name: {$ref: "#/components/schemas/WorkspaceName"}
            title: {type: string}
            namespace:
              type: string
              deprecated: true
              description: |
                The workspace's name. It was the runyard-sandboxes namespace
                the workspace worked in, when one server held several
                workspaces; since each has a server of its own there is none,
                and it is kept, as the name, so that a client reading it
                does not break. Read `name`.
            sandboxesCa:
              type: string
              description: The CA (PEM) of the workspace's sandboxes server, which signs its sandboxes' identities.
        sessions:
          type: object
          required: [url, publicUrl, key]
          properties:
            url:
              type: string
              format: uri
              description: The workspace's API, at its public address (`--url`).
            publicUrl:
              type: string
              format: uri
              description: The same, for a browser — the chat and the console.
            key:
              type: string
              description: The link's key (`ryak_…`), shown this once.
        approvedBy:
          type: string
          format: email
          description: The admin who approved it. The key is the application's own (`app:<id>`), and outlives them.
    OAuthError:
      type: object
      required: [error]
      description: OAuth's error answer (RFC 6749 §5.2), not this contract's `Error`.
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unsupported_grant_type, server_error]
          x-enum-varnames: [OAuthInvalidRequest, OAuthInvalidClient, OAuthInvalidGrant, OAuthUnsupportedGrantType, OAuthServerError]
        error_description: {type: string}
    ConnectLink:
      type: object
      required: [id, app, approvedBy, keyId, createdAt]
      properties:
        id:
          type: string
          example: lnk_4f7k2m9q1x8c
        app: {$ref: "#/components/schemas/ConnectAppRef"}
        context:
          type: string
          description: What the application said it wanted the workspace for, when it said.
        approvedBy:
          type: string
          format: email
        keyId:
          type: string
          description: The key it holds (`GET /v1/keys/{keyId}`).
        createdAt:
          type: string
          format: date-time
    ConnectLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ConnectLink"}
    KeyAuthorization:
      type: object
      description: An approval waiting to be redeemed.
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: >-
            What `POST /v1/keys/authorizations/redeem` trades for the key, with the verifier: 32 random bytes in base64url. Only its SHA-256 is kept.
          example: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        expiresAt:
          type: string
          format: date-time
          description: When the code stops working, five minutes after it was given.
    KeyAuthorizationRedemption:
      type: object
      required: [code, codeVerifier]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
          description: The code the approval gave, as it was given.
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9._~-]{43,128}$"
          description: >-
            RFC 7636's `code_verifier`: 43 to 128 unreserved characters, whose SHA-256 in base64url without padding is the approval's `codeChallenge`.
    Key:
      type: object
      required: [id, name, owner, scopes, createdAt, expiresAt]
      properties:
        id: {type: string, example: k7d2m9x4p1qa}
        name: {type: string}
        owner:
          allOf: [{$ref: "#/components/schemas/Owner"}]
          description: |
            Whose it is, and whom it acts as: the person who made it — the
            workspace's owner for the one the server keeps from
            `--owner-key-file` — or the application connect or an admin minted
            it for (`app:<id>`).
        scopes:
          type: array
          items: {$ref: "#/components/schemas/Scope"}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        lastUsedAt:
          type: string
          format: date-time
          description: To the minute.
        link:
          type: boolean
          description: |
            Made for a program its owner approved
            (`POST /v1/keys/authorizations`): a connect link, which acts as
            the person who approved it and no more. Suspended with them, it
            needs an admin to approve the program again (`replaces`).
        suspended: {$ref: "#/components/schemas/KeySuspension"}
    KeySuspension:
      type: object
      required: [reason, since]
      description: |
        Why a key does not work now, though it is kept and listed: an admin
        may delete it, and it works again when its cause ends.

        | reason | cause | ends when |
        |---|---|---|
        | `offboarded` | the OpenID provider refused its person | they sign in with a role again |
        | `issuer_unreachable` | the provider has not answered about its person for longer than the grace | the provider answers |
        | `signin_expired` | a provider that gives no refresh tokens, and its person has not signed in for `keyLifetimeSeconds` | they sign in |
      properties:
        reason:
          type: string
          enum: [offboarded, issuer_unreachable, signin_expired]
        since: {type: string, format: date-time}
    MintedKey:
      allOf:
        - $ref: "#/components/schemas/Key"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The whole key, `ryak_<id>_<secret>`. Shown this once.
    KeyPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/Key"}
    Harness:
      type: object
      required: [name, title, providerTypes, models, features]
      properties:
        name:
          type: string
          description: "`claude-code`, `codex` or `opencode`."
          example: claude-code
        title: {type: string, example: Claude Code}
        bundle:
          type: string
          description: |
            The image its sessions' harness is mounted from, beside whatever
            image they boot: the harness and the tools it shells out to,
            pinned by digest. What each session woke on is its
            `sandbox.bundle`; one that differs from this is moved onto it by
            its next wake. Absent for a harness this server runs from its own
            image alone, whose sessions boot that image or a recipe `FROM
            harness/<name>`.
          example: releases.runyard.ai/runyard-public/bundle-claude@sha256:9b1c…
        providerTypes:
          type: array
          description: The types of provider it runs on.
          minItems: 1
          items: {$ref: "#/components/schemas/ProviderType"}
        models:
          type: array
          description: |
            What the providers of those types listed when last asked,
            each once, newest first (`createdAt`; those without one last,
            by `id`). Empty while there is no such provider, or none has
            answered yet.
          items: {$ref: "#/components/schemas/HarnessModel"}
        defaultProvider:
          allOf: [{$ref: "#/components/schemas/Name"}]
          description: |
            What a session on it runs on when it names no provider: the
            default provider when it is of a type the harness runs on, else
            the first such by name. Absent when there is none.
        defaultModel:
          type: string
          description: |
            What a session on it runs when it names no model: the server's
            configured model for the harness, if `defaultProvider` lists
            it or has listed nothing yet, or else the newest of
            `defaultProvider`'s models. Absent when there is neither.
          example: claude-opus-5-5
        features:
          type: array
          description: |
            What a session on it does besides answering turns, so that a
            UI shows what works without knowing harnesses by name. Claude
            Code has them all.

            - `interrupt`: `…/interrupt`, and turns with `mode: interrupt`.
            - `compact`: `…/compact`, and `compaction` events.
            - `rewind`: `…/rewind`.
            - `fork`: `…/fork`.
            - `subagents`: the session starts sub-agents — `subagent` events,
              `parentToolId`, `…/subagents`.
            - `background_tasks`: `background_task` events,
              `…/background-tasks` and stopping one.
            - `task_list`: the session keeps a task list — `tasks` events,
              `…/tasks`.
            - `alarms`: the session sets prompts for later — `alarm`
              events, `…/alarms`, and `nextAlarmAt`.
            - `partials`: what the session writes streams live, as partials
              of the events stream, before it is an event.
            - `title`: the session's title is summarized from its
              conversation, as its harness would — `…/retitle`, and
              `autoTitle`.

            An operation of a feature the session's harness lacks is `400
            not_supported` — not `409`, which is a session that could do it
            in another state; the lists of one it lacks are empty.
          items: {$ref: "#/components/schemas/HarnessFeature"}
    HarnessFeature:
      type: string
      enum: [interrupt, compact, rewind, fork, subagents, background_tasks, task_list, alarms, partials, title]
    ProviderType:
      type: string
      description: |
        Whose API a provider reaches. A harness says which types it runs
        on. `openai_compatible` is a server of OpenAI's chat completions
        that is not OpenAI's — llama.cpp's llama-server, vLLM — at the
        provider's `baseUrl`.
      enum: [anthropic, openai, openai_compatible]
    Provider:
      type: object
      description: A named credential for a provider's API, never the credential itself.
      required: [name, title, owner, type, kind, status, isDefault, models, everyone, users]
      properties:
        name: {$ref: "#/components/schemas/Name"}
        title: {type: string, example: Work subscription}
        owner:
          allOf: [{$ref: "#/components/schemas/Owner"}]
          description: Who made it, who may use it always.
        endUser:
          allOf: [{$ref: "#/components/schemas/EndUser"}]
          description: For an application's provider, the end user whose own it is.
        everyone:
          type: boolean
          description: Every person may use it, whoever `users` names.
        users:
          type: array
          description: The people besides its owner who may use it, by address, sorted.
          items: {type: string, format: email}
        type: {$ref: "#/components/schemas/ProviderType"}
        kind: {$ref: "#/components/schemas/ProviderKind"}
        baseUrl:
          type: string
          format: uri
          description: |
            An `openai_compatible` provider's server, under which its API
            is (`/v1/chat/completions`, `/v1/models`). Absent for the
            other types.
          example: http://192.168.1.20:8080
        status:
          type: string
          enum: [ok, rejected, unreachable, needs_signin]
          description: |
            What the provider said the last time the credential was tried
            or renewed. `needs_signin` is a subscription whose renewal the
            provider refused: sign it in again.
        account:
          type: string
          description: Who the subscription is, when the provider says.
        plan:
          type: string
          description: The subscription's plan, when the provider says.
          example: max
        isDefault:
          type: boolean
          description: What a session runs on when it names no provider. Exactly one is.
        expiresAt:
          type: string
          format: date-time
          description: When a subscription's access token expires. The server renews it before.
        renewedAt:
          type: string
          format: date-time
          description: When a subscription's access token was last renewed.
        checkedAt: {type: string, format: date-time}
        limits: {$ref: "#/components/schemas/RateLimits"}
        models:
          type: array
          description: |
            What the provider's API listed with this credential when last
            asked — the models it may run, newest first. Empty until it has
            answered once; a failure since keeps the list, and says so in
            `modelsError`.
          items: {$ref: "#/components/schemas/Model"}
        modelsReadAt:
          type: string
          format: date-time
          description: When `models` was read. Absent until it has been.
        modelsError:
          type: string
          description: Why the last time the models were asked failed; absent when it did not.
    RateLimits:
      type: object
      required: [observedAt]
      description: |
        The provider's latest word on how much of the credential's limits
        is spent, read off its answers to the sessions' calls: Anthropic's
        `anthropic-ratelimit-unified-*` headers for a Claude plan, the
        `x-codex-*` ones for a ChatGPT plan, and `x-ratelimit-*` for an
        API key. Absent until a call has been made.
      properties:
        status:
          type: string
          description: The provider's own word for it, as it said it.
          example: allowed
        fiveHour:
          allOf: [{$ref: "#/components/schemas/RateLimitWindow"}]
          description: |
            A plan's short window, of five hours: a Claude plan's, or a
            ChatGPT plan's of 300 minutes. Also in `windows`.
        sevenDay:
          allOf: [{$ref: "#/components/schemas/RateLimitWindow"}]
          description: |
            A plan's long window, of a week: a Claude plan's, or a ChatGPT
            plan's of 10080 minutes. Also in `windows`.
        windows:
          type: array
          description: |
            Every window the provider's last answer reported, as it named
            them: a plan's (`five_hour`, `seven_day`, `primary`,
            `secondary`, and any limit family of a model's), an API key's
            per-minute `requests` and `tokens`.
          items: {$ref: "#/components/schemas/RateLimitWindow"}
        credits: {$ref: "#/components/schemas/RateLimitCredits"}
        observedAt:
          type: string
          format: date-time
          description: The answer it was read off.
    RateLimitWindow:
      type: object
      required: [utilization]
      properties:
        name:
          type: string
          description: The provider's name for the window; absent for `fiveHour` and `sevenDay` when it named none.
          example: primary
        windowMinutes:
          type: integer
          minimum: 0
          description: How long the window is, when the provider says.
          example: 300
        utilization:
          type: number
          format: double
          minimum: 0
          description: How much of the window's limit is spent, 1 being all of it.
          example: 0.42
        resetsAt: {type: string, format: date-time}
    RateLimitCredits:
      type: object
      required: [hasCredits, unlimited]
      description: A ChatGPT plan's credits, spent when its windows are, as the provider last said.
      properties:
        hasCredits: {type: boolean}
        unlimited: {type: boolean}
        balance:
          type: string
          description: As the provider wrote it.
    SignInFlow:
      type: object
      required: [flowId, method, expiresAt]
      description: A subscription's sign-in begun. What to show the person is by `method`.
      properties:
        flowId: {type: string}
        method: {$ref: "#/components/schemas/SignInMethod"}
        authorizationUrl:
          type: string
          format: uri
          description: "`code` and `redirect`: the page the person opens to sign in."
        verificationUri:
          type: string
          format: uri
          description: "`device`: the page the person opens, on any machine, to enter `userCode`."
        userCode:
          type: string
          description: "`device`: what the person enters there."
          example: ABCD-EFGH
        expiresAt:
          type: string
          format: date-time
          description: When the flow is given up on, finished or not.
    SignInMethod:
      type: string
      description: |
        How a subscription signs in: `code` (Anthropic: a code shown, and
        pasted), `device` (OpenAI: a code entered on the provider's page,
        the server waiting for it), or `redirect` (OpenAI: the address the
        browser ended on, pasted).
      enum: [code, device, redirect]
    ProviderKind:
      type: string
      enum: [api_key, subscription]
      description: |
        An API key (`PUT`), or a subscription signed in (`…/signin`):
        a Claude plan for `anthropic`, a ChatGPT plan for `openai`.
        An `openai_compatible` provider is an `api_key`, whether or not
        it was given one.

        When the workspace's shared broker `llm` is one its runners provide
        (declared `url: runner` on the sandboxes server), a session on an
        `anthropic` or `openai` provider reaches the model through its
        runner's `llm` broker, which this server lends the credential to
        for each turn alone, and takes it back from when the turn ends.
    ProviderApiKey:
      type: object
      required: [type]
      properties:
        type: {$ref: "#/components/schemas/ProviderType"}
        kind:
          allOf: [{$ref: "#/components/schemas/ProviderKind"}]
          description: |
            `api_key`, the default. `subscription` is `400`: one is signed
            in (`…/signin`).
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Its name when absent.
        secret:
          type: string
          writeOnly: true
          description: |
            The API key. Required, but for `openai_compatible`, whose
            server may take none.
        baseUrl:
          type: string
          format: uri
          description: |
            `openai_compatible`'s, and required for it: its server, http
            or https, as `http://192.168.1.20:8080`; a `/v1` at its end is
            taken off. `400` for the other types.
    ProviderSignIn:
      type: object
      required: [type]
      properties:
        type: {$ref: "#/components/schemas/ProviderType"}
        method:
          allOf: [{$ref: "#/components/schemas/SignInMethod"}]
          description: |
            How to sign in; the type's first when absent — `code` for
            `anthropic`, `device` for `openai`. One the type does not offer
            is `400`.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Its name when absent.
        endUser:
          allOf: [{$ref: "#/components/schemas/EndUser"}]
          description: |
            For an application's provider, the end user whose own
            subscription it is: their turns run on it (`Turn.endUser`). Only
            an application names one, and it is `403` otherwise.
    ProviderSignInFinish:
      type: object
      description: By the flow's method — `code` for `code`, `redirectUrl` for `redirect`, nothing for `device`.
      properties:
        code:
          type: string
          writeOnly: true
          description: What the provider showed, as it showed it.
        redirectUrl:
          type: string
          writeOnly: true
          description: The address the browser was sent to after signing in, whole, as its address bar shows it.
          example: http://localhost:1455/auth/callback?code=…&state=…
    ProviderUpdate:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        isDefault:
          type: boolean
          description: "`true` makes it the default; `false` is `400`."
        everyone: {type: boolean}
        users:
          type: array
          description: Replaces them all; each a person of the workspace, or it is `400`.
          maxItems: 1000
          items: {type: string, format: email}
    Role:
      type: string
      enum: [admin, member]
      description: A person's in the workspace. An admin sees and changes everything in it; a member has the chat, over what is theirs.
    WorkspaceName:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,38}[a-z0-9]$"
      description: Small letters, digits and dashes, a letter first.
      example: acme
    Workspace:
      type: object
      required: [name, title, namespace, owner]
      description: |
        The workspace the server serves, as it was started: none of it is
        changed through this API.
      properties:
        name: {$ref: "#/components/schemas/WorkspaceName"}
        title:
          type: string
          description: What it is called (`--workspace-title`); its name when nobody said.
        namespace:
          type: string
          deprecated: true
          description: |
            Its name. It was the runyard-sandboxes namespace it worked in,
            when one server held several workspaces; since each has a server
            of its own there is none, and it is kept, as the name, so that a
            client reading it does not break. Read `name`.
        owner:
          type: string
          format: email
          description: Its owner (`--owner`), always an admin of it.
        policy:
          allOf: [{$ref: "#/components/schemas/WorkspacePolicy"}]
          description: |
            What the operator lets it have (`--policy-file`). Absent, there
            is none: its sessions are given what their config names.
    BuiltInBroker:
      type: string
      enum: [llm, egress, tunnels, sessions, images]
      x-enum-varnames: [BuiltInLlm, BuiltInEgress, BuiltInTunnels, BuiltInSessions, BuiltInImages]
      description: One of the server's own brokers.
    WorkspacePolicy:
      type: object
      description: |
        What the operator lets the workspace's sessions have: the file
        `--policy-file` names, read when the server starts, and shown here
        read-only. A change is a restart, and reaches each session as it next
        wakes.
      properties:
        brokers:
          type: array
          maxItems: 5
          items: {$ref: "#/components/schemas/BuiltInBroker"}
          description: |
            The built-in brokers its sessions may be given. `llm` is always
            allowed, listed or not. A built-in not listed is not the
            workspace's: it is not in its list of brokers, and is dropped —
            never refused, so that a profile kept before the policy changed
            still starts — from a profile's or a session's `brokers` as
            they are kept (so a spec sent again makes no new version), as
            they are read, and as a session wakes, the defaults included;
            `session_started` lists what it was given. Nothing kept is
            rewritten when the policy changes: what was kept before it is
            read without what it does not allow, and with it again once a
            limit is lifted. Shared brokers are unaffected. Absent, every
            built-in is allowed.
        egress:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 253, example: "*.pypi.org"}
          description: |
            Hosts every session's sandbox in the workspace reaches, from when it
            is made or woken for as long as it runs, as one rule on the
            sandboxes daemon named `policy` (ports 80 and 443). Each is a
            host (`registry.npmjs.org`) or a leading `*.` for everything
            under a domain (`*.pypi.org`, which does not cover `pypi.org`
            itself); no other wildcard, address, range, scheme, port or
            path, and no wildcard over a public suffix (`*.com`). Image
            builds are not given them.
    User:
      type: object
      description: A person of the workspace, in their role in it.
      required: [email, name, role, owner, createdAt]
      properties:
        email: {type: string, format: email}
        name:
          type: string
          description: Google's name of them, as they last signed in; their address until they have.
        role: {$ref: "#/components/schemas/Role"}
        owner:
          type: boolean
          description: The workspace's owner (`--owner`), always an admin, and never removed.
        invitedBy:
          type: string
          format: email
          description: Who brought them in.
        createdAt:
          type: string
          format: date-time
          description: When they came into the workspace.
        lastSeenAt:
          type: string
          format: date-time
          description: When they last signed in.
        offboardedAt:
          type: string
          format: date-time
          description: |
            With `claims` (`Identity`), when the OpenID provider last refused
            them: no sign-in, key or link of theirs works, their sessions are
            paused, and what is theirs waits for an admin to hand it over or
            delete it. Absent once they sign in with a role again.
    UserUpdate:
      type: object
      required: [role]
      properties:
        role: {$ref: "#/components/schemas/Role"}
    NewInvitation:
      type: object
      required: [role]
      properties:
        role: {$ref: "#/components/schemas/Role"}
        email:
          type: string
          format: email
          description: The one address that may use it. Absent, whoever has the link.
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
    Invitation:
      type: object
      required: [id, role, createdBy, createdAt, expiresAt]
      properties:
        id: {type: string, example: k7d2m9x4p1qa}
        role: {$ref: "#/components/schemas/Role"}
        email: {type: string, format: email}
        createdBy:
          type: string
          description: The admin who made it — an address, or the name the password file signs in.
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    MadeInvitation:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri
              description: The link to send, its code in it. Shown this once.
    SessionShares:
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          maxItems: 1000
          description: Sorted; their person is never among them.
          items: {type: string, format: email}
    Resources:
      type: object
      description: A sandbox's size. Absent fields are the default; more than `limits.maxResources` is `400`.
      properties:
        cpus: {type: integer, minimum: 1, example: 2}
        memory:
          type: string
          pattern: "^[0-9]+(Mi|Gi)$"
          example: 4Gi
        disk:
          type: string
          pattern: "^[0-9]+(Mi|Gi)$"
          description: The session's disk, kept while it sleeps.
          example: 20Gi
    SandboxUsage:
      type: object
      required: [memoryBytes, diskBytes]
      properties:
        cpuPercent:
          type: number
          format: double
          description: |
            How busy its CPUs were since the reading before: `100` is every
            one it was given, busy the whole time. Absent until there are two
            readings.
          example: 37.5
        memoryBytes:
          type: integer
          format: int64
          description: What its machine holds of the host's memory.
        diskBytes:
          type: integer
          format: int64
          description: What its disk has written, of the size it was given.
    UsageWindow:
      type: string
      enum: ["15m", "1h", "6h", "24h"]
      x-enum-varnames: [Window15m, Window1h, Window6h, Window24h]
      description: |
        How far back. `15m` and `1h` are a reading every ten seconds; `6h`
        and `24h` a point a minute, each the average of the readings in it.
    SandboxLimits:
      type: object
      description: |
        The size the machine was given — the session's `resources`, with the
        host's defaults filled in. A figure the host did not say is absent.
      properties:
        cpus: {type: integer, example: 2}
        memoryBytes:
          type: integer
          format: int64
          example: 4294967296
        diskBytes:
          type: integer
          format: int64
          description: The disk's declared size — what the session sees.
          example: 21474836480
    SandboxUsageHistory:
      type: object
      required: [window, stepSeconds, limits, points]
      properties:
        window: {$ref: "#/components/schemas/UsageWindow"}
        stepSeconds:
          type: integer
          description: |
            How far apart the points are meant to be. A gap wider than this is
            time the machine was not running, and is drawn as a gap.
          example: 10
        limits: {$ref: "#/components/schemas/SandboxLimits"}
        points:
          type: array
          description: Oldest first.
          items: {$ref: "#/components/schemas/SandboxUsagePoint"}
    SandboxUsagePoint:
      type: object
      required: [at]
      description: |
        One reading, measured from the host. A figure the host could not
        read is absent, and the CPU on the first reading: it is a difference
        between two.
      properties:
        at:
          type: string
          format: date-time
          description: When it was read, or for a coarse point the start of its minute.
        cpuPercent:
          type: number
          format: double
          description: Of every CPU the machine was given, as `SandboxUsage.cpuPercent`.
          example: 37.5
        memoryBytes:
          type: integer
          format: int64
          description: What its machine held of the host's memory.
        diskBytes:
          type: integer
          format: int64
          description: What its disk had written.
    SandboxProcessTable:
      type: object
      required: [total, truncated, items]
      properties:
        total:
          type: integer
          description: How many processes there were, whether or not all are listed.
          example: 42
        truncated:
          type: boolean
          description: |
            The table was cut at runyard-sandboxes' cap, and `items` is its
            first part by pid. Capped rather than paged: a table read twice
            is two different machines.
        cpuCount:
          type: integer
          description: The vCPUs the guest sees. A process's `cpuPercent` is of one of them.
          example: 2
        sampledMs:
          type: integer
          description: The window `cpuPercent` was measured over.
          example: 250
        items:
          type: array
          description: In pid order.
          items: {$ref: "#/components/schemas/SandboxProcess"}
    SandboxProcess:
      type: object
      required: [pid, ppid, name, state, kernelThread]
      description: |
        One process, as the guest says it is. A figure the guest did not
        give is absent.
      properties:
        pid: {type: integer, example: 42}
        ppid: {type: integer, example: 1}
        name:
          type: string
          description: The kernel's name for it, at most fifteen characters.
          example: node
        state:
          type: string
          description: |
            As `/proc` writes it: `R` running, `S` sleeping, `D` in
            uninterruptible sleep, `Z` a zombie nobody has reaped, `T`
            stopped, `I` idle.
          example: S
        argv:
          type: array
          items: {type: string}
          description: Its command line. Absent for a kernel thread, and for a zombie.
          example: ["node", "server.js", "--port", "8080"]
        uid: {type: integer, example: 1000}
        user:
          type: string
          description: The name `uid` has in the guest's `/etc/passwd`, when it has one.
          example: node
        threads: {type: integer, example: 11}
        cpuPercent:
          type: number
          format: double
          description: Of ONE vCPU, as `top` counts it — a process busy on two reads 200.
          example: 12.5
        memoryBytes:
          type: integer
          format: int64
          description: Its resident memory.
          example: 52428800
        startedAt: {type: string, format: date-time}
        kernelThread:
          type: boolean
          description: A thread of the guest's kernel rather than a process anything started.
    SandboxConfig:
      type: object
      properties:
        resources: {$ref: "#/components/schemas/Resources"}
        idleSeconds:
          type: integer
          minimum: 0
          description: How long without a turn or a running background task before the session sleeps; 0 never.
        allow:
          type: array
          description: Hosts the sandbox reaches from the start, without its harness asking.
          items: {type: string, example: pypi.org}
        internet:
          type: boolean
          description: |
            Whether the sandbox reaches the whole internet from the start, on
            every port: every public address, and nothing of the network
            the sandboxes daemon is on. `allow` is then moot.
        nested:
          type: boolean
          description: |
            Whether the sandbox gets a working `/dev/kvm` of its own, to run
            virtual machines in. The sandboxes daemon refuses it on a host
            that cannot give nested virtualisation, and the session fails to
            start saying so.
        placement: {$ref: "#/components/schemas/Placement"}
        image:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            What the sandbox boots, as an OCI reference: any image, built
            from any recipe its owner already has. The harness is not in it:
            it is mounted beside it, from its bundle (`GET /v1/harnesses`,
            `bundle`), with the tools it shells out to, for an image that has
            none of its own. Pin it by digest: a session's disk is laid over
            the image it first woke on, and keeps it. Refused beside a
            `recipe`, and for a harness this server runs from its own image
            alone (one with no `bundle`).
          example: python:3.12-slim
        recipe:
          type: string
          maxLength: 65536
          description: |
            What the sandbox boots, as a recipe built on any image (`POST
            /v1/images` says how one is written). The harness is not in it:
            it is mounted beside it from its bundle, as for `image`.

            A recipe starting `FROM harness/<name>` is built on that
            harness's own image, which holds it: a config naming no harness
            runs the recipe's, and one naming another is refused. **That is
            deprecated, and goes in a release soon**: start from any image
            instead. It is still what a harness with no `bundle` takes, and
            the only one.

            Absent, and with no `image`, the server's base image, or for a
            harness with no bundle, its own image. A session's disk is laid
            over the image it first woke on, so a session keeps that image:
            a profile's recipe changed later is for the sessions started
            after. Saved, it is built, and its image named after the profile,
            or the session, unless someone named it.
          example: |
            FROM python:3.12-slim
            RUN --allow=deb.debian.org apt-get update && apt-get install -y ripgrep
    Placement:
      type: object
      additionalProperties: false
      description: |
        Where the sandbox may run, among the sandboxes server's runners:
        passed as it is to each sandbox the session is given, read where
        the server places it (when it is made, and when it is made again
        after its runner is gone). Absent is anywhere. A session no
        runner meets fails to start, saying which constraint nobody
        meets.
      properties:
        labels:
          type: object
          description: Every one must be a runner's, as an assigned label or a fact it reports (`arch`, `kvm`, …), as equal strings.
          additionalProperties: {type: string}
          example: {region: eu}
    SessionConfig:
      type: object
      description: Everything a session is started with. In a session, any field overrides its profile's.
      properties:
        harness:
          type: string
          description: "`claude-code` or `codex`; when absent, its recipe's, or the server's default. A session's is fixed once made."
          example: claude-code
        terminal:
          type: boolean
          description: |
            Whether a person runs the harness in a terminal, as on their own
            machine (`GET /v1/sessions/{sessionId}/attach`), rather than the
            server giving it turns. Such a session takes no turn, compaction,
            rewind or fork, and has no transcript of its conversation: its
            harness's screen is the person's. Fixed once made.
        provider:
          allOf: [{$ref: "#/components/schemas/Name"}]
          description: |
            The provider it runs on, by name, of a type its harness runs on
            (`400` otherwise); when absent, that of the session that started
            it, if on the same harness and its person may use it, else its
            harness's `defaultProvider`.
        model:
          type: string
          description: |
            One of its provider's `models`, as the provider spells it. When
            absent, and nothing it is started from names one: that of the
            session that started it, as it runs now, if on the same harness
            and its provider lists it; else the server's configured model
            for the harness, if its provider lists it; else its provider's
            newest. One the provider has not
            listed is not refused here — the provider is the judge, at the
            turn.
          example: claude-opus-5-5
        systemPrompt:
          type: string
          maxLength: 100000
          description: Appended to the harness's own.
        brokers:
          type: array
          description: |
            The brokers the session is given, by name. `llm` always is; absent, the server's own four.
            Built-ins the workspace's policy does not allow are dropped, as kept and as read.
          items: {$ref: "#/components/schemas/Name"}
        mcpConnectors:
          type: array
          description: The MCP connectors the session is given, by name.
          items: {$ref: "#/components/schemas/Name"}
        env:
          type: object
          description: Variables of the session's environment. Never a secret — those are brokers'.
          additionalProperties: {type: string}
        sandbox: {$ref: "#/components/schemas/SandboxConfig"}
    ProfileSpec:
      allOf:
        - $ref: "#/components/schemas/SessionConfig"
        - type: object
          required: [title]
          properties:
            title: {type: string, maxLength: 200, example: Reviewer}
            description: {type: string, maxLength: 2000}
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileSpec"
        - $ref: "#/components/schemas/Owned"
        - type: object
          required: [id, version, createdAt, updatedAt]
          properties:
            id: {$ref: "#/components/schemas/Id"}
            version: {type: integer, minimum: 1}
            image:
              allOf:
                - $ref: "#/components/schemas/Image"
              description: Its `sandbox.recipe`'s image, when it has one.
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    ProfileVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Profile"}
    ProfileRecipe:
      type: object
      required: [recipe]
      additionalProperties: false
      properties:
        recipe:
          type: string
          maxLength: 65536
          description: A recipe, as `sandbox.recipe` takes one, in place of the profile's recipe or image; empty boots the profile's image, or with none the server's base image (the harness's own, for a harness with no bundle).
    ProfilePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/Profile"}
    ImageId:
      type: string
      pattern: "^img_[0-9a-f]{16}$"
      description: What an image is made of — its recipe, on its harness's image — hashed.
      example: img_4c1e9a7f2b06d3a1
    ImageState:
      type: string
      description: |
        | state | what it means |
        |---|---|
        | `building` | its build is queued or running |
        | `ready` | built: `ref` is what a sandbox boots |
        | `failed` | its build failed or was cancelled; `error` says why, and asking for it again builds it again |
      enum: [building, ready, failed]
      # Named here: a third enum with `ready` and `failed` in it leaves
      # oapi-codegen prefixing one of them by chance.
      x-enum-varnames: [ImageBuilding, ImageReady, ImageFailed]
    ImageRequest:
      type: object
      required: [recipe, name]
      additionalProperties: false
      properties:
        recipe: {type: string, minLength: 1, maxLength: 65536}
        name: {$ref: "#/components/schemas/ImageTitle"}
        description: {$ref: "#/components/schemas/ImageDescription"}
    ImageTitle:
      type: string
      minLength: 1
      maxLength: 100
      description: What a person picks the image by.
      example: Coder
    ImageDescription:
      type: string
      maxLength: 2000
      description: What the image is for, and what it holds.
      example: Go, Node and the GitHub CLI, for working on runyard.
    ImageName:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/ImageTitle"}
        description: {$ref: "#/components/schemas/ImageDescription"}
    ImageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Image"}
    Image:
      type: object
      required: [id, recipe, state]
      properties:
        id: {$ref: "#/components/schemas/ImageId"}
        recipe: {type: string}
        name:
          allOf:
            - $ref: "#/components/schemas/ImageTitle"
          description: What it is called, once someone named it.
        description: {$ref: "#/components/schemas/ImageDescription"}
        state: {$ref: "#/components/schemas/ImageState"}
        error: {type: string}
        ref:
          type: string
          description: Once `ready`, the image built, pinned by digest.
          example: 127.0.0.1:5002/runyard/agents/img_4c1e9a7f2b06d3a1@sha256:1805c461…
        createdAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
    DeploymentRequest:
      type: object
      required: [image, name]
      additionalProperties: false
      properties:
        image:
          $ref: "#/components/schemas/ImageId"
        name:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$"
          description: What it is called, for whoever reads the list.
          example: preview
        cpus: {type: integer, minimum: 1, maximum: 16}
        memory:
          type: string
          pattern: "^[0-9]+(Mi|Gi)$"
          example: 1Gi
        disk:
          type: string
          pattern: "^[0-9]+(Mi|Gi)$"
          description: |
            The room it has to write in, what `df /` says inside it; the
            image's own files do not count against it. The daemon's default
            when absent. Held against the workspace's disk quota for as long
            as the deployment exists, stopped or not.
          example: 100Gi
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          description: How long it runs before it is stopped. A day when absent.
        nested:
          type: boolean
          description: |
            Whether it gets a working `/dev/kvm` of its own, to run virtual
            machines in. Without it, a deployment has none. On a host that
            cannot give nested virtualisation it is a `400` `not_supported`.
        allow:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 253, example: oauth2.googleapis.com}
          description: |
            Hosts it reaches on `tcp/443`, from when it boots, by name
            (`api.anthropic.com`) or suffix (`*.pythonhosted.org`). It reaches
            nothing else. Set when it is made, and kept for its life: a
            deployment that needs other hosts is made again. A name of this
            host or its network (`localhost`, `*.internal`, …), an address,
            a range, or a wildcard over a public suffix is a `400`.
        secrets:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {$ref: "#/components/schemas/SecretName"}
          description: |
            The caller's person's secrets it is given, each a file
            `/run/secrets/<name>` in it before its entrypoint starts, readable
            by the image's `USER` alone. The values are the ones set now: a
            secret replaced later is not seen until it is made again. One the
            person has not set is a `400`.
    DeploymentLease:
      type: object
      additionalProperties: false
      properties:
        ttlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          description: From now. A day when absent.
    DeploymentState:
      type: string
      description: |
        | state | what it means |
        |---|---|
        | `booting` | its sandbox is being made or booted |
        | `running` | its entrypoint runs |
        | `stopped` | switched off, its disk kept; `start` boots it |
        | `expired` | stopped because `expiresAt` passed; `start` boots it |
        | `failed` | its sandbox failed; `error` says why |
      enum: [booting, running, stopped, expired, failed]
      x-enum-varnames: [DeploymentBooting, DeploymentRunning, DeploymentStopped, DeploymentExpired, DeploymentFailed]
    Deployment:
      type: object
      required: [id, name, image, owner, state, sealed, expiresAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        image: {$ref: "#/components/schemas/ImageId"}
        owner:
          type: string
          description: The person it is, by address.
        sessionId:
          type: string
          description: The session that made it, when one did — kept after the session is deleted.
        state: {$ref: "#/components/schemas/DeploymentState"}
        error: {type: string}
        cpus: {type: integer}
        memory: {type: string}
        disk: {type: string}
        nested:
          type: boolean
          description: Whether it has a `/dev/kvm` of its own.
        secrets:
          type: array
          items: {$ref: "#/components/schemas/SecretName"}
          description: The secrets it was given, by name.
        allow:
          type: array
          items: {type: string}
          description: The hosts it reaches.
        sealed:
          type: boolean
          description: Whether commands, file writes and terminals in it are refused now.
        tainted: {$ref: "#/components/schemas/DeploymentTaint"}
        expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    DeploymentTaint:
      type: object
      description: >-
        The first command, file write or terminal in a deployment: from then on, what runs in it is not only its recipe. Never taken away.
      required: [at, by, route]
      properties:
        at: {type: string, format: date-time}
        by:
          type: string
          description: The person who ran it, or whose session did.
        sessionId:
          type: string
          description: The session that ran it, when one did.
        route:
          type: string
          description: The sandboxes daemon's route it came through.
    DeploymentCommand:
      type: object
      required: [argv]
      additionalProperties: false
      properties:
        argv:
          type: array
          minItems: 1
          maxItems: 256
          items: {type: string, maxLength: 65536}
          description: Already split; not a shell line.
        dir: {type: string, maxLength: 4096}
        env:
          type: object
          maxProperties: 64
          additionalProperties: {type: string, maxLength: 65536}
        user:
          type: string
          maxLength: 64
          description: "`name` or `uid:gid`; the image's own `USER` when absent."
        timeoutSeconds: {type: integer, minimum: 1, maximum: 600}
    DeploymentCommandResult:
      type: object
      required: [exitCode, stdout, stderr, truncated, durationMs]
      properties:
        exitCode: {type: integer}
        stdout: {type: string}
        stderr: {type: string}
        truncated:
          type: boolean
          description: Its output hit the daemon's cap; this is the beginning of it.
        durationMs: {type: integer, format: int64}
    SecretName:
      type: string
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      example: google-client-secret
    Secret:
      type: object
      required: [name, createdAt, updatedAt]
      description: A secret, never its value.
      properties:
        name: {$ref: "#/components/schemas/SecretName"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DeletedLater:
      type: object
      description: |
        A delete the sandboxes server took for a runner that is away, and
        carries out once it is back.
      required: [waitingFor]
      properties:
        waitingFor: {$ref: "#/components/schemas/InfrastructureRunner"}
    SecretList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Secret"}
    SecretValue:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 65536
          description: The value, as the file in a deployment will hold it.
    DeploymentApprovalState:
      type: string
      description: |
        | state | what it means |
        |---|---|
        | `pending` | waiting for the person |
        | `approved` | made: `deploymentId` is it |
        | `refused` | the person said no |
      enum: [pending, approved, refused]
      x-enum-varnames: [ApprovalPending, ApprovalApproved, ApprovalRefused]
    DeploymentApproval:
      type: object
      required: [id, owner, sessionId, request, state, createdAt]
      properties:
        id: {type: string, format: uuid}
        owner:
          type: string
          description: The person who decides, by address.
        sessionId:
          type: string
          description: The session that asked.
        request: {$ref: "#/components/schemas/DeploymentRequest"}
        state: {$ref: "#/components/schemas/DeploymentApprovalState"}
        deploymentId:
          type: string
          format: uuid
          description: Once approved, the deployment made.
        createdAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time}
    DeploymentApprovalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/DeploymentApproval"}
    DeploymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Deployment"}
    TunnelName:
      type: string
      pattern: "^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$"
      example: web
    TunnelSpec:
      type: object
      required: [port]
      additionalProperties: false
      properties:
        port: {type: integer, minimum: 1, maximum: 65535, example: 8080}
        description: {type: string, maxLength: 200}
        emails:
          type: array
          maxItems: 64
          description: Who may reach it by signing in. Its owner when empty.
          items: {type: string, format: email, maxLength: 254}
    TunnelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Tunnel"}
    BrokerAuth:
      type: string
      enum: [certificate, jwt]
      default: certificate
      description: |
        How the sandboxes daemon proves to a declared broker which sandbox
        calls. Absent is `certificate`.

        | auth | how |
        |---|---|
        | `certificate` | a TLS client certificate the daemon mints for the sandbox, the connection's bytes relayed as they are |
        | `jwt` | `Authorization: Bearer <jwt>` on every request, the daemon carrying the sandbox's requests as HTTP; the broker is any HTTP server, behind any proxy |

        The token is ES256, signed with the key of the very certificate
        `certificate` would present, which it carries in `x5c`, for `aud`
        the broker's `url`: the broker verifies it as it would that
        certificate. The daemon puts it on in place of any `Authorization`
        the sandbox sent.
    BrokerKind:
      type: string
      description: |
        | kind | what the session reaches |
        |---|---|
        | `llm` | the model providers, with their credentials — the server's own |
        | `egress` | the internet, one host at a time, as the session asks — the server's own |
        | `tunnels` | publishing its ports as addresses — the server's own |
        | `sessions` | this server, as its session — to start and talk to other sessions — the server's own |
        | `images` | this server, as its session — to build images from recipes, and deploy them: boot sealed sandboxes, read their logs, publish their ports — the server's own |
        | `shared` | a broker declared here, which the sandboxes daemon dials at its `url` with the machine's certificate, and this server serves nothing — so it keeps working while this server restarts |
      enum: [llm, egress, tunnels, sessions, images, shared]
    BrokerSpec:
      type: object
      required: [title, url]
      description: |
        A broker this workspace declares: by name, a title for people, and
        where it listens. The sandboxes daemon dials it there for each
        session given it, presenting the session's sandbox's certificate, so the
        broker knows which sandbox calls and holds whatever credential it
        needs itself — or, with `auth: jwt`, putting a token saying so on
        each of its requests. How a session reaches it is the broker's to
        say — the environment and git configuration it describes at
        `/.well-known/runyard-broker`, `{url}` in them being its address in
        the machine:

        ```json
        {"version": "1",
         "env": {"SOME_API_URL": "{url}/v1"},
         "git": {"path": "/git/", "insteadOf": ["https://github.com/"]},
         "mcp": {"path": "/mcp"}}
        ```

        All are optional, and a broker that answers `404` there describes
        nothing; a description this server does not read is said in its log
        and given to no session. An `env` name is in capitals, digits and `_`,
        and none starts with `RUNYARD_`. `mcp` says the broker serves an MCP
        server (streamable HTTP) at `{url}{path}`: the session's harness is
        given it, named after the broker, beside its MCP connectors — with
        no credential, since the broker knows the sandbox by its
        certificate. An MCP connector of the session's of the same name is
        given instead. Its `path` starts with `/`, is at most 256
        characters, and has no `..`, query or fragment — nor a space, a
        control character or a backslash, which no address has.

        What a broker answers at `/.well-known/runyard-broker` and
        `/.well-known/agent-skills` is the same for every sandbox of the
        workspace, whichever presents its certificate: what one session's
        start is answered is given to the next. `Cache-Control: max-age` on
        either says how long that holds, taken for at most a day; once it
        has passed, a start is given what was kept while the broker is
        asked again beside it. Without it, or with `no-store` or
        `no-cache`, the broker is asked at every start. The files of its
        skills are kept by the SHA-256 its manifest names, whatever it
        says: a start fetches only those of a hash it does not have.
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        url:
          type: string
          maxLength: 2048
          description: >-
            Where the broker listens. With `auth: certificate`, `https`, as the sandbox's certificate is presented over TLS, and only its host and port are used: a session's request carries its own path. With `auth: jwt`, `http` or `https`, and its path is a prefix put before every request's own; `http` carries the token and everything else in the clear, for loopback or a private link.
          example: https://127.0.0.1:8453
        auth: {$ref: "#/components/schemas/BrokerAuth"}
        ca:
          type: string
          maxLength: 65536
          description: >-
            PEM certificates the broker's own is verified with, for one whose certificate is not signed by a CA the sandboxes daemon's host trusts. A certificate, never a key.
        console:
          type: string
          maxLength: 2048
          description: >-
            Where this server reaches the broker's own console — its control plane, which has no sign-in of its own — opened to the workspace's admins at `/v1/brokers/{brokerName}/console/`. For a broker beside this server, on a private address only it reaches: an absolute `http` or `https` URL, with a path or none, and no user, query or fragment.
          example: http://github-broker.acme.svc.cluster.local:8090
    Broker:
      type: object
      required: [name, title, kind, builtin, everyone, users, updatedAt]
      properties:
        name: {$ref: "#/components/schemas/Name"}
        title: {type: string, minLength: 1, maxLength: 200}
        url:
          type: string
          description: Where the daemon dials it. Absent for a builtin, which this server serves.
        ca:
          type: string
          description: The PEM its certificate is verified with, when it has its own.
        console:
          type: string
          description: |
            Where this server reaches its own console, opened to admins at
            `/v1/brokers/{brokerName}/console/`. Absent for a builtin, and
            for a broker that has none.
        auth: {$ref: "#/components/schemas/BrokerAuth"}
        kind: {$ref: "#/components/schemas/BrokerKind"}
        builtin:
          type: boolean
          description: One of the server's own, which is nobody's and everyone's.
        owner:
          allOf: [{$ref: "#/components/schemas/Owner"}]
          description: Who declared it. Absent for a builtin.
        everyone:
          type: boolean
          description: Every person's sessions may be given it.
        users:
          type: array
          description: The people besides its owner whose sessions may be given it, by address, sorted.
          items: {type: string, format: email}
        updatedAt: {type: string, format: date-time}
        describedAt:
          type: string
          format: date-time
          description: |
            When a session's machine last read its description, at a wake.
            Absent for a builtin, and for a broker no session has read yet.
            This server cannot reach a shared broker itself: what it says of
            one is what that read found.
        mcp: {$ref: "#/components/schemas/BrokerMcp"}
    BrokerMcp:
      type: object
      required: [path]
      description: |
        The MCP server a shared broker's last description said it serves,
        at that path of its address; absent when it said none. Its tools are
        the broker's to list, and are not listed here.
      properties:
        path: {type: string, maxLength: 256}
    BrokerPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/Broker"}
    McpConnectorSpec:
      type: object
      required: [title, url, auth]
      properties:
        title: {type: string, maxLength: 200}
        url:
          type: string
          format: uri
          example: https://mcp.example.com/mcp
        auth: {$ref: "#/components/schemas/McpConnectorAuth"}
    McpConnectorAuth:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [none, header, oauth]
          x-enum-varnames: [McpConnectorAuthKindNone, McpConnectorAuthKindHeader, McpConnectorAuthKindOauth]
        header:
          type: string
          description: For `header`, its name.
          example: Authorization
        secret:
          type: string
          writeOnly: true
          description: For `header`, its value.
        clientId:
          type: string
          description: For `oauth`, when the server does not register itself dynamically.
        scopes:
          type: array
          items: {type: string}
    McpConnector:
      allOf:
        - $ref: "#/components/schemas/McpConnectorSpec"
        - $ref: "#/components/schemas/Owned"
        - type: object
          required: [name, status, tools, skills, updatedAt]
          properties:
            name: {$ref: "#/components/schemas/Name"}
            status:
              type: string
              enum: [ok, needs_authorization, unreachable, rejected]
            tools:
              type: array
              description: What its tools/list said, the last time it was asked.
              items: {$ref: "#/components/schemas/McpConnectorTool"}
            skills:
              type: array
              description: |
                The skills its server publishes, as the Agent Skills Discovery
                RFC v0.2.0 says: the index at
                `/.well-known/agent-skills/index.json` on the origin of its
                `url`, read with its credential whenever its tools are listed,
                and each `skill-md` entry it names on that same origin, its
                digest checked. Every session given the connector is given them,
                as a broker's skills are. Empty when its server publishes no
                index.
              items: {$ref: "#/components/schemas/McpConnectorSkill"}
            skillsError:
              type: string
              description: |
                Why its skills could not be read the last time they were asked
                for; `skills` are then those read before. Absent when they were
                read. It is not a refusal: a session given the connector has its
                tools all the same.
            skillsIgnored:
              type: array
              description: The skills of its index left out the last time, each with why — of a type other than `skill-md`, or breaking a rule of its own (its name, its digest, its address). The others are given all the same.
              items: {type: string}
            listedAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    McpConnectorSkill:
      type: object
      required: [name, description]
      properties:
        name: {type: string}
        description:
          type: string
          description: As the server's index describes it.
    McpConnectorTool:
      type: object
      required: [name, readOnly]
      properties:
        name: {type: string}
        title: {type: string}
        description: {type: string}
        readOnly:
          type: boolean
          description: The tool's `readOnlyHint`.
        inputSchema:
          type: object
          additionalProperties: true
          description: The JSON Schema of its input, as the MCP server declared it.
    McpConnectorPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: "#/components/schemas/McpConnector"}
    SessionState:
      type: string
      description: |
        The session's state; the sandbox's is `sandbox.state`.

        | state | what it means | what to do |
        |---|---|---|
        | `starting` | its sandbox is being made, or its harness started | wait; turns are queued |
        | `idle` | the session waits for a turn | send one |
        | `generating` | the session is answering | read the stream; a turn is queued |
        | `attached` | a person runs its harness in a terminal | wait for them to leave |
        | `sleeping` | its sandbox is released, its disk kept | send a turn, or wake it |
        | `archived` | asleep, and refusing turns | restore it |
        | `failed` | its sandbox could not be made, or the session could not be started, again and again | read `error`; delete it, or fork it |
      enum: [starting, idle, generating, attached, sleeping, archived, failed]
    SandboxState:
      type: string
      description: |
        | state | what it means |
        |---|---|
        | `creating` | asked of runyard-sandboxes |
        | `booting` | made, and starting |
        | `ready` | up |
        | `unreachable` | up, and not answering |
        | `released` | given back while the session sleeps; the disk is kept |
        | `failed` | could not be made, or died; `error` says why |
      enum: [creating, booting, ready, unreachable, released, failed]
    SessionStarting:
      type: object
      required: [phase, since]
      description: |
        What a session that is `starting` is doing, and how far it got. Kept
        on one whose start `failed`, saying where (`failed`), until it starts
        again; absent otherwise.

        | phase | what it means |
        |---|---|
        | `building` | its image is being built from `config.sandbox.recipe` — by this start, or by an earlier one that asked for the same recipe and image, which it waits on; `build` says how far |
        | `booting` | its sandbox is being made, and booted |
        | `harness` | its harness is being started in its sandbox |

        A step of its build is said on its events (a `state` event) as it
        begins; the build's log moves on here — and so on `GET /v1/changes`
        — every few seconds at most.
      properties:
        phase:
          type: string
          enum: [building, booting, harness]
          # Named here: `booting` is a sandbox's state too, and an enum
          # sharing a value with another leaves oapi-codegen prefixing some
          # other enum's names by chance.
          x-enum-varnames: [StartingBuilding, StartingBooting, StartingHarness]
        since:
          type: string
          format: date-time
          description: When it began this phase.
        failed:
          type: boolean
          description: Its start failed in this phase; the session's `error` says why.
        build: {$ref: "#/components/schemas/BuildProgress"}
    BuildProgress:
      type: object
      required: [image, step, steps]
      description: How far the build of an image has got.
      properties:
        image: {$ref: "#/components/schemas/ImageId"}
        step:
          type: integer
          minimum: 0
          description: >-
            The step it is at, from 1 — the one running, the one that failed, or the last once all are done and it is pushing; 0 before the first.
        steps:
          type: integer
          minimum: 0
          description: How many steps its recipe has after its `FROM`; 0 until the daemon has said.
        instruction:
          type: string
          description: That step's instruction, as written.
          example: RUN go install github.com/bufbuild/buf/cmd/buf@v1.47.2
        stepSince:
          type: string
          format: date-time
          description: When that step began.
        logTail:
          type: array
          maxItems: 20
          description: The last lines of its log, oldest first, each cut at 300 characters.
          items: {type: string}
    SessionSource:
      type: string
      description: |
        | source | started by |
        |---|---|
        | `user` | a person, in the chat UI or console, or a session token in their browser |
        | `api` | a caller with a key |
        | `session` | another session's harness — `parentId` |
        | `fork` | forking another session — `branchedFrom` |
        | `trigger` | a trigger's firing — `trigger` |
      enum: [user, api, session, fork, trigger]
    SessionSpec:
      allOf:
        - $ref: "#/components/schemas/SessionConfig"
        - type: object
          properties:
            profileId: {$ref: "#/components/schemas/Id"}
            profileVersion:
              type: integer
              minimum: 1
              description: The session's latest when absent.
            title:
              type: string
              maxLength: 200
              description: Made from the first turn when absent — the one in `firstTurn`, or the first sent.
            autoTitle:
              type: boolean
              description: |
                Title the session from its conversation once its first answer
                has begun (`autoTitle`). Absent, its owner's preference
                (`/v1/self/preferences`).
            endUser:
              allOf: [{$ref: "#/components/schemas/EndUser"}]
              description: |
                Whom an application's session is for. Only an application
                names one, and it is `403` otherwise; absent, the session is
                the application's own. A session a session starts is for its
                parent's.
            parentId:
              allOf: [{$ref: "#/components/schemas/Id"}]
              description: |
                The session that started this one. Only a session calling
                through its brokers may name it — itself — so lineage cannot
                be forged.
            labels:
              type: object
              additionalProperties: {type: string}
            firstTurn: {$ref: "#/components/schemas/Turn"}
    SessionUpdate:
      type: object
      properties:
        title: {type: string, maxLength: 200}
        autoTitle:
          type: boolean
          description: Title it from its conversation, or stop to.
        labels:
          type: object
          description: Replaces them all.
          additionalProperties: {type: string}
        provider: {$ref: "#/components/schemas/Name"}
        model: {type: string}
        brokers:
          type: array
          items: {$ref: "#/components/schemas/Name"}
        mcpConnectors:
          type: array
          items: {$ref: "#/components/schemas/Name"}
        resources: {$ref: "#/components/schemas/Resources"}
        restartSandbox:
          type: boolean
          default: false
          description: Make the sandbox again now, at the new resources. `409` while generating.
        locked:
          type: boolean
          description: |
            Lock it, so that it is neither archived nor deleted — by the
            workspace's `sessionRetention` or by anybody — until it is
            unlocked; or unlock it, which starts its idle time again.
        pinned:
          type: boolean
          description: |
            Pin it, so that its sandbox is never put to sleep for being idle
            — what it serves, a tunnel to it, keeps running — and the
            workspace's `sessionRetention` neither archives nor deletes it; or
            unpin it, which starts its idle time again. A person may still
            put it to sleep, archive or delete it.
    Lineage:
      type: object
      required: [nodes, truncated]
      properties:
        nodes:
          type: array
          description: Depth first from the root; `self` marks the session asked about.
          items: {$ref: "#/components/schemas/LineageNode"}
        truncated: {type: boolean}
    SessionLineage:
      type: object
      required: [source, rootId, depth]
      properties:
        source: {$ref: "#/components/schemas/SessionSource"}
        parentId:
          allOf: [{$ref: "#/components/schemas/Id"}]
          description: For `session` and `fork`, and for a trigger fired with one.
        parentToolId:
          type: string
          description: For `session`, the parent's tool call that started this session.
        rootId:
          allOf: [{$ref: "#/components/schemas/Id"}]
          description: The top of the tree; itself for a root.
        depth: {type: integer, minimum: 0}
        branchedFrom: {$ref: "#/components/schemas/BranchedFrom"}
        trigger: {$ref: "#/components/schemas/TriggerRef"}
        keyId:
          type: string
          description: For `api`, the key that started it.
    Usage:
      type: object
      required: [inputTokens, outputTokens, costUsd]
      properties:
        inputTokens: {type: integer, format: int64}
        outputTokens: {type: integer, format: int64}
        cacheReadTokens: {type: integer, format: int64}
        cacheWriteTokens: {type: integer, format: int64}
        contextTokens:
          type: integer
          format: int64
          description: What the context holds now — after the last turn, not a sum.
        contextWindow:
          type: integer
          description: How much the context may hold, the model's as its provider lists it — not a sum. Absent when the provider does not say.
        costUsd:
          type: number
          format: double
          description: |
            What the tokens cost at list prices: as the harness says, or,
            for a harness that says nothing of cost (Codex), as the server
            prices the calls the `llm` broker saw.
    CostWindow:
      type: string
      enum: ["24h", "7d", "30d", "90d"]
      x-enum-varnames: [CostWindow24h, CostWindow7d, CostWindow30d, CostWindow90d]
      description: >-
        How far back. `24h` is hour by hour; the others are day by day, each day in UTC.
    CostRates:
      type: object
      description: >-
        What an hour of each thing costs now, in `currency`, as the daemon's configuration names it.
      required: [currency, vcpuHour, memoryGiBHour, diskGiBHour, tunnelHour]
      properties:
        currency: {type: string, example: USD}
        vcpuHour:
          type: number
          format: double
          minimum: 0
          description: A vCPU of a running sandbox, not a paused one, for an hour.
          example: 0.04
        memoryGiBHour:
          type: number
          format: double
          minimum: 0
          description: A GiB of a running sandbox's memory, for an hour.
          example: 0.005
        diskGiBHour:
          type: number
          format: double
          minimum: 0
          description: A GiB of a volume, at the size it may grow to, or of an image, for an hour.
          example: 0.0001
        tunnelHour:
          type: number
          format: double
          minimum: 0
          description: A tunnel served, for an hour.
          example: 0.01
    CostAmounts:
      type: object
      description: An amount, in the report's currency, by what it was for.
      required: [sandboxes, volumes, images, tunnels, total]
      properties:
        sandboxes: {type: number, format: double, description: "Running sandboxes: their vCPUs and memory."}
        volumes: {type: number, format: double, description: "Volumes, every sandbox's disk among them."}
        images: {type: number, format: double}
        tunnels: {type: number, format: double}
        total: {type: number, format: double, description: The four together.}
    CostBucket:
      type: object
      description: What was spent in one step of the window, from `at`.
      required: [at, amounts]
      properties:
        at: {type: string, format: date-time}
        amounts: {$ref: "#/components/schemas/CostAmounts"}
    CostKind:
      type: string
      enum: [sandbox, volume, image, tunnel]
      x-enum-varnames: [CostKindSandbox, CostKindVolume, CostKindImage, CostKindTunnel]
    CostUse:
      type: object
      description: >-
        What something used over the window: each quantity it held, times the hours it held it.
      required: [seconds, vcpuHours, memoryGiBHours, diskGiBHours, tunnelHours]
      properties:
        seconds: {type: number, format: double, description: How long it was charged for.}
        vcpuHours: {type: number, format: double}
        memoryGiBHours: {type: number, format: double}
        diskGiBHours: {type: number, format: double}
        tunnelHours: {type: number, format: double}
    CostCharge:
      type: object
      description: What each part of a use cost, at the rates of the moment it was used.
      required: [vcpu, memory, disk, tunnel]
      properties:
        vcpu: {type: number, format: double}
        memory: {type: number, format: double}
        disk: {type: number, format: double}
        tunnel: {type: number, format: double}
    CostResource:
      type: object
      description: >-
        One thing that cost anything in the window, or was held in it: what it was when it was last seen, what it used and cost, and, while it is held, what it costs an hour.
      required: [kind, id, labels, live, perHour, firstSeenAt, lastSeenAt, use, charge, cost]
      properties:
        kind: {$ref: "#/components/schemas/CostKind"}
        id:
          type: string
          description: >-
            A sandbox's id, a volume's name, an image's id, and a tunnel's sandbox id and name, as `<sandbox>/<tunnel>`.
        name:
          type: string
          description: What a person knows it by, when its id is not that — an image's reference, a tunnel's name.
        labels:
          type: object
          additionalProperties: {type: string}
          description: A sandbox's labels, as it was last seen.
        cpus: {type: integer, minimum: 0, description: "A sandbox's vCPUs."}
        memoryBytes: {type: integer, format: int64, minimum: 0, description: "A sandbox's memory."}
        diskBytes: {type: integer, format: int64, minimum: 0, description: "A volume's or an image's size."}
        live:
          type: boolean
          description: Whether it is charged for now. A sandbox stopped or deleted, a volume let go, is not.
        paused:
          type: boolean
          description: >-
            A sandbox paused now, charged for its memory and not its vCPUs: a pause stops them and keeps the memory.
        perHour:
          type: number
          format: double
          description: What it costs an hour now, at today's rates; 0 when it is not live.
        firstSeenAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        use: {$ref: "#/components/schemas/CostUse"}
        charge: {$ref: "#/components/schemas/CostCharge"}
        cost: {type: number, format: double, description: What it cost over the window.}
        session:
          type: object
          description: >-
            The session it is: a session's sandbox, and its volume. Absent for what is no session's, and for a session since deleted.
          required: [id, title]
          properties:
            id: {$ref: "#/components/schemas/Id"}
            title: {type: string}
        deployment:
          type: string
          description: The deployment it is, by name, for a deployment's sandbox.
    InfrastructureKind:
      type: string
      enum: [sandbox, volume, image]
      x-enum-varnames: [InfrastructureKindSandbox, InfrastructureKindVolume, InfrastructureKindImage]
    InfrastructureItem:
      type: object
      description: >-
        One thing of the workspace's sandboxes server: what it is now, when it is there, and what it costs, when it was metered in the window.
      required: [kind, id, name, there, window, currency]
      properties:
        kind: {$ref: "#/components/schemas/InfrastructureKind"}
        id: {type: string}
        name: {type: string, description: What a person knows it by.}
        there: {type: boolean, description: Whether it is there now.}
        window: {$ref: "#/components/schemas/CostWindow"}
        currency: {type: string}
        cost:
          description: Its cost over the window, and an hour now; absent when it was not metered in it.
          allOf: [{$ref: "#/components/schemas/CostResource"}]
        ownedBy:
          description: What it is part of, which manages it; absent for what is no session's, deployment's or workspace image.
          allOf: [{$ref: "#/components/schemas/InfrastructureOwner"}]
        madeBy: {type: string, description: "Who made it, and with which key."}
        createdAt: {type: string, format: date-time}
        sandbox: {$ref: "#/components/schemas/InfrastructureSandbox"}
        volume: {$ref: "#/components/schemas/InfrastructureVolume"}
        image: {$ref: "#/components/schemas/InfrastructureImage"}
    InfrastructureOwner:
      type: object
      properties:
        session: {$ref: "#/components/schemas/SessionRef"}
        deployment: {type: string, description: The deployment's id.}
        image: {type: string, description: The workspace's image's id.}
    SessionRef:
      type: object
      required: [id, title]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        title: {type: string}
    InfrastructureSandbox:
      type: object
      required: [state, image]
      properties:
        state: {type: string, description: As runyard-sandboxes says it.}
        image: {type: string}
        cpus: {type: integer}
        memory: {type: string}
        labels:
          type: object
          additionalProperties: {type: string}
        volume: {type: string, description: The volume its disk is.}
        runner:
          allOf: [{$ref: "#/components/schemas/InfrastructureRunner"}]
          description: The runner it is on. Absent on a sandboxes server whose machines run on no runner.
        transferringTo:
          allOf: [{$ref: "#/components/schemas/InfrastructureRunner"}]
