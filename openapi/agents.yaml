        attachments. A hold on it (`PUT …/hold`) is let go of: the session is
        given it, as it says now, when its turn comes. `404` once the harness
        has taken it — it is on the stream then, as it was — or when no turn
        of that id waits; `409` for the session's first turn, which its
        harness is given as soon as it is up: take it back instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QueuedTurnEdit"}
      responses:
        "200":
          description: Changed; the turn as it waits now.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QueuedTurn"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/sessions/{sessionId}/queue/{turnId}/hold:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/QueuedTurnId"
    put:
      operationId: holdQueuedTurn
      x-public: true
      tags: [Turns]
      summary: Keep a turn waiting while somebody edits it
      description: |
        While a turn is held, the session is not given it — nor any turn
        behind it, which keep their order — however long its harness has
        been free: it waits for the edit (`PATCH …/queue/{turnId}`), or for
        the hold to be let go of (`DELETE …/hold`), and is given then. A
        hold lasts until its `heldUntil`, five minutes from when it was
        last asked for, so that an editor that went away stops no session
        for long: asked again, it is kept that much longer. Turns ahead of
        it are given as they would be. `404` once the harness has taken it,
        or when no turn of that id waits; `409` for the session's first
        turn, which its harness is given as soon as it is up.
      responses:
