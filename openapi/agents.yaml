      tags: [Sessions]
      summary: The tree this session belongs to
      description: |
        From its root — a person's session, a caller's, or a trigger's
        firing — down, depth first, every session started or forked from
        another in it. At most `limits.maxLineage` nodes; `truncated` says
        when there were more.
      responses:
        "200":
          description: The tree.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Lineage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
